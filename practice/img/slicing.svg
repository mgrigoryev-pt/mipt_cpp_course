<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 380" width="1060" height="380"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flow" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="378" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <text x="210" y="52" font-size="15" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">MatchRule</text>
  <text x="850" y="52" font-size="15" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">ячейка vector&lt;RuleBase&gt;</text>

  <!-- слева: полный объект -->
  <rect x="60" y="76" width="300" height="118" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="210" y="100" font-size="13" text-anchor="middle" fill="#80828c">часть RuleBase</text>
  <text x="210" y="126" font-size="14" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">id_   severity_</text>
  <text x="210" y="150" font-size="14" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">actions_   hits_</text>
  <text x="210" y="178" font-size="12" text-anchor="middle" fill="#5c5e66">то, что есть у любого правила</text>

  <rect x="60" y="200" width="300" height="94" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="210" y="232" font-size="14" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">conditions_</text>
  <text x="210" y="256" font-size="12" text-anchor="middle" fill="#80828c">вектор условий,</text>
  <text x="210" y="274" font-size="12" text-anchor="middle" fill="#80828c">ради которого правило и писали</text>

  <text x="210" y="322" font-size="13" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">sizeof(MatchRule)</text>

  <!-- копирование -->
  <line x1="380" y1="185" x2="674" y2="185" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="527" y="172" font-size="14" text-anchor="middle" fill="#dbdfe6">копирование наследника в базу</text>
  <text x="527" y="206" font-size="13" text-anchor="middle" fill="#80828c">совершенно законно, компилятор молчит</text>

  <!-- справа: только база -->
  <rect x="700" y="76" width="300" height="118" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="850" y="100" font-size="13" text-anchor="middle" fill="#80828c">часть RuleBase</text>
  <text x="850" y="126" font-size="14" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">id_   severity_</text>
  <text x="850" y="150" font-size="14" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">actions_   hits_</text>
  <text x="850" y="178" font-size="12" text-anchor="middle" fill="#5c5e66">доехало</text>

  <rect x="700" y="200" width="300" height="94" fill="none" stroke="#5c5e66"
        stroke-width="1.5" stroke-dasharray="7 6"/>
  <line x1="712" y1="282" x2="988" y2="212" stroke="#ff2020" stroke-width="2"/>
  <line x1="712" y1="212" x2="988" y2="282" stroke="#ff2020" stroke-width="2"/>
  <text x="850" y="322" font-size="13" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">sizeof(RuleBase)</text>

  <text x="530" y="356" font-size="14" text-anchor="middle" fill="#ff2020">Условия не доехали, и Check вызывать не у чего. Это срезка.</text>
</svg>
