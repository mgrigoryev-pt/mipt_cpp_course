<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 820" width="1080" height="820"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flow" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1078" height="818" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- ================= легенда ================= -->
  <g id="ownership" font-size="13">
    <text x="40" y="45" font-size="13" fill="#5c5e66"
          font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">файлы:</text>

    <rect x="100" y="28" width="104" height="24" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="152" y="45" text-anchor="middle" fill="#80828c">комплект</text>

    <rect x="216" y="28" width="112" height="24" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="272" y="45" text-anchor="middle" fill="#dbdfe6">меняете</text>

    <rect x="340" y="28" width="132" height="24" fill="#dbdfe6"/>
    <text x="406" y="45" text-anchor="middle" fill="#0b0b0d" font-weight="bold">пишете с нуля</text>
  </g>
  <text x="492" y="45" font-size="13" fill="#5c5e66">комплект менять нельзя; остальное — ваш src/</text>

  <text x="40" y="78" font-size="13" fill="#5c5e66">связи:</text>
  <line x1="100" y1="73" x2="150" y2="73" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="160" y="78" font-size="13" fill="#80828c">хранит в поле</text>
  <line x1="290" y1="73" x2="340" y2="73" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="350" y="78" font-size="13" fill="#80828c">вызывает</text>
  <rect x="448" y="64" width="34" height="18" fill="none" stroke="#80828c" stroke-width="1.2"/>
  <rect x="454" y="68" width="22" height="10" fill="none" stroke="#80828c" stroke-width="1.2"/>
  <text x="492" y="78" font-size="13" fill="#80828c">наследник, внутри — его база</text>

  <line x1="40" y1="96" x2="1040" y2="96" stroke="#26262b" stroke-width="1"/>

  <!-- ================= main ================= -->
  <rect x="40" y="112" width="250" height="170" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="165" y="140" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">main</text>
  <line x1="56" y1="154" x2="274" y2="154" stroke="#26262b" stroke-width="1"/>
  <text x="56" y="176" font-size="12" fill="#80828c">объявлены: edr, reporter, source,</text>
  <text x="56" y="194" font-size="12" fill="#80828c">agent — порядок жизни</text>
  <text x="56" y="216" font-size="12" fill="#80828c">reporter.Stop() — до edr_flush</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="56" y="238" width="104" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="108" y="257" text-anchor="middle" fill="#dbdfe6">main.cpp</text>
  </g>

  <!-- main → источник -->
  <line x1="290" y1="170" x2="364" y2="170" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="327" y="162" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">Run</text>

  <!-- ================= OsSource ================= -->
  <rect x="370" y="112" width="360" height="170" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="386" y="140" font-size="17" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">OsSource</text>
  <rect x="596" y="122" width="120" height="26" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="656" y="140" font-size="12" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">IEventSource</text>
  <text x="386" y="172" font-size="12" fill="#80828c">трамплин — на потоке доставки;</text>
  <text x="386" y="190" font-size="12" fill="#80828c">os_wait и тик — на главном потоке;</text>
  <text x="386" y="208" font-size="12" fill="#80828c">очередь есть на шагах 2–4, потом нет.</text>
  <text x="386" y="226" font-size="12" fill="#80828c">FileSource там же: line и parts до цикла</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="386" y="240" width="88" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="430" y="259" text-anchor="middle" fill="#dbdfe6">sources.h</text>
    <rect x="484" y="240" width="108" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="538" y="259" text-anchor="middle" fill="#dbdfe6">sources.cpp</text>
  </g>

  <!-- ================= тесты ================= -->
  <rect x="784" y="112" width="256" height="170" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="912" y="136" font-size="14" text-anchor="middle" fill="#80828c">выданные тесты</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="12" fill="#80828c">
    <text x="800" y="160">parse_view_tests.cpp</text>
    <text x="800" y="196">reporter_tests.cpp</text>
    <text x="800" y="232">shared_tests.cpp</text>
    <text x="800" y="268">run_modes.cmake</text>
  </g>
  <g font-size="12" fill="#5c5e66">
    <text x="814" y="177">→ разбор, Event из view</text>
    <text x="814" y="213">→ Reporter</text>
    <text x="814" y="249">→ счётчик, родитель, без событий</text>
    <text x="924" y="268">→ два режима</text>
  </g>

  <!-- источник → агент -->
  <line x1="560" y1="282" x2="560" y2="344" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="572" y="304" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">HandleEvent</text>
  <text x="572" y="320" font-size="12" fill="#80828c">поток доставки</text>
  <line x1="450" y1="282" x2="450" y2="344" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="438" y="304" font-size="12" text-anchor="end" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">OnTick</text>
  <text x="438" y="320" font-size="12" text-anchor="end" fill="#80828c">главный поток</text>

  <!-- источник → разбор -->
  <line x1="370" y1="250" x2="166" y2="344" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="226" y="300" font-size="12" text-anchor="end" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">ParseEventParts</text>

  <!-- ================= Agent ================= -->
  <rect x="370" y="350" width="360" height="190" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="386" y="378" font-size="17" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">Agent</text>
  <rect x="580" y="360" width="136" height="26" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="648" y="378" font-size="12" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">IEventHandler</text>
  <text x="386" y="410" font-size="13" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">mutex_ : std::mutex</text>
  <text x="386" y="430" font-size="12" fill="#80828c">HandleEvent и OnTick — под ним</text>
  <text x="386" y="452" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">model_  window_  engine_</text>
  <text x="386" y="472" font-size="12" fill="#80828c">печать [COPY] — через get()</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="386" y="496" width="84" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="428" y="515" text-anchor="middle" fill="#dbdfe6">agent.h</text>
    <rect x="480" y="496" width="104" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="532" y="515" text-anchor="middle" fill="#dbdfe6">agent.cpp</text>
  </g>

  <!-- агент → поток отчёта -->
  <line x1="730" y1="430" x2="778" y2="430" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="754" y="420" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">Sink()</text>

  <!-- тесты → Reporter -->
  <line x1="1010" y1="282" x2="1010" y2="344" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>

  <!-- ================= Reporter ================= -->
  <rect x="784" y="350" width="256" height="190" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="800" y="378" font-size="17" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">Reporter</text>
  <text x="800" y="404" font-size="12" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">pending_ : deque&lt;Detection&gt;</text>
  <text x="800" y="424" font-size="12" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">thread_ : jthread — последним</text>
  <text x="800" y="446" font-size="12" fill="#80828c">свой поток зовёт EdrSink;</text>
  <text x="800" y="464" font-size="12" fill="#80828c">Stop дожидается, а не просит</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="800" y="496" width="96" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="848" y="515" text-anchor="middle" fill="#80828c">reporter.h</text>
    <rect x="906" y="496" width="112" height="28" fill="#dbdfe6"/>
    <text x="962" y="515" text-anchor="middle" fill="#0b0b0d" font-weight="bold">reporter.cpp</text>
  </g>

  <!-- ================= разбор ================= -->
  <rect x="40" y="350" width="250" height="190" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="56" y="378" font-size="17" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">разбор строки</text>
  <text x="56" y="404" font-size="12" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">EventPartsView, FieldView</text>
  <text x="56" y="426" font-size="12" fill="#80828c">view смотрят внутрь line;</text>
  <text x="56" y="444" font-size="12" fill="#80828c">формы с Field и EventParts —</text>
  <text x="56" y="462" font-size="12" fill="#80828c">переходники поверх смотрящих</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="56" y="496" width="76" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="94" y="515" text-anchor="middle" fill="#80828c">parse.h</text>
    <rect x="142" y="496" width="96" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="190" y="515" text-anchor="middle" fill="#dbdfe6">parse.cpp</text>
  </g>

  <!-- разбор → событие -->
  <line x1="165" y1="540" x2="165" y2="594" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="177" y="566" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">Event(parts)</text>

  <!-- агент → модель -->
  <line x1="550" y1="540" x2="550" y2="594" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="562" y="566" font-size="12" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">model_</text>

  <!-- Reporter → WithoutEvidence -->
  <line x1="912" y1="540" x2="912" y2="594" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="924" y="566" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">WithoutEvidence</text>

  <!-- ================= Event ================= -->
  <rect x="40" y="600" width="250" height="190" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="56" y="628" font-size="17" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">Event</text>
  <text x="56" y="654" font-size="12" fill="#80828c">третий конструктор —</text>
  <text x="56" y="672" font-size="12" fill="#80828c">из EventPartsView, копирует</text>
  <text x="56" y="690" font-size="12" fill="#80828c">строки себе; Validate по view</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="56" y="746" width="76" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="94" y="765" text-anchor="middle" fill="#80828c">event.h</text>
    <rect x="142" y="746" width="96" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="190" y="765" text-anchor="middle" fill="#dbdfe6">event.cpp</text>
  </g>

  <!-- ================= EntityModel ================= -->
  <rect x="370" y="600" width="360" height="190" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="386" y="628" font-size="17" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">EntityModel</text>
  <text x="386" y="654" font-size="12" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">processes_ → shared_ptr&lt;ProcessRecord&gt;</text>
  <!-- запись процесса -->
  <rect x="386" y="666" width="190" height="48" fill="none" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="396" y="686" font-size="12" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">ProcessRecord</text>
  <text x="396" y="704" font-size="12" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">parent : weak_ptr</text>
  <text x="590" y="686" font-size="12" fill="#80828c">владение вниз,</text>
  <text x="590" y="704" font-size="12" fill="#80828c">наблюдение вверх</text>
  <text x="386" y="732" font-size="12" fill="#80828c">запоминается родитель с известным стартом</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="386" y="746" width="124" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="448" y="765" text-anchor="middle" fill="#80828c">entity_model.h</text>
    <rect x="520" y="746" width="140" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="590" y="765" text-anchor="middle" fill="#dbdfe6">entity_model.cpp</text>
  </g>

  <!-- ================= Detection ================= -->
  <rect x="784" y="600" width="256" height="86" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="800" y="622" font-size="12" fill="#80828c">копия детекта без событий</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="800" y="640" width="104" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="852" y="659" text-anchor="middle" fill="#80828c">detection.h</text>
    <rect x="912" y="640" width="116" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="970" y="659" text-anchor="middle" fill="#dbdfe6">detection.cpp</text>
  </g>

  <!-- ================= CopyStats ================= -->
  <rect x="784" y="698" width="256" height="92" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="800" y="720" font-size="12" fill="#80828c">счётчик копий: Counter атомарный,</text>
  <text x="800" y="736" font-size="12" fill="#80828c">ваше — обнуление через Reset()</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="800" y="746" width="104" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="852" y="765" text-anchor="middle" fill="#80828c">copy_stats.h</text>
    <rect x="912" y="746" width="120" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="972" y="765" text-anchor="middle" fill="#dbdfe6">copy_stats.cpp</text>
  </g>

</svg>
