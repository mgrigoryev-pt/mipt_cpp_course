<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 380" width="1060" height="380"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="378" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <text x="40" y="50" font-size="19" fill="#dbdfe6">FanOutSink: один вектор, три разных получателя</text>
  <text x="40" y="78" font-size="15" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">using AlertSink = Function&lt;void(const Detection&amp;)&gt;;</text>

  <!-- вектор AlertSink -->
  <text x="370" y="100" font-size="14" text-anchor="middle" fill="#5c5e66"
        font-family="Consolas, Roboto Mono, monospace">[0]</text>
  <text x="530" y="100" font-size="14" text-anchor="middle" fill="#5c5e66"
        font-family="Consolas, Roboto Mono, monospace">[1]</text>
  <text x="690" y="100" font-size="14" text-anchor="middle" fill="#5c5e66"
        font-family="Consolas, Roboto Mono, monospace">[2]</text>
  <rect x="290" y="108" width="160" height="58" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <rect x="450" y="108" width="160" height="58" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <rect x="610" y="108" width="160" height="58" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <text x="370" y="143" font-size="16" text-anchor="middle" fill="#ff8a8a">указатель</text>
  <text x="530" y="143" font-size="16" text-anchor="middle" fill="#ff8a8a">указатель</text>
  <text x="690" y="143" font-size="16" text-anchor="middle" fill="#ff8a8a">указатель</text>
  <text x="790" y="143" font-size="15" fill="#80828c">AlertSink одного размера</text>

  <line x1="370" y1="168" x2="168" y2="214" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>
  <line x1="530" y1="168" x2="530" y2="214" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>
  <line x1="690" y1="168" x2="878" y2="214" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>

  <!-- наследники в куче -->
  <text x="1020" y="206" font-size="15" text-anchor="end" fill="#80828c">куча</text>

  <rect x="40" y="218" width="256" height="104" fill="rgba(255,255,255,0.04)"
        stroke="#3a3a40" stroke-width="1.5"/>
  <text x="54" y="240" font-size="15" fill="#ffffff">наследник под ConsoleSink</text>
  <rect x="54" y="252" width="90" height="56" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="99" y="270" font-size="13" text-anchor="middle" fill="#80828c">база</text>
  <text x="99" y="296" font-size="16" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">vptr</text>
  <rect x="156" y="252" width="126" height="56" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="219" y="285" font-size="15" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">ConsoleSink</text>

  <rect x="320" y="218" width="420" height="104" fill="rgba(255,255,255,0.04)"
        stroke="#3a3a40" stroke-width="1.5"/>
  <text x="334" y="240" font-size="15" fill="#ffffff">наследник под FileSink</text>
  <rect x="334" y="252" width="90" height="56" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="379" y="270" font-size="13" text-anchor="middle" fill="#80828c">база</text>
  <text x="379" y="296" font-size="16" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">vptr</text>
  <rect x="436" y="252" width="290" height="56" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="581" y="276" font-size="15" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">FileSink</text>
  <text x="581" y="298" font-size="14" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">std::ofstream out_</text>

  <rect x="764" y="218" width="256" height="104" fill="rgba(255,255,255,0.04)"
        stroke="#3a3a40" stroke-width="1.5"/>
  <text x="778" y="240" font-size="15" fill="#ffffff">наследник под EdrSink</text>
  <rect x="778" y="252" width="90" height="56" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="823" y="270" font-size="13" text-anchor="middle" fill="#80828c">база</text>
  <text x="823" y="296" font-size="16" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">vptr</text>
  <rect x="880" y="252" width="126" height="56" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="943" y="276" font-size="15" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">EdrSink</text>
  <text x="943" y="298" font-size="14" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">EdrHandle*</text>

  <text x="530" y="356" font-size="16" text-anchor="middle" fill="#80828c">тип получателя известен только в конструкторе Function; FanOutSink знает одно — его можно вызвать</text>
</svg>
