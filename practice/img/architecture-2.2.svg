<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 652" width="1060" height="652"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flow" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="650" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- ================= легенда ================= -->
  <g id="ownership" font-size="13">
    <text x="40" y="45" font-size="13" fill="#5c5e66"
          font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">файлы:</text>

    <rect x="100" y="28" width="104" height="24" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="152" y="45" text-anchor="middle" fill="#80828c">комплект</text>

    <rect x="216" y="28" width="132" height="24" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="282" y="45" text-anchor="middle" fill="#dbdfe6">меняете</text>

    <rect x="360" y="28" width="132" height="24" fill="#dbdfe6"/>
    <text x="426" y="45" text-anchor="middle" fill="#0b0b0d" font-weight="bold">пишете с нуля</text>

    <rect x="504" y="28" width="116" height="24" fill="none" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="562" y="45" text-anchor="middle" fill="#5c5e66">не меняется</text>
  </g>
  <text x="640" y="45" font-size="13" fill="#5c5e66">комплект менять нельзя; остальное — ваш src/</text>

  <text x="40" y="78" font-size="13" fill="#5c5e66">связи:</text>
  <line x1="100" y1="73" x2="150" y2="73" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="160" y="78" font-size="13" fill="#80828c">хранит по значению</text>
  <line x1="320" y1="73" x2="370" y2="73" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="380" y="78" font-size="13" fill="#80828c">вызывает</text>
  <rect x="478" y="64" width="34" height="18" fill="none" stroke="#80828c" stroke-width="1.2"/>
  <rect x="484" y="68" width="22" height="10" fill="none" stroke="#80828c" stroke-width="1.2"/>
  <text x="522" y="78" font-size="13" fill="#80828c">наследник, внутри — его база</text>

  <line x1="40" y1="96" x2="1020" y2="96" stroke="#26262b" stroke-width="1"/>

  <!-- ================= Agent ================= -->
  <rect x="40" y="112" width="250" height="250" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="165" y="142" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">Agent</text>
  <line x1="56" y1="156" x2="274" y2="156" stroke="#26262b" stroke-width="1"/>
  <text x="58" y="184" font-size="14" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">HandleEvent(event)</text>
  <text x="58" y="206" font-size="13" fill="#80828c">каждому правилу — Check;</text>
  <text x="58" y="225" font-size="13" fill="#80828c">сработало — печать [DETECT]</text>
  <text x="58" y="258" font-size="14" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">PrintSummary()</text>
  <text x="58" y="280" font-size="13" fill="#80828c">+ hits() каждого правила</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="58" y="316" width="84" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="100" y="335" text-anchor="middle" fill="#dbdfe6">agent.h</text>
    <rect x="152" y="316" width="104" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="204" y="335" text-anchor="middle" fill="#dbdfe6">agent.cpp</text>
  </g>

  <!-- Agent → SeverityName -->
  <line x1="165" y1="362" x2="165" y2="406" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="176" y="389" font-size="12" fill="#80828c">печать важности</text>

  <!-- ================= SeverityName ================= -->
  <rect x="40" y="412" width="250" height="104" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="165" y="440" font-size="16" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">SeverityName</text>
  <text x="165" y="462" font-size="12" text-anchor="middle" fill="#80828c">таблица и CheckRules ушли</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="58" y="474" width="84" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="100" y="493" text-anchor="middle" fill="#80828c">rules.h</text>
    <rect x="152" y="474" width="104" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="204" y="493" text-anchor="middle" fill="#dbdfe6">rules.cpp</text>
  </g>

  <!-- ================= BuildAgentRules ================= -->
  <rect x="360" y="112" width="340" height="120" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="530" y="140" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">набор правил</text>
  <text x="530" y="163" font-size="13" text-anchor="middle" fill="#80828c">объекты MatchRule вместо таблицы kRules[]</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="378" y="184" width="138" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="447" y="203" text-anchor="middle" fill="#dbdfe6">agent_rules.h</text>
    <rect x="526" y="184" width="156" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="604" y="203" text-anchor="middle" fill="#dbdfe6">agent_rules.cpp</text>
  </g>

  <!-- Agent → набор правил -->
  <line x1="290" y1="160" x2="354" y2="160" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="322" y="152" font-size="12" text-anchor="middle" fill="#80828c">строит</text>

  <!-- набор правил → MatchRule -->
  <line x1="530" y1="232" x2="530" y2="264" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="542" y="253" font-size="12" fill="#80828c">создаёт, AddCondition, AddAction</text>

  <!-- ================= MatchRule : RuleBase ================= -->
  <rect x="360" y="270" width="340" height="190" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="530" y="298" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">MatchRule : RuleBase</text>
  <rect x="378" y="312" width="304" height="52" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="530" y="333" font-size="13" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">RuleBase</text>
  <text x="530" y="353" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">id_  severity_  actions_  hits_</text>
  <text x="530" y="388" font-size="13" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">conditions_ : vector&lt;Condition&gt;</text>
  <text x="530" y="408" font-size="12" text-anchor="middle" fill="#80828c">Check: все условия выполнены — и hits_ + 1</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="378" y="420" width="96" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="426" y="439" text-anchor="middle" fill="#80828c">rule.h</text>
    <rect x="484" y="420" width="104" height="28" fill="#dbdfe6"/>
    <text x="536" y="439" text-anchor="middle" fill="#0b0b0d" font-weight="bold">rule.cpp</text>
  </g>

  <!-- Agent → MatchRule: хранит и вызывает -->
  <line x1="290" y1="296" x2="354" y2="296" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="322" y="288" font-size="12" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">rules_</text>
  <line x1="290" y1="340" x2="354" y2="340" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="322" y="332" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">Check</text>

  <!-- MatchRule → Condition -->
  <line x1="530" y1="460" x2="530" y2="494" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="542" y="482" font-size="12" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">conditions_</text>

  <!-- ================= Condition ================= -->
  <rect x="360" y="500" width="340" height="128" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="530" y="528" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">Condition</text>
  <text x="530" y="551" font-size="13" text-anchor="middle" fill="#80828c">фабрики Equals, Contains, EndsWith</text>
  <text x="530" y="570" font-size="13" text-anchor="middle" fill="#80828c">operator(): switch по виду сравнения</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="378" y="584" width="138" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="447" y="603" text-anchor="middle" fill="#80828c">conditions.h</text>
    <rect x="526" y="584" width="156" height="28" fill="#dbdfe6"/>
    <text x="604" y="603" text-anchor="middle" fill="#0b0b0d" font-weight="bold">conditions.cpp</text>
  </g>

  <!-- ================= тесты ================= -->
  <rect x="770" y="112" width="250" height="120" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="895" y="138" font-size="14" text-anchor="middle" fill="#80828c">выданные тесты</text>
  <text x="786" y="166" font-size="13" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">rule_tests.cpp</text>
  <text x="786" y="185" font-size="12" fill="#5c5e66">→ Condition, RuleBase, MatchRule</text>
  <text x="786" y="208" font-size="13" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">conditions_tests.cpp</text>
  <text x="786" y="225" font-size="12" fill="#5c5e66">→ четыре функтора</text>

  <!-- ================= FindField и сравнение ================= -->
  <rect x="770" y="300" width="250" height="140" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="895" y="328" font-size="15" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">FindField(event, key)</text>
  <text x="895" y="350" font-size="13" text-anchor="middle" fill="#dbdfe6">и сравнение без регистра</text>
  <text x="895" y="370" font-size="12" text-anchor="middle" fill="#80828c">где оно лежит, решаете вы</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="788" y="392" width="96" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="836" y="411" text-anchor="middle" fill="#80828c">fields.h</text>
    <rect x="894" y="392" width="108" height="28" fill="none" stroke="#3a3a40" stroke-width="1.5"/>
    <text x="948" y="411" text-anchor="middle" fill="#5c5e66">fields.cpp</text>
  </g>

  <!-- Condition → FindField -->
  <path d="M 700 540 C 738 540, 732 400, 764 400" fill="none" stroke="#dbdfe6"
        stroke-width="2" marker-end="url(#flow)"/>

  <!-- функторы → FindField -->
  <line x1="895" y1="500" x2="895" y2="446" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>

  <!-- ================= четыре функтора ================= -->
  <rect x="770" y="500" width="250" height="128" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="895" y="525" font-size="13" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">FieldEquals  FieldContains</text>
  <text x="895" y="544" font-size="13" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">FieldEndsWith  FieldInList</text>
  <text x="895" y="567" font-size="12" text-anchor="middle" fill="#80828c">в правила не идут: в вектор не сложить</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="784" y="584" width="104" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="836" y="603" text-anchor="middle" fill="#80828c">conditions.h</text>
    <rect x="896" y="584" width="116" height="28" fill="#dbdfe6"/>
    <text x="954" y="603" text-anchor="middle" fill="#0b0b0d" font-weight="bold">conditions.cpp</text>
  </g>

</svg>
