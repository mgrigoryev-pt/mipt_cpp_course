<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 360" width="1060" height="360"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flow" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="358" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <text x="215" y="46" font-size="14" text-anchor="middle" fill="#5c5e66">было на 2.1</text>
  <text x="710" y="46" font-size="14" text-anchor="middle" fill="#5c5e66">стало на 2.2</text>

  <!-- было: таблица указателей -->
  <rect x="60" y="70" width="310" height="86" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="215" y="98" font-size="15" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">constexpr Rule kRules[]</text>
  <text x="215" y="122" font-size="13" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">{ id, RuleFn, severity }</text>
  <text x="215" y="144" font-size="12" text-anchor="middle" fill="#5c5e66">у таблицы нет состояния</text>

  <line x1="215" y1="156" x2="215" y2="196" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="228" y="180" font-size="12" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">RuleFn</text>

  <rect x="60" y="202" width="310" height="62" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="215" y="228" font-size="14" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">ScriptHostFromTemp(event)</text>
  <text x="215" y="250" font-size="12" text-anchor="middle" fill="#80828c">свободная функция на каждое правило</text>

  <line x1="400" y1="165" x2="474" y2="165" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>

  <!-- стало: вектор объектов -->
  <rect x="490" y="70" width="440" height="86" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="710" y="98" font-size="15" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">std::vector&lt;MatchRule&gt;</text>
  <text x="710" y="122" font-size="13" text-anchor="middle" fill="#80828c">вектор конкретного типа, не базы</text>
  <text x="710" y="144" font-size="12" text-anchor="middle" fill="#5c5e66">пока Check невиртуальный — иначе никак</text>

  <line x1="710" y1="156" x2="710" y2="196" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>

  <rect x="490" y="202" width="440" height="110" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="710" y="226" font-size="14" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">MatchRule : RuleBase</text>
  <line x1="510" y1="238" x2="910" y2="238" stroke="#26262b" stroke-width="1"/>
  <text x="710" y="258" font-size="13" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">id_  severity_  actions_  hits_</text>
  <text x="710" y="282" font-size="13" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">conditions_ : vector&lt;Condition&gt;</text>
  <text x="710" y="302" font-size="12" text-anchor="middle" fill="#5c5e66">Check — «все условия выполнены», и он считает срабатывания</text>

  <text x="530" y="342" font-size="13" text-anchor="middle" fill="#80828c">Детекты на семи сценариях обязаны остаться прежними, до байта.</text>
</svg>
