<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 380" width="1060" height="380"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flow" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="378" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- верхний путь: через os.h -->
  <rect x="40" y="60" width="240" height="64" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="160" y="87" font-size="13" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">nano-edr x.cfg</text>
  <text x="160" y="109" font-size="12" text-anchor="middle" fill="#80828c">источник по умолчанию</text>

  <line x1="280" y1="92" x2="314" y2="92" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>

  <rect x="320" y="60" width="250" height="64" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="445" y="87" font-size="15" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">Wait → трамплин</text>
  <text x="445" y="109" font-size="12" text-anchor="middle" fill="#80828c">os_event → EventParts</text>

  <!-- нижний путь: из файла -->
  <rect x="40" y="200" width="240" height="64" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="160" y="227" font-size="13" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">nano-edr --file x.log</text>
  <text x="160" y="249" font-size="12" text-anchor="middle" fill="#80828c">агент читает журнал сам</text>

  <line x1="280" y1="232" x2="314" y2="232" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>

  <rect x="320" y="200" width="250" height="64" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="445" y="227" font-size="15" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">чтение строк</text>
  <text x="445" y="249" font-size="12" text-anchor="middle" fill="#80828c">ParseEventParts → EventParts</text>

  <!-- схождение -->
  <path d="M 570 92 C 610 92, 610 146, 654 146" fill="none" stroke="#dbdfe6"
        stroke-width="2" marker-end="url(#flow)"/>
  <path d="M 570 232 C 610 232, 610 178, 654 178" fill="none" stroke="#dbdfe6"
        stroke-width="2" marker-end="url(#flow)"/>

  <rect x="660" y="130" width="360" height="64" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="840" y="157" font-size="16" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">agent.HandleEvent(Event)</text>
  <text x="840" y="179" font-size="12" text-anchor="middle" fill="#80828c">правила, окно, сводка — один на оба источника</text>

  <text x="840" y="214" font-size="13" text-anchor="middle" fill="#80828c">дальше код не знает, откуда пришло событие</text>

  <!-- вывод -->
  <rect x="40" y="288" width="980" height="62" fill="none" stroke="#26262b" stroke-width="1.5"/>
  <text x="530" y="314" font-size="14" text-anchor="middle" fill="#dbdfe6">На исправном журнале под --quiet оба запуска печатают одно и то же — побайтово.</text>
  <text x="530" y="336" font-size="12" text-anchor="middle" fill="#5c5e66">Это и есть критерий занятия: восемь случаев task2.1.sources.* сверяют вывод и с эталоном.</text>
</svg>
