<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 800" width="1080" height="800"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flow" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1078" height="798" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- ================= легенда ================= -->
  <g id="ownership" font-size="13">
    <text x="40" y="45" font-size="13" fill="#5c5e66"
          font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">файлы:</text>

    <rect x="100" y="28" width="104" height="24" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="152" y="45" text-anchor="middle" fill="#80828c">комплект</text>

    <rect x="216" y="28" width="112" height="24" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="272" y="45" text-anchor="middle" fill="#ffffff">копируете</text>

    <rect x="340" y="28" width="112" height="24" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="396" y="45" text-anchor="middle" fill="#dbdfe6">меняете</text>

    <rect x="464" y="28" width="132" height="24" fill="#dbdfe6"/>
    <text x="530" y="45" text-anchor="middle" fill="#0b0b0d" font-weight="bold">пишете с нуля</text>
  </g>
  <text x="616" y="45" font-size="13" fill="#5c5e66">комплект менять нельзя; остальное — ваш src/</text>

  <text x="40" y="78" font-size="13" fill="#5c5e66">связи:</text>
  <line x1="100" y1="73" x2="150" y2="73" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="160" y="78" font-size="13" fill="#80828c">хранит в поле</text>
  <line x1="290" y1="73" x2="340" y2="73" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="350" y="78" font-size="13" fill="#80828c">вызывает</text>
  <rect x="448" y="64" width="34" height="18" fill="none" stroke="#80828c" stroke-width="1.2"/>
  <rect x="454" y="68" width="22" height="10" fill="none" stroke="#80828c" stroke-width="1.2"/>
  <text x="492" y="78" font-size="13" fill="#80828c">наследник, внутри — его база</text>

  <line x1="40" y1="96" x2="1040" y2="96" stroke="#26262b" stroke-width="1"/>

  <!-- ================= main ================= -->
  <rect x="40" y="112" width="230" height="150" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="155" y="142" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">main</text>
  <line x1="56" y1="156" x2="254" y2="156" stroke="#26262b" stroke-width="1"/>
  <text x="58" y="182" font-size="13" fill="#80828c">флага --window-size нет:</text>
  <text x="58" y="201" font-size="13" fill="#80828c">вместимость окна в типе</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="58" y="218" width="104" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="110" y="237" text-anchor="middle" fill="#dbdfe6">main.cpp</text>
  </g>

  <!-- main → агент -->
  <line x1="270" y1="170" x2="344" y2="170" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="307" y="162" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">Agent(quiet)</text>

  <!-- ================= Agent ================= -->
  <rect x="350" y="112" width="340" height="170" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="520" y="140" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">Agent : IEventHandler</text>
  <text x="368" y="170" font-size="13" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">window_ : RingBuffer&lt;запись, 256&gt;</text>
  <text x="368" y="191" font-size="13" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">engine_ : RuleEngine</text>
  <text x="368" y="219" font-size="12" fill="#80828c">в записи время, тип и pid — для [CTX]</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="368" y="240" width="84" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="410" y="259" text-anchor="middle" fill="#dbdfe6">agent.h</text>
    <rect x="462" y="240" width="104" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="514" y="259" text-anchor="middle" fill="#dbdfe6">agent.cpp</text>
  </g>

  <!-- агент → набор правил -->
  <line x1="690" y1="170" x2="774" y2="170" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="732" y="162" font-size="12" text-anchor="middle" fill="#80828c">заполняет</text>

  <!-- ================= набор правил ================= -->
  <rect x="780" y="112" width="260" height="150" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="910" y="140" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">набор правил</text>
  <text x="910" y="164" font-size="13" text-anchor="middle" fill="#80828c">шесть с занятия 2.3</text>
  <text x="910" y="183" font-size="13" text-anchor="middle" fill="#80828c">и седьмое — порог</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="845" y="218" width="130" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="910" y="237" text-anchor="middle" fill="#dbdfe6">agent_rules.cpp</text>
  </g>

  <!-- агент → буфер -->
  <line x1="460" y1="282" x2="460" y2="324" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="450" y="308" font-size="12" text-anchor="end" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">window_</text>

  <!-- набор правил → фабрика -->
  <line x1="910" y1="262" x2="910" y2="324" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="922" y="298" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">MakeRule&lt;Rule&gt;</text>

  <!-- ================= RingBuffer ================= -->
  <rect x="350" y="330" width="340" height="140" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="520" y="358" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">RingBuffer&lt;T, N&gt;</text>
  <text x="520" y="383" font-size="13" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">std::array&lt;T, N&gt; внутри</text>
  <text x="520" y="405" font-size="12" text-anchor="middle" fill="#80828c">ноль аллокаций; обход от старого к новому</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="462" y="426" width="116" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="520" y="445" text-anchor="middle" fill="#ffffff">ring_buffer.h</text>
  </g>

  <!-- ================= MakeRule ================= -->
  <rect x="780" y="330" width="260" height="140" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="910" y="358" font-size="15" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">MakeRule&lt;Rule, Args...&gt;</text>
  <text x="910" y="383" font-size="12" text-anchor="middle" fill="#80828c">Rule — явно,</text>
  <text x="910" y="401" font-size="12" text-anchor="middle" fill="#80828c">Args... выводятся из вызова</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="860" y="426" width="100" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="910" y="445" text-anchor="middle" fill="#ffffff">make_rule.h</text>
  </g>

  <!-- фабрика → пороговое правило -->
  <line x1="800" y1="470" x2="696" y2="560" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="752" y="500" font-size="12" text-anchor="end" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">make_unique</text>

  <!-- пороговое правило → буфер -->
  <line x1="460" y1="540" x2="460" y2="476" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="450" y="512" font-size="12" text-anchor="end" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">stamps</text>
  <text x="472" y="512" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">RingBuffer&lt;Timestamp, N&gt;</text>

  <!-- ================= ThresholdRule ================= -->
  <rect x="350" y="540" width="340" height="176" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="368" y="568" font-size="17" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">ThresholdRule&lt;N&gt;</text>
  <text x="368" y="598" font-size="12" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">condition_  buckets_</text>
  <text x="368" y="620" font-size="12" fill="#80828c">count событий</text>
  <text x="368" y="638" font-size="12" fill="#80828c">за window_ms на ключ</text>
  <rect x="530" y="580" width="138" height="64" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="599" y="598" font-size="12" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">RuleBase</text>
  <rect x="569" y="608" width="60" height="26" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="599" y="626" font-size="12" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">IRule</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="368" y="672" width="96" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="416" y="691" text-anchor="middle" fill="#80828c">rule.h</text>
  </g>

  <!-- пороговое правило → комбинаторы -->
  <line x1="690" y1="620" x2="774" y2="620" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="732" y="612" font-size="12" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">condition_</text>
  <line x1="690" y1="666" x2="774" y2="666" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="732" y="658" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">Matches</text>

  <!-- ================= комбинаторы ================= -->
  <rect x="780" y="540" width="260" height="246" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="910" y="566" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">комбинаторы</text>
  <rect x="796" y="580" width="228" height="56" fill="none" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="808" y="613" font-size="14" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">ConditionOf</text>
  <rect x="918" y="594" width="94" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="965" y="613" font-size="12" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">ICondition</text>
  <line x1="860" y1="636" x2="860" y2="672" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="872" y="660" font-size="12" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">callable_</text>
  <text x="808" y="692" font-size="13" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">AllOfStatic  AnyOfStatic</text>
  <text x="808" y="712" font-size="12" fill="#80828c">tuple и fold expression, без virtual;</text>
  <text x="808" y="730" font-size="12" fill="#80828c">в правило — через MakeCondition</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="796" y="744" width="116" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="854" y="763" text-anchor="middle" fill="#80828c">combinators.h</text>
  </g>

  <!-- ================= тесты ================= -->
  <rect x="40" y="330" width="230" height="182" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="155" y="356" font-size="14" text-anchor="middle" fill="#80828c">выданные тесты</text>
  <text x="56" y="384" font-size="13" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">template_tests.cpp</text>
  <text x="56" y="403" font-size="12" fill="#5c5e66">→ буфер, порог, комбинаторы,</text>
  <text x="56" y="421" font-size="12" fill="#5c5e66">фабрика, поля по типу</text>
  <text x="56" y="452" font-size="13" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">window.cpp</text>
  <text x="56" y="471" font-size="12" fill="#5c5e66">→ упражнение: ваш буфер</text>
  <text x="56" y="489" font-size="12" fill="#5c5e66">против вашего списка</text>

  <!-- тесты → буфер -->
  <line x1="270" y1="400" x2="344" y2="400" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="307" y="392" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">PushBack</text>

  <!-- тесты → поля -->
  <line x1="155" y1="512" x2="155" y2="554" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="166" y="538" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">GetField&lt;T&gt;</text>

  <!-- ================= FieldTraits ================= -->
  <rect x="40" y="560" width="230" height="216" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="155" y="588" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">FieldTraits&lt;T&gt;</text>
  <text x="56" y="614" font-size="13" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">string uint64_t bool</text>
  <text x="56" y="636" font-size="12" fill="#80828c">три специализации Parse;</text>
  <text x="56" y="654" font-size="12" fill="#80828c">основного определения нет</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="56" y="680" width="124" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="118" y="699" text-anchor="middle" fill="#80828c">field_traits.h</text>
    <rect x="56" y="716" width="140" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="126" y="735" text-anchor="middle" fill="#ffffff">field_traits.cpp</text>
  </g>

</svg>
