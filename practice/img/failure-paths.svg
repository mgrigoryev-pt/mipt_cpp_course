<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 360" width="1060" height="360"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flow" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
    <marker id="grey" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
    <marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff2020"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="358" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- бросок летит мимо промежуточных кадров -->
  <path d="M 830 210 C 830 60, 155 60, 155 210" fill="none" stroke="#ff2020"
        stroke-width="2.5" marker-end="url(#red)"/>
  <text x="492" y="46" font-size="15" text-anchor="middle" fill="#ff2020">throw идёт мимо CheckRules и правила — до catch в main</text>

  <!-- цепочка вызовов -->
  <rect x="40" y="210" width="230" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="155" y="238" font-size="18" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">main</text>
  <text x="155" y="260" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">catch (const std::exception&amp;)</text>

  <line x1="270" y1="242" x2="304" y2="242" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>

  <rect x="310" y="210" width="190" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="405" y="248" font-size="17" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">CheckRules</text>

  <line x1="500" y1="242" x2="544" y2="242" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>

  <rect x="550" y="210" width="190" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="645" y="240" font-size="17" text-anchor="middle" fill="#dbdfe6">правило</text>
  <text x="645" y="261" font-size="12" text-anchor="middle" fill="#5c5e66"
        font-family="Consolas, Roboto Mono, monospace">ScriptHostFromTemp</text>

  <line x1="740" y1="242" x2="784" y2="242" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>

  <rect x="790" y="210" width="230" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="905" y="248" font-size="18" text-anchor="middle" fill="#dbdfe6">функции доступа</text>

  <!-- возврат особого значения: только непосредственному вызывающему -->
  <path d="M 905 274 C 905 318, 645 318, 645 274" fill="none" stroke="#80828c"
        stroke-width="2" marker-end="url(#grey)"/>
  <text x="775" y="346" font-size="13" text-anchor="middle" fill="#80828c">возврат значения — проверяет вызывающий</text>

  <!-- что именно отдаёт каждая -->
  <text x="420" y="302" font-size="13" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">FindField → nullptr</text>
  <text x="420" y="322" font-size="13" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">GetIntField → false</text>
  <text x="420" y="342" font-size="13" text-anchor="middle" fill="#ff2020"
        font-family="Consolas, Roboto Mono, monospace">GetRequiredField → throw</text>

  <!-- итог броска -->
  <line x1="155" y1="274" x2="155" y2="300" stroke="#ff2020" stroke-width="2" marker-end="url(#red)"/>
  <text x="155" y="324" font-size="15" text-anchor="middle" fill="#dbdfe6">код завершения 1</text>
</svg>
