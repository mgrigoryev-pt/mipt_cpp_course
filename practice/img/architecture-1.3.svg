<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flow" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="658" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <g id="ownership">
  <text x="40" y="45" font-size="13" fill="#5c5e66">файлы:</text>
  <rect x="100" y="28" width="104" height="24" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="152" y="45" font-size="13" text-anchor="middle" fill="#80828c">комплект</text>
  <rect x="216" y="28" width="112" height="24" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="272" y="45" font-size="13" text-anchor="middle" fill="#ffffff">копируете</text>
  <rect x="340" y="28" width="100" height="24" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="390" y="45" font-size="13" text-anchor="middle" fill="#dbdfe6">меняете</text>
  <rect x="452" y="28" width="132" height="24" fill="#dbdfe6"/>
  <text x="518" y="45" font-size="13" text-anchor="middle" fill="#0b0b0d" font-weight="bold">пишете с нуля</text>
  <rect x="596" y="28" width="116" height="24" fill="none" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="654" y="45" font-size="13" text-anchor="middle" fill="#5c5e66">не меняется</text>
  </g>
  <text x="732" y="45" font-size="13" fill="#5c5e66">менять нельзя только комплект</text>
  <text x="40" y="78" font-size="13" fill="#5c5e66">связи:</text>
  <line x1="100" y1="73" x2="150" y2="73" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="160" y="78" font-size="13" fill="#80828c">хранит по значению</text>
  <line x1="320" y1="73" x2="370" y2="73" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="380" y="78" font-size="13" fill="#80828c">вызывает</text>
  <line x1="40" y1="96" x2="1020" y2="96" stroke="#26262b" stroke-width="1"/>
  <rect x="40" y="112" width="280" height="100" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="180" y="138" font-size="16" text-anchor="middle" fill="#ffffff" font-family="Consolas, Roboto Mono, monospace">ParseEventLine</text>
  <text x="180" y="159" font-size="12" text-anchor="middle" fill="#80828c">строка журнала → Event</text>
  <rect x="70" y="172" width="100" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="120" y="191" font-size="13" text-anchor="middle" fill="#80828c" font-family="Consolas, Roboto Mono, monospace">parse.h</text>
  <rect x="178" y="172" width="112" height="28" fill="none" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="234" y="191" font-size="13" text-anchor="middle" fill="#5c5e66" font-family="Consolas, Roboto Mono, monospace">parse.cpp</text>
  <rect x="390" y="112" width="280" height="120" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="530" y="138" font-size="16" text-anchor="middle" fill="#ffffff" font-family="Consolas, Roboto Mono, monospace">main</text>
  <text x="530" y="159" font-size="12" text-anchor="middle" fill="#80828c">Run(options) внутри try / catch</text>
  <text x="530" y="178" font-size="12" text-anchor="middle" fill="#80828c">аргументы, цикл, сводка — функциями</text>
  <rect x="474" y="192" width="112" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="530" y="211" font-size="13" text-anchor="middle" fill="#dbdfe6" font-family="Consolas, Roboto Mono, monospace">main.cpp</text>
  <rect x="740" y="112" width="280" height="100" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="880" y="138" font-size="16" text-anchor="middle" fill="#ffffff" font-family="Consolas, Roboto Mono, monospace">EventList</text>
  <text x="880" y="159" font-size="12" text-anchor="middle" fill="#80828c">окно последних событий</text>
  <rect x="751" y="172" width="120" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="811" y="191" font-size="13" text-anchor="middle" fill="#80828c" font-family="Consolas, Roboto Mono, monospace">event_list.h</text>
  <rect x="879" y="172" width="130" height="28" fill="none" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="944" y="191" font-size="13" text-anchor="middle" fill="#5c5e66" font-family="Consolas, Roboto Mono, monospace">event_list.cpp</text>
  <line x1="390" y1="160" x2="326" y2="160" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="355" y="152" font-size="12" text-anchor="middle" fill="#80828c">строка</text>
  <line x1="670" y1="160" x2="734" y2="160" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="705" y="152" font-size="12" text-anchor="middle" fill="#ff8a8a" font-family="Consolas, Roboto Mono, monospace">window</text>
  <rect x="40" y="300" width="280" height="120" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="180" y="326" font-size="16" text-anchor="middle" fill="#ffffff" font-family="Consolas, Roboto Mono, monospace">kRules[]</text>
  <text x="180" y="347" font-size="13" text-anchor="middle" fill="#dbdfe6" font-family="Consolas, Roboto Mono, monospace">{ id, RuleFn, severity }</text>
  <text x="180" y="366" font-size="12" text-anchor="middle" fill="#80828c">пять функций-проверок</text>
  <rect x="48" y="380" width="120" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="108" y="399" font-size="13" text-anchor="middle" fill="#ffffff" font-family="Consolas, Roboto Mono, monospace">agent_rules.h</text>
  <rect x="176" y="380" width="136" height="28" fill="#dbdfe6"/>
  <text x="244" y="399" font-size="13" text-anchor="middle" fill="#0b0b0d" font-weight="bold" font-family="Consolas, Roboto Mono, monospace">agent_rules.cpp</text>
  <rect x="390" y="300" width="280" height="120" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="530" y="326" font-size="16" text-anchor="middle" fill="#ffffff" font-family="Consolas, Roboto Mono, monospace">CheckRules</text>
  <text x="530" y="347" font-size="12" text-anchor="middle" fill="#80828c">и SeverityName</text>
  <text x="530" y="366" font-size="12" text-anchor="middle" fill="#80828c">печатает детект, возвращает число</text>
  <rect x="420" y="380" width="100" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="470" y="399" font-size="13" text-anchor="middle" fill="#80828c" font-family="Consolas, Roboto Mono, monospace">rules.h</text>
  <rect x="528" y="380" width="112" height="28" fill="#dbdfe6"/>
  <text x="584" y="399" font-size="13" text-anchor="middle" fill="#0b0b0d" font-weight="bold" font-family="Consolas, Roboto Mono, monospace">rules.cpp</text>
  <rect x="740" y="300" width="280" height="120" fill="none" stroke="#26262b" stroke-width="1.5"/>
  <text x="880" y="326" font-size="16" text-anchor="middle" fill="#ffffff" font-family="Consolas, Roboto Mono, monospace">stdout</text>
  <text x="880" y="347" font-size="13" text-anchor="middle" fill="#dbdfe6" font-family="Consolas, Roboto Mono, monospace">[DETECT] high  script_host_from_temp</text>
  <text x="880" y="366" font-size="13" text-anchor="middle" fill="#dbdfe6" font-family="Consolas, Roboto Mono, monospace">ts=1730000003000 pid=1101</text>
  <line x1="530" y1="232" x2="530" y2="294" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="542" y="270" font-size="12" text-anchor="start" fill="#80828c" font-family="Consolas, Roboto Mono, monospace">CheckRules(event, …)</text>
  <path d="M 420 232 C 400 266, 350 276, 326 300" fill="none" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="338" y="266" font-size="12" text-anchor="end" fill="#80828c" font-family="Consolas, Roboto Mono, monospace">AgentRules()</text>
  <line x1="390" y1="380" x2="326" y2="380" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="355" y="372" font-size="12" text-anchor="middle" fill="#80828c" font-family="Consolas, Roboto Mono, monospace">check</text>
  <line x1="670" y1="360" x2="734" y2="360" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="705" y="352" font-size="12" text-anchor="middle" fill="#80828c">печать</text>
  <rect x="40" y="476" width="280" height="150" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="180" y="502" font-size="16" text-anchor="middle" fill="#ffffff" font-family="Consolas, Roboto Mono, monospace">функции доступа</text>
  <text x="180" y="523" font-size="13" text-anchor="middle" fill="#dbdfe6" font-family="Consolas, Roboto Mono, monospace">FindField  GetRequiredField</text>
  <text x="180" y="542" font-size="13" text-anchor="middle" fill="#dbdfe6" font-family="Consolas, Roboto Mono, monospace">GetIntField  Is…  PathEndsWith</text>
  <text x="180" y="561" font-size="13" text-anchor="middle" fill="#dbdfe6" font-family="Consolas, Roboto Mono, monospace">CommandLineContains  NormalizePath</text>
  <rect x="68" y="586" width="100" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="118" y="605" font-size="13" text-anchor="middle" fill="#80828c" font-family="Consolas, Roboto Mono, monospace">fields.h</text>
  <rect x="176" y="586" width="116" height="28" fill="#dbdfe6"/>
  <text x="234" y="605" font-size="13" text-anchor="middle" fill="#0b0b0d" font-weight="bold" font-family="Consolas, Roboto Mono, monospace">fields.cpp</text>
  <line x1="180" y1="420" x2="180" y2="470" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="192" y="450" font-size="12" text-anchor="start" fill="#80828c">спрашивают о событии</text>
  <rect x="390" y="476" width="630" height="150" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="705" y="502" font-size="14" text-anchor="middle" fill="#80828c" font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">выданные тесты</text>
  <text x="414" y="530" font-size="13" text-anchor="start" fill="#80828c" font-family="Consolas, Roboto Mono, monospace">fields_tests.cpp</text>
  <text x="614" y="530" font-size="12" text-anchor="start" fill="#5c5e66">→ функции доступа, обе формы отказа</text>
  <text x="414" y="554" font-size="13" text-anchor="start" fill="#80828c" font-family="Consolas, Roboto Mono, monospace">rules_tests.cpp</text>
  <text x="614" y="554" font-size="12" text-anchor="start" fill="#5c5e66">→ механика CheckRules на тестовых правилах</text>
  <text x="414" y="578" font-size="13" text-anchor="start" fill="#80828c" font-family="Consolas, Roboto Mono, monospace">scenario_tests.cpp</text>
  <text x="614" y="578" font-size="12" text-anchor="start" fill="#5c5e66">→ ваши пять правил на событиях журналов</text>
  <text x="414" y="602" font-size="13" text-anchor="start" fill="#80828c">набор 1.2</text>
  <text x="614" y="602" font-size="12" text-anchor="start" fill="#5c5e66">→ разбор строки и список: раскладка их не задела</text>
</svg>
