<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 860" width="1080" height="860"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flow" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1078" height="858" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- ================= легенда ================= -->
  <g id="ownership" font-size="13">
    <text x="40" y="45" font-size="13" fill="#5c5e66"
          font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">файлы:</text>

    <rect x="100" y="28" width="104" height="24" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="152" y="45" text-anchor="middle" fill="#80828c">комплект</text>

    <rect x="216" y="28" width="112" height="24" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="272" y="45" text-anchor="middle" fill="#ffffff">копируете</text>

    <rect x="340" y="28" width="112" height="24" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="396" y="45" text-anchor="middle" fill="#dbdfe6">меняете</text>

    <rect x="464" y="28" width="132" height="24" fill="#dbdfe6"/>
    <text x="530" y="45" text-anchor="middle" fill="#0b0b0d" font-weight="bold">пишете с нуля</text>
  </g>
  <text x="616" y="45" font-size="13" fill="#5c5e66">комплект менять нельзя; остальное — ваш src/</text>

  <text x="40" y="78" font-size="13" fill="#5c5e66">связи:</text>
  <line x1="100" y1="73" x2="150" y2="73" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="160" y="78" font-size="13" fill="#80828c">хранит в поле</text>
  <line x1="290" y1="73" x2="340" y2="73" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="350" y="78" font-size="13" fill="#80828c">вызывает</text>

  <line x1="40" y1="96" x2="1040" y2="96" stroke="#26262b" stroke-width="1"/>

  <!-- ================= main ================= -->
  <rect x="40" y="112" width="280" height="160" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="180" y="142" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">main</text>
  <line x1="56" y1="156" x2="304" y2="156" stroke="#26262b" stroke-width="1"/>
  <text x="58" y="180" font-size="13" fill="#80828c">открывает EdrHandle первым,</text>
  <text x="58" y="199" font-size="13" fill="#80828c">собирает раздачу; флаг --out</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="58" y="226" width="104" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="110" y="245" text-anchor="middle" fill="#dbdfe6">main.cpp</text>
  </g>

  <!-- main → агент -->
  <line x1="320" y1="180" x2="374" y2="180" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="347" y="172" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">Subscribe</text>

  <!-- ================= Agent ================= -->
  <rect x="380" y="112" width="320" height="160" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="540" y="140" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">Agent : IEventHandler</text>
  <text x="398" y="168" font-size="13" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">model_ : EntityModel</text>
  <text x="398" y="188" font-size="13" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">engine_ : RuleEngine</text>
  <text x="398" y="210" font-size="12" fill="#80828c">модель объявлена раньше движка</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="398" y="226" width="84" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="440" y="245" text-anchor="middle" fill="#dbdfe6">agent.h</text>
    <rect x="492" y="226" width="104" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="544" y="245" text-anchor="middle" fill="#dbdfe6">agent.cpp</text>
  </g>

  <!-- агент → модель -->
  <line x1="700" y1="160" x2="754" y2="160" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="727" y="152" font-size="12" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">model_</text>
  <line x1="700" y1="204" x2="754" y2="204" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="727" y="196" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">Observe</text>
  <text x="727" y="222" font-size="11" text-anchor="middle" fill="#80828c">до правил</text>

  <!-- ================= EntityModel ================= -->
  <rect x="760" y="112" width="280" height="160" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="900" y="140" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">EntityModel</text>
  <text x="900" y="166" font-size="12" text-anchor="middle" fill="#80828c">процессы и файлы, связи между ними;</text>
  <text x="900" y="184" font-size="12" text-anchor="middle" fill="#80828c">два vector, линейный поиск</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="776" y="226" width="120" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="836" y="245" text-anchor="middle" fill="#80828c">entity_model.h</text>
    <rect x="902" y="226" width="130" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="967" y="245" text-anchor="middle" fill="#ffffff">entity_model.cpp</text>
  </g>

  <!-- агент → движок -->
  <line x1="540" y1="272" x2="540" y2="324" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="530" y="303" font-size="12" text-anchor="end" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">engine_</text>

  <!-- ================= получатели ================= -->
  <rect x="40" y="330" width="280" height="270" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="180" y="358" font-size="17" text-anchor="middle" fill="#ffffff">получатели</text>
  <text x="56" y="384" font-size="12" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">AlertSink = std::function&lt;</text>
  <text x="72" y="402" font-size="12" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">void(const Detection&amp;)&gt;</text>
  <text x="56" y="428" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">ConsoleSink  FileSink</text>
  <text x="56" y="446" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">CountingSink  FanOutSink</text>
  <text x="56" y="468" font-size="12" fill="#80828c">строка — ToString(Detection)</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="56" y="484" width="110" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="111" y="503" text-anchor="middle" fill="#80828c">alert_sink.h</text>
    <rect x="174" y="484" width="120" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="234" y="503" text-anchor="middle" fill="#80828c">file_stream.h</text>
    <rect x="56" y="520" width="104" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="108" y="539" text-anchor="middle" fill="#80828c">detection.h</text>
    <rect x="168" y="520" width="124" height="28" fill="#dbdfe6"/>
    <text x="230" y="539" text-anchor="middle" fill="#0b0b0d" font-weight="bold">detection.cpp</text>
    <rect x="56" y="556" width="96" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="104" y="575" text-anchor="middle" fill="#ffffff">sinks.cpp</text>
  </g>

  <!-- ================= RuleEngine ================= -->
  <rect x="380" y="330" width="320" height="200" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="540" y="358" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">RuleEngine</text>
  <text x="398" y="386" font-size="13" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">sinks_ : vector&lt;AlertSink&gt;</text>
  <text x="398" y="406" font-size="13" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">rules_ : vector&lt;unique_ptr&gt;</text>
  <text x="398" y="430" font-size="12" fill="#80828c">детект собирается один раз на правило</text>
  <text x="398" y="448" font-size="12" fill="#80828c">и уходит всем подписанным</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="398" y="482" width="120" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="458" y="501" text-anchor="middle" fill="#80828c">rule_engine.h</text>
    <rect x="528" y="482" width="134" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="595" y="501" text-anchor="middle" fill="#dbdfe6">rule_engine.cpp</text>
  </g>

  <!-- движок → правила -->
  <line x1="700" y1="420" x2="754" y2="420" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="727" y="412" font-size="12" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">rules_</text>

  <!-- движок → модель -->
  <line x1="680" y1="330" x2="772" y2="280" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="676" y="306" font-size="12" text-anchor="end" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">DescribeChain</text>

  <!-- ================= правила ================= -->
  <rect x="760" y="330" width="280" height="270" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="900" y="358" font-size="17" text-anchor="middle" fill="#ffffff">правила</text>
  <text x="776" y="386" font-size="13" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">SequenceRule</text>
  <text x="776" y="404" font-size="12" fill="#80828c">связка child_of_prev</text>
  <text x="776" y="430" font-size="13" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">LambdaRule</text>
  <text x="776" y="448" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">predicate_ : std::function</text>
  <text x="776" y="470" font-size="12" fill="#80828c">набор: восьмое и девятое правила</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="776" y="484" width="80" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="816" y="503" text-anchor="middle" fill="#80828c">rule.h</text>
    <rect x="864" y="484" width="88" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="908" y="503" text-anchor="middle" fill="#dbdfe6">rule.cpp</text>
    <rect x="776" y="520" width="140" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="846" y="539" text-anchor="middle" fill="#dbdfe6">agent_rules.cpp</text>
    <rect x="924" y="520" width="104" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="976" y="539" text-anchor="middle" fill="#dbdfe6">agent_rules.h</text>
  </g>

  <!-- правила → модель -->
  <line x1="960" y1="330" x2="960" y2="278" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="948" y="300" font-size="12" text-anchor="end" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">FindProcess</text>
  <text x="948" y="316" font-size="12" text-anchor="end" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">FindSpawnSource</text>

  <!-- движок → подавление -->
  <line x1="540" y1="530" x2="540" y2="654" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="530" y="590" font-size="12" text-anchor="end" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">sinks_</text>
  <text x="552" y="590" font-size="12" fill="#80828c">подписан один</text>

  <!-- ================= DedupSink ================= -->
  <rect x="380" y="660" width="320" height="170" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="540" y="688" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">DedupSink</text>
  <text x="398" y="716" font-size="13" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">inner_ : AlertSink</text>
  <text x="398" y="738" font-size="12" fill="#80828c">пара «правило + процесс», срок 10 000 мс</text>
  <text x="398" y="756" font-size="12" fill="#80828c">от первого детекта; тела — в sinks.cpp</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="398" y="782" width="112" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="454" y="801" text-anchor="middle" fill="#ffffff">dedup_sink.h</text>
  </g>

  <!-- подавление → раздача -->
  <line x1="380" y1="690" x2="300" y2="606" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="352" y="636" font-size="12" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">inner_</text>
  <text x="352" y="652" font-size="11" fill="#80828c">FanOutSink</text>

  <!-- раздача → отправка на сервер -->
  <line x1="180" y1="600" x2="180" y2="654" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="170" y="632" font-size="12" text-anchor="end" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">EdrSink</text>
  <text x="192" y="632" font-size="11" fill="#80828c">держит edr_</text>

  <!-- ================= EdrHandle ================= -->
  <rect x="40" y="660" width="280" height="170" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="180" y="688" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">EdrHandle, EdrSink</text>
  <text x="56" y="714" font-size="12" fill="#80828c">RAII над edr.h: edr_init, edr_free;</text>
  <text x="56" y="732" font-size="12" fill="#80828c">Send и Flush возвращают код;</text>
  <text x="56" y="750" font-size="12" fill="#80828c">EdrSink — Detection в edr_message</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="56" y="782" width="112" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="112" y="801" text-anchor="middle" fill="#80828c">edr_handle.h</text>
    <rect x="176" y="782" width="128" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="240" y="801" text-anchor="middle" fill="#ffffff">edr_handle.cpp</text>
  </g>

  <!-- ================= тесты ================= -->
  <rect x="760" y="660" width="280" height="170" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="900" y="686" font-size="14" text-anchor="middle" fill="#80828c">выданные тесты</text>
  <text x="776" y="712" font-size="13" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">sink_tests.cpp</text>
  <text x="776" y="730" font-size="12" fill="#5c5e66">→ получатели, DedupSink,</text>
  <text x="776" y="746" font-size="12" fill="#5c5e66">движок, LambdaRule</text>
  <text x="776" y="772" font-size="13" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">entity_tests.cpp</text>
  <text x="776" y="790" font-size="12" fill="#5c5e66">→ модель и связка child_of_prev</text>

</svg>
