<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 900" width="1080" height="900"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flow" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1078" height="898" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- ================= легенда ================= -->
  <g id="ownership" font-size="13">
    <text x="40" y="45" font-size="13" fill="#5c5e66"
          font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">файлы:</text>

    <rect x="100" y="28" width="104" height="24" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="152" y="45" text-anchor="middle" fill="#80828c">комплект</text>

    <rect x="216" y="28" width="112" height="24" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="272" y="45" text-anchor="middle" fill="#dbdfe6">меняете</text>

    <rect x="340" y="28" width="112" height="24" fill="none" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="6 5"/>
    <line x1="344" y1="49" x2="448" y2="31" stroke="#ff2020" stroke-width="1.5"/>
    <text x="396" y="45" text-anchor="middle" fill="#80828c">удаляете</text>
  </g>
  <text x="472" y="45" font-size="13" fill="#5c5e66">комплект менять нельзя; остальное — ваш src/</text>

  <text x="40" y="78" font-size="13" fill="#5c5e66">связи:</text>
  <line x1="100" y1="73" x2="150" y2="73" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="160" y="78" font-size="13" fill="#80828c">хранит в поле</text>
  <line x1="290" y1="73" x2="340" y2="73" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="350" y="78" font-size="13" fill="#80828c">вызывает</text>
  <rect x="448" y="64" width="34" height="18" fill="none" stroke="#80828c" stroke-width="1.2"/>
  <rect x="454" y="68" width="22" height="10" fill="none" stroke="#80828c" stroke-width="1.2"/>
  <text x="492" y="78" font-size="13" fill="#80828c">наследник, внутри — его база</text>

  <line x1="40" y1="96" x2="1040" y2="96" stroke="#26262b" stroke-width="1"/>

  <!-- ================= main ================= -->
  <rect x="40" y="112" width="230" height="150" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="155" y="142" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">main</text>
  <line x1="56" y1="156" x2="254" y2="156" stroke="#26262b" stroke-width="1"/>
  <text x="58" y="178" font-size="13" fill="#80828c">три предела памяти —</text>
  <text x="58" y="196" font-size="13" fill="#80828c">от сервера, через</text>
  <text x="58" y="214" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">edr_config_get</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="58" y="224" width="104" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="110" y="243" text-anchor="middle" fill="#dbdfe6">main.cpp</text>
  </g>

  <!-- main → агент -->
  <line x1="270" y1="170" x2="344" y2="170" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="307" y="162" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">limits</text>

  <!-- ================= Agent ================= -->
  <rect x="350" y="112" width="380" height="170" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="540" y="140" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">Agent : IEventHandler</text>
  <text x="368" y="166" font-size="13" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">model_ : EntityModel</text>
  <text x="368" y="185" font-size="13" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">engine_ : RuleEngine</text>
  <text x="368" y="204" font-size="13" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">window_ : RingBuffer&lt;запись, 256&gt;</text>
  <text x="368" y="228" font-size="12" fill="#80828c">на тике: Evict у модели, OnTick у движка</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="368" y="242" width="84" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="410" y="261" text-anchor="middle" fill="#dbdfe6">agent.h</text>
    <rect x="462" y="242" width="104" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="514" y="261" text-anchor="middle" fill="#dbdfe6">agent.cpp</text>
  </g>

  <!-- агент → набор правил -->
  <line x1="730" y1="170" x2="784" y2="170" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="757" y="162" font-size="11" text-anchor="middle" fill="#80828c">заполняет</text>

  <!-- ================= набор правил ================= -->
  <rect x="790" y="112" width="250" height="150" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="915" y="140" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">набор правил</text>
  <text x="915" y="164" font-size="13" text-anchor="middle" fill="#80828c">пороговому правилу —</text>
  <text x="915" y="183" font-size="13" text-anchor="middle" fill="#80828c">срок простоя счётчика:</text>
  <text x="915" y="202" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">set_idle_ms(max_idle_ms)</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="802" y="222" width="104" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="854" y="241" text-anchor="middle" fill="#dbdfe6">agent_rules.h</text>
    <rect x="912" y="222" width="122" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="973" y="241" text-anchor="middle" fill="#dbdfe6">agent_rules.cpp</text>
  </g>

  <!-- агент → модель -->
  <line x1="375" y1="282" x2="375" y2="324" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="365" y="308" font-size="12" text-anchor="end" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">model_</text>

  <!-- агент → движок -->
  <line x1="720" y1="282" x2="720" y2="324" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="710" y="308" font-size="12" text-anchor="end" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">engine_</text>

  <!-- ================= EntityModel ================= -->
  <rect x="40" y="330" width="370" height="210" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="225" y="358" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">EntityModel</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="12">
    <text x="56" y="384" fill="#ffffff">processes_ : unordered_map&lt;</text>
    <text x="84" y="400" fill="#ffffff">ProcessKey, ProcessRecord&gt;</text>
    <text x="56" y="420" fill="#ffffff">files_ : unordered_map&lt;string, …&gt;</text>
    <text x="56" y="440" fill="#80828c">ProcessKey{pid, start}, std::hash</text>
  </g>
  <text x="56" y="462" font-size="12" fill="#80828c">Evict: по возрасту и по объёму; наружу —</text>
  <text x="56" y="478" font-size="12" fill="#80828c">в порядке, заданном контрактом</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="56" y="496" width="124" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="118" y="515" text-anchor="middle" fill="#80828c">entity_model.h</text>
    <rect x="190" y="496" width="140" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="260" y="515" text-anchor="middle" fill="#dbdfe6">entity_model.cpp</text>
  </g>

  <!-- ================= тесты ================= -->
  <rect x="460" y="330" width="200" height="160" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="560" y="355" font-size="14" text-anchor="middle" fill="#80828c">выданное</text>
  <text x="476" y="380" font-size="13" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">model_tests.cpp</text>
  <text x="476" y="397" font-size="12" fill="#5c5e66">→ ключ, порядок, вытеснение</text>
  <text x="476" y="422" font-size="13" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">tick_tests.cpp</text>
  <text x="476" y="439" font-size="12" fill="#5c5e66">→ уборка на тике</text>
  <text x="476" y="464" font-size="13" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">containers.cpp</text>
  <text x="476" y="481" font-size="12" fill="#5c5e66">→ упражнение, отдельно</text>

  <!-- тесты → модель -->
  <line x1="460" y1="400" x2="416" y2="400" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="435" y="392" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">Evict</text>

  <!-- тесты → движок -->
  <line x1="660" y1="400" x2="704" y2="400" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="684" y="392" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">OnTick</text>

  <!-- ================= RuleEngine ================= -->
  <rect x="710" y="330" width="330" height="120" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="875" y="358" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">RuleEngine</text>
  <text x="726" y="382" font-size="12" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">rules_ : vector&lt;unique_ptr&lt;IRule&gt;&gt;</text>
  <text x="726" y="400" font-size="12" fill="#80828c">OnTick раздаёт тик всем правилам</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="726" y="412" width="112" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="782" y="431" text-anchor="middle" fill="#80828c">rule_engine.h</text>
    <rect x="846" y="412" width="130" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="911" y="431" text-anchor="middle" fill="#dbdfe6">rule_engine.cpp</text>
  </g>

  <!-- движок → правила -->
  <line x1="720" y1="450" x2="720" y2="494" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="710" y="478" font-size="12" text-anchor="end" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">OnTick</text>
  <line x1="900" y1="450" x2="900" y2="494" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="910" y="478" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">OnTick</text>

  <!-- ================= RingBuffer ================= -->
  <rect x="40" y="580" width="370" height="120" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="225" y="606" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">RingBuffer&lt;T, N&gt;</text>
  <text x="56" y="630" font-size="12" fill="#80828c">итератор дорастает до алгоритма: пять</text>
  <text x="56" y="646" font-size="12" fill="#80828c">псевдонимов типов, ==, it++, по умолчанию</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="56" y="660" width="116" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="114" y="679" text-anchor="middle" fill="#dbdfe6">ring_buffer.h</text>
  </g>

  <!-- пороговое правило → буфер -->
  <line x1="460" y1="630" x2="416" y2="630" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="435" y="622" font-size="12" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">stamps</text>

  <!-- ================= ThresholdRule ================= -->
  <rect x="460" y="500" width="270" height="200" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="476" y="526" font-size="16" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">ThresholdRule&lt;N&gt;</text>
  <text x="476" y="556" font-size="12" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">buckets_ :</text>
  <text x="490" y="572" font-size="12" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">unordered_map</text>
  <rect x="606" y="540" width="108" height="60" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="660" y="557" font-size="12" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">RuleBase</text>
  <rect x="626" y="566" width="68" height="26" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="660" y="584" font-size="12" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">IRule</text>
  <text x="476" y="616" font-size="12" fill="#80828c">count_if по буферу; вытеснение</text>
  <text x="476" y="632" font-size="12" fill="#80828c">счётчиков в OnTick — выдано</text>
  <text x="476" y="648" font-size="12" fill="#80828c">целиком, с телом</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="476" y="662" width="72" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="512" y="681" text-anchor="middle" fill="#80828c">rule.h</text>
  </g>

  <!-- ================= SequenceRule ================= -->
  <rect x="760" y="500" width="280" height="200" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="776" y="526" font-size="16" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">SequenceRule</text>
  <text x="776" y="556" font-size="12" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">pending_</text>
  <rect x="916" y="540" width="108" height="60" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="970" y="557" font-size="12" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">RuleBase</text>
  <rect x="936" y="566" width="68" height="26" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="970" y="584" font-size="12" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">IRule</text>
  <text x="776" y="616" font-size="12" fill="#80828c">OnTick и Check снимают</text>
  <text x="776" y="632" font-size="12" fill="#80828c">просроченное одним местом —</text>
  <text x="776" y="648" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">DropExpired</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="776" y="662" width="72" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="812" y="681" text-anchor="middle" fill="#80828c">rule.h</text>
    <rect x="856" y="662" width="84" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="898" y="681" text-anchor="middle" fill="#dbdfe6">rule.cpp</text>
  </g>

  <!-- ================= нижний ряд: под новые типы комплекта ================= -->
  <line x1="40" y1="722" x2="1040" y2="722" stroke="#26262b" stroke-width="1"/>

  <!-- Responder -->
  <rect x="40" y="740" width="330" height="130" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="56" y="766" font-size="16" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">Responder</text>
  <text x="56" y="790" font-size="12" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">done_, touched_ :</text>
  <text x="70" y="806" font-size="12" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">unordered_set&lt;string&gt;</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="56" y="828" width="96" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="104" y="847" text-anchor="middle" fill="#80828c">response.h</text>
    <rect x="160" y="828" width="112" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="216" y="847" text-anchor="middle" fill="#dbdfe6">response.cpp</text>
  </g>

  <!-- строки -->
  <rect x="386" y="740" width="250" height="130" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="402" y="766" font-size="15" fill="#ffffff">сравнение строк</text>
  <text x="402" y="790" font-size="12" fill="#80828c">пять функций, четыре</text>
  <text x="402" y="806" font-size="12" fill="#80828c">без циклов</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="402" y="828" width="84" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="444" y="847" text-anchor="middle" fill="#dbdfe6">text.cpp</text>
  </g>

  <!-- удаляются -->
  <rect x="652" y="740" width="388" height="130" fill="none" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="668" y="766" font-size="15" fill="#80828c">уходит из проекта</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="668" y="780" width="128" height="28" fill="none" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="732" y="799" text-anchor="middle" fill="#80828c">event_list.cpp</text>
    <line x1="672" y1="805" x2="792" y2="783" stroke="#ff2020" stroke-width="1.5"/>
  </g>
  <text x="812" y="792" font-size="12" fill="#5c5e66">его тесты</text>
  <text x="812" y="808" font-size="12" fill="#5c5e66">выпадают сами</text>

</svg>
