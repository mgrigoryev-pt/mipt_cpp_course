; Чистый сценарий, он же ловушка для порогового правила из занятия 3.1.
;
; Последнее событие — запуск только что собранного nano-edr.exe из каталога
; сборки. Правило «запуск из необычного пути» тоже обязано здесь промолчать.

[sim]
events   = clean_build.log
delivery = inline
speed    = instant
self_pid = 4242
seed     = 1
report   = clean_build.report.txt

[edr]
out = clean_build.detections.txt

[world]
process = pid=4    ppid=0 image="System" start=0 protected=1
process = pid=880  ppid=4 image="C:\Windows\explorer.exe" start=1729999000000 user=DESKTOP\max
process = pid=2500 ppid=880 image="C:\Users\max\AppData\Local\Programs\Microsoft VS Code\Code.exe" start=1729999900000 user=DESKTOP\max

[agent]
quarantine_dir = C:\quarantine
telemetry      = detections_only

[expect]
max_detections   = 0
;
; Строк must_not_detect здесь нет намеренно — по той же причине, что
; в clean_office.cfg: они называли бы чужие имена правил, а `max_detections = 0`
; строже любого их набора.
;
; Этот сценарий и без них самый злой из чистых: сборка делает столько же
; переименований, сколько шифровальщик, и в те же шесть секунд.
max_unsafe_kills = 0
max_os_queries   = 4000
