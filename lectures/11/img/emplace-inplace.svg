<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" width="1060" height="330"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="328" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="40" y1="172" x2="1020" y2="172" stroke="#26262b" stroke-width="1.5"/>

  <!-- push_back -->
  <text x="40" y="46" font-size="18" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">v.push_back("hello");</text>

  <rect x="40" y="64" width="200" height="56" fill="none" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="140" y="90" font-size="16" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">std::string</text>
  <text x="140" y="110" font-size="14" text-anchor="middle" fill="#80828c">временный</text>

  <line x1="250" y1="92" x2="370" y2="92" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="310" y="78" font-size="15" text-anchor="middle" fill="#ff8a8a">move</text>

  <rect x="380" y="64" width="92" height="56" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="426" y="99" font-size="18" text-anchor="middle" fill="#80828c">…</text>
  <rect x="476" y="64" width="92" height="56" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="522" y="99" font-size="18" text-anchor="middle" fill="#80828c">…</text>
  <rect x="572" y="64" width="92" height="56" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="2"/>
  <text x="618" y="99" font-size="16" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">hello</text>
  <rect x="668" y="64" width="92" height="56" fill="none" stroke="#3a3a40" stroke-width="1.5" stroke-dasharray="6 5"/>

  <text x="784" y="98" font-size="16" fill="#80828c">буфер вектора</text>

  <text x="40" y="150" font-size="16" fill="#80828c">объект создан, перемещён и разрушен — три шага</text>

  <!-- emplace_back -->
  <text x="40" y="202" font-size="18" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">v.emplace_back("hello");</text>

  <rect x="40" y="220" width="200" height="56" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="140" y="246" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">"hello"</text>
  <text x="140" y="266" font-size="14" text-anchor="middle" fill="#80828c">аргумент конструктора</text>

  <line x1="250" y1="248" x2="370" y2="248" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="310" y="234" font-size="15" text-anchor="middle" fill="#ff8a8a">конструктор</text>

  <rect x="380" y="220" width="92" height="56" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="426" y="255" font-size="18" text-anchor="middle" fill="#80828c">…</text>
  <rect x="476" y="220" width="92" height="56" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="522" y="255" font-size="18" text-anchor="middle" fill="#80828c">…</text>
  <rect x="572" y="220" width="92" height="56" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="2"/>
  <text x="618" y="255" font-size="16" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">hello</text>
  <rect x="668" y="220" width="92" height="56" fill="none" stroke="#3a3a40" stroke-width="1.5" stroke-dasharray="6 5"/>

  <text x="784" y="254" font-size="16" fill="#80828c">буфер вектора</text>

  <text x="40" y="306" font-size="16" fill="#80828c">объект построен сразу в слоте — один шаг</text>
</svg>
