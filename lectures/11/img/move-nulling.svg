<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 350" width="1060" height="350"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="348" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="36" x2="530" y2="320" stroke="#26262b" stroke-width="1.5"/>

  <!-- забыли занулить -->
  <text x="40" y="52" font-size="18" fill="#ff2020">указатель забрали, источник не тронули</text>

  <rect x="40" y="84" width="140" height="52" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="110" y="118" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">b</text>
  <rect x="40" y="166" width="140" height="52" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="110" y="200" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">a</text>

  <path d="M 188 110 C 232 110, 248 138, 292 138" fill="none" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <path d="M 188 192 C 232 192, 248 164, 292 164" fill="none" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

  <rect x="300" y="120" width="190" height="62" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="395" y="157" font-size="17" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">char[]</text>

  <text x="40" y="272" font-size="17" fill="#dbdfe6">два деструктора, один и тот же адрес</text>
  <text x="40" y="302" font-size="17" fill="#ff2020">delete[] дважды — UB</text>

  <!-- занулили -->
  <text x="550" y="52" font-size="18" fill="#dbdfe6">указатель забрали и источник занулили</text>

  <rect x="550" y="84" width="140" height="52" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="620" y="118" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">b</text>
  <rect x="550" y="166" width="140" height="52" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="620" y="200" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">a</text>
  <text x="620" y="238" font-size="15" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">data_ = nullptr</text>

  <path d="M 698 110 C 742 110, 758 138, 802 138" fill="none" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

  <rect x="810" y="120" width="190" height="62" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="2"/>
  <text x="905" y="157" font-size="17" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">char[]</text>

  <text x="550" y="272" font-size="17" fill="#dbdfe6">деструктор источника не делает ничего</text>
  <text x="550" y="302" font-size="17" fill="#80828c">буфер удалён ровно один раз</text>
</svg>
