<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" width="1060" height="330"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="1058" height="328" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <text x="490" y="58" font-size="20" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">int&amp;</text>
  <text x="700" y="58" font-size="20" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">const int&amp;</text>
  <text x="910" y="58" font-size="20" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">int&amp;&amp;</text>

  <!-- строка 1: lvalue -->
  <text x="55" y="116" font-size="18" fill="#80828c"><tspan font-size="19" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">x</tspan> — lvalue</text>
  <rect x="395" y="80" width="190" height="56" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="490" y="116" font-size="20" text-anchor="middle" fill="#dbdfe6">ok</text>
  <rect x="605" y="80" width="190" height="56" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="700" y="116" font-size="20" text-anchor="middle" fill="#dbdfe6">ok</text>
  <rect x="815" y="80" width="190" height="56" fill="none" stroke="#ff2020" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="910" y="116" font-size="20" text-anchor="middle" fill="#ff2020">CE</text>

  <!-- строка 2: литерал -->
  <text x="55" y="188" font-size="18" fill="#80828c"><tspan font-size="19" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">5</tspan> — rvalue</text>
  <rect x="395" y="152" width="190" height="56" fill="none" stroke="#ff2020" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="490" y="188" font-size="20" text-anchor="middle" fill="#ff2020">CE</text>
  <rect x="605" y="152" width="190" height="56" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="700" y="188" font-size="20" text-anchor="middle" fill="#dbdfe6">ok</text>
  <rect x="815" y="152" width="190" height="56" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="2"/>
  <text x="910" y="188" font-size="20" text-anchor="middle" fill="#ff8a8a">ok</text>

  <!-- строка 3: std::move -->
  <text x="55" y="260" font-size="18" fill="#80828c"><tspan font-size="19" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">std::move(x)</tspan> — rvalue</text>
  <rect x="395" y="224" width="190" height="56" fill="none" stroke="#ff2020" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="490" y="260" font-size="20" text-anchor="middle" fill="#ff2020">CE</text>
  <rect x="605" y="224" width="190" height="56" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="700" y="260" font-size="20" text-anchor="middle" fill="#dbdfe6">ok</text>
  <rect x="815" y="224" width="190" height="56" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="2"/>
  <text x="910" y="260" font-size="20" text-anchor="middle" fill="#ff8a8a">ok</text>

  <text x="530" y="306" font-size="16" text-anchor="middle" fill="#80828c">нижние две строки совпадают: <tspan font-family="Consolas, Roboto Mono, monospace" fill="#dbdfe6">std::move(x)</tspan> не двигает <tspan font-family="Consolas, Roboto Mono, monospace" fill="#dbdfe6">x</tspan>, а переводит его в rvalue</text>
</svg>
