<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 340" width="1060" height="340"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="338" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="520" y1="36" x2="520" y2="304" stroke="#26262b" stroke-width="1.5"/>

  <!-- копирование -->
  <text x="40" y="50" font-size="18" fill="#dbdfe6">копирование: <tspan font-family="Consolas, Roboto Mono, monospace" fill="#ffffff">b = a;</tspan></text>

  <rect x="40" y="76" width="120" height="54" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="100" y="111" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">a</text>
  <line x1="168" y1="103" x2="216" y2="103" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <rect x="224" y="76" width="250" height="54" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="349" y="109" font-size="16" text-anchor="middle" fill="#dbdfe6">буфер: 10 000 событий</text>

  <rect x="40" y="170" width="120" height="54" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="100" y="205" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">b</text>
  <line x1="168" y1="197" x2="216" y2="197" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <rect x="224" y="170" width="250" height="54" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="349" y="203" font-size="16" text-anchor="middle" fill="#dbdfe6">копия: те же 10 000</text>

  <text x="40" y="258" font-size="17" fill="#dbdfe6">выделение памяти и копирование каждого</text>
  <text x="40" y="286" font-size="17" fill="#80828c">O(n), и оба буфера живут одновременно</text>

  <!-- перемещение -->
  <text x="550" y="50" font-size="18" fill="#dbdfe6">перемещение: <tspan font-family="Consolas, Roboto Mono, monospace" fill="#ffffff">b = std::move(a);</tspan></text>

  <rect x="550" y="76" width="120" height="54" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="610" y="111" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">a</text>
  <text x="610" y="150" font-size="15" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">data_ = nullptr</text>

  <rect x="550" y="170" width="120" height="54" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="610" y="205" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">b</text>
  <path d="M 678 197 C 712 197, 726 160, 762 160" fill="none" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>

  <rect x="770" y="110" width="250" height="60" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="2"/>
  <text x="895" y="146" font-size="16" text-anchor="middle" fill="#ff8a8a">буфер: 10 000 событий</text>

  <text x="550" y="258" font-size="17" fill="#dbdfe6">переставлен один указатель</text>
  <text x="550" y="286" font-size="17" fill="#80828c">O(1), буфер тот же самый</text>
</svg>
