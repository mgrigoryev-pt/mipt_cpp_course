<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" width="1060" height="300"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="298" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="34" x2="530" y2="266" stroke="#26262b" stroke-width="1.5"/>

  <!-- копирование: два владельца -->
  <text x="60" y="58" font-size="18" fill="#ff2020">копия: владельцев стало два</text>
  <rect x="80" y="80" width="120" height="50" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="140" y="113" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">a</text>
  <rect x="300" y="80" width="120" height="50" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="360" y="113" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">b</text>

  <path d="M 140 130 C 140 162, 178 166, 208 182" fill="none" stroke="#ff8a8a"
        stroke-width="2.5" marker-end="url(#pink)"/>
  <path d="M 360 130 C 360 162, 322 166, 292 182" fill="none" stroke="#ff8a8a"
        stroke-width="2.5" marker-end="url(#pink)"/>

  <rect x="160" y="190" width="180" height="58" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <text x="250" y="226" font-size="19" text-anchor="middle" fill="#ffffff">объект</text>

  <text x="60" y="284" font-size="17" fill="#ff2020">два деструктора — delete дважды, это UB</text>

  <!-- перемещение: владелец один -->
  <text x="570" y="58" font-size="18" fill="#dbdfe6">перемещение: владелец один</text>
  <rect x="590" y="80" width="120" height="50" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="650" y="113" font-size="20" text-anchor="middle" fill="#5c5e66"
        font-family="Consolas, Roboto Mono, monospace">a</text>
  <text x="650" y="152" font-size="15" text-anchor="middle" fill="#5c5e66"
        font-family="Consolas, Roboto Mono, monospace">ptr_ = nullptr</text>
  <rect x="810" y="80" width="120" height="50" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="870" y="113" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">b</text>

  <path d="M 870 130 C 870 162, 846 166, 818 182" fill="none" stroke="#ff8a8a"
        stroke-width="2.5" marker-end="url(#pink)"/>

  <rect x="670" y="190" width="180" height="58" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <text x="760" y="226" font-size="19" text-anchor="middle" fill="#ffffff">объект</text>

  <text x="570" y="284" font-size="17" fill="#80828c">деструктор a не удалит ничего</text>
</svg>
