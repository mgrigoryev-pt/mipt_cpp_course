<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 320" width="1060" height="320"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="318" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="34" x2="530" y2="286" stroke="#26262b" stroke-width="1.5"/>

  <!-- цикл -->
  <text x="60" y="58" font-size="18" fill="#ff2020">next у обоих — shared_ptr</text>

  <rect x="70" y="92" width="160" height="64" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="150" y="132" font-size="22" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">a</text>
  <rect x="310" y="92" width="160" height="64" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="390" y="132" font-size="22" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">b</text>

  <line x1="230" y1="116" x2="302" y2="116" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>
  <text x="266" y="106" font-size="14" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">next</text>

  <path d="M 390 156 C 390 210, 150 210, 150 162" fill="none" stroke="#ff8a8a"
        stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="270" y="232" font-size="14" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">next</text>

  <text x="60" y="266" font-size="17" fill="#ff2020">счётчики держат друг друга: ни один</text>
  <text x="60" y="290" font-size="17" fill="#ff2020">не дойдёт до нуля — утечка</text>

  <!-- разрыв цикла -->
  <text x="570" y="58" font-size="18" fill="#dbdfe6">prev — weak_ptr</text>

  <rect x="580" y="92" width="160" height="64" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="660" y="132" font-size="22" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">a</text>
  <rect x="820" y="92" width="160" height="64" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="900" y="132" font-size="22" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">b</text>

  <line x1="740" y1="116" x2="812" y2="116" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>
  <text x="776" y="106" font-size="14" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">next</text>

  <path d="M 900 156 C 900 210, 660 210, 660 162" fill="none" stroke="#ff8a8a"
        stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#pink)"/>
  <text x="760" y="232" font-size="14" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">prev</text>
  <text x="830" y="232" font-size="14" fill="#80828c">не владеет</text>

  <text x="570" y="266" font-size="17" fill="#80828c">владеющая стрелка одна — счётчик</text>
  <text x="570" y="290" font-size="17" fill="#80828c">дойдёт до нуля, узлы удалятся</text>
</svg>
