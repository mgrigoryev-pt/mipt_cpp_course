<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 320" width="1060" height="320"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
    <marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff2020"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="318" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- потоки -->
  <rect x="40" y="116" width="250" height="88" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="165" y="148" font-size="17" text-anchor="middle" fill="#ffffff">поток 1</text>
  <text x="165" y="176" font-size="15" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">lock_guard l1(m1);</text>
  <text x="165" y="196" font-size="15" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">lock_guard l2(m2);</text>

  <rect x="770" y="116" width="250" height="88" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="895" y="148" font-size="17" text-anchor="middle" fill="#ffffff">поток 2</text>
  <text x="895" y="176" font-size="15" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">lock_guard l1(m2);</text>
  <text x="895" y="196" font-size="15" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">lock_guard l2(m1);</text>

  <!-- мьютексы -->
  <rect x="470" y="52" width="120" height="56" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <text x="530" y="88" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">m1</text>

  <rect x="470" y="212" width="120" height="56" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <text x="530" y="248" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">m2</text>

  <!-- поток 1 держит m1 -->
  <line x1="292" y1="140" x2="462" y2="88" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>
  <text x="352" y="108" font-size="15" fill="#ff8a8a">держит</text>

  <!-- поток 1 ждёт m2 -->
  <line x1="292" y1="184" x2="462" y2="234" stroke="#ff2020" stroke-width="2.5"
        stroke-dasharray="7 6" marker-end="url(#red)"/>
  <text x="352" y="228" font-size="15" fill="#ff2020">ждёт</text>

  <!-- поток 2 держит m2 -->
  <line x1="768" y1="184" x2="598" y2="234" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>
  <text x="653" y="252" font-size="15" fill="#ff8a8a">держит</text>

  <!-- поток 2 ждёт m1 -->
  <line x1="768" y1="140" x2="598" y2="88" stroke="#ff2020" stroke-width="2.5"
        stroke-dasharray="7 6" marker-end="url(#red)"/>
  <text x="676" y="100" font-size="15" fill="#ff2020">ждёт</text>

  <text x="40" y="296" font-size="17" fill="#ff2020">круг ожидания замкнулся: каждая блокировка по отдельности корректна, ошибка — в порядке захвата</text>
</svg>
