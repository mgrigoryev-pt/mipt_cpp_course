<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" width="1060" height="330"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif"
     role="img" aria-label="Стек главного потока — зарезервированный мегабайт адресов. Он растёт от старших адресов к младшим: кадр глубины 0 по адресу 0xc56e4ff600, каждый следующий на 1120 байт ниже — 1024 байта массива buffer и 96 байт служебного: адрес возврата, сохранённые регистры, остальные локальные переменные. За выделенной частью стоит сторожевая страница: касание её выделяет следующую. На глубине 800 кадр уже на 896 000 байт ниже первого, а когда рост упирается в конец резерва, программа падает с кодом 0xC00000FD">
  <defs>
    <marker id="grey" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
  </defs>
  <style>
    .s{fill:#80828c;font-size:14px}
    .t{fill:#dbdfe6;font-size:15px}
    .m{fill:#dbdfe6;font-size:14px;font-family:Consolas, Roboto Mono, monospace}
    .fr{fill:rgba(255,255,255,0.05);stroke:#dbdfe6;stroke-width:1.5}
    .ln{stroke:#80828c;stroke-width:1.5;fill:none}
  </style>

  <rect x="1" y="1" width="1058" height="328" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <text class="t" x="40" y="42">стек главного потока: 1 МБ адресов из заголовка, <tspan class="m">SizeOfStackReserve</tspan></text>
  <text class="s" x="40" y="68">старшие адреса</text>
  <text class="s" x="1020" y="68" text-anchor="end">младшие адреса</text>
  <line class="ln" x1="150" y1="63" x2="900" y2="63" marker-end="url(#grey)"/>
  <text class="s" x="525" y="56" text-anchor="middle">стек растёт сюда</text>

  <!-- резерв целиком -->
  <rect x="40" y="84" width="980" height="64" fill="none" stroke="#3a3a40" stroke-width="1.5"
        stroke-dasharray="6 5"/>

  <!-- кадры -->
  <rect class="fr" x="40" y="84" width="70" height="64"/>
  <rect class="fr" x="110" y="84" width="70" height="64"/>
  <rect class="fr" x="180" y="84" width="70" height="64"/>
  <rect class="fr" x="250" y="84" width="70" height="64"/>
  <text class="s" x="345" y="121">…</text>
  <rect class="fr" x="370" y="84" width="420" height="64"/>
  <text class="t" x="580" y="121" text-anchor="middle">ещё ~800 таких кадров</text>
  <rect x="790" y="84" width="60" height="64" fill="rgba(255,255,255,0.02)" stroke="#80828c"
        stroke-width="1.5"/>
  <text class="s" x="820" y="112" text-anchor="middle">сторож</text>
  <text class="s" x="820" y="130" text-anchor="middle">страница</text>

  <!-- конец резерва -->
  <line x1="1020" y1="76" x2="1020" y2="156" stroke="#ff2020" stroke-width="2"/>
  <text x="1012" y="178" font-size="15" fill="#ff2020" text-anchor="end"
        font-family="Consolas, Roboto Mono, monospace">0xC00000FD</text>
  <text x="1012" y="198" font-size="14" fill="#ff2020" text-anchor="end">переполнение стека</text>

  <!-- текст под кадрами -->
  <text class="m" x="40" y="176">глубина 0</text>
  <text class="m" x="40" y="196">0xc56e4ff600</text>
  <text class="m" x="600" y="176" text-anchor="middle">глубина 800</text>
  <text class="s" x="600" y="196" text-anchor="middle">на 896 000 байт ниже первого</text>

  <!-- разворот одного кадра -->
  <path class="ln" d="M 110 148 L 60 232"/>
  <path class="ln" d="M 180 148 L 520 232"/>
  <rect class="fr" x="60" y="232" width="360" height="56"/>
  <text class="m" x="240" y="258" text-anchor="middle">buffer[1024]</text>
  <text class="s" x="240" y="278" text-anchor="middle">1024 байта</text>
  <rect class="fr" x="420" y="232" width="100" height="56"/>
  <text class="s" x="470" y="258" text-anchor="middle">служебное</text>
  <text class="s" x="470" y="278" text-anchor="middle">96 байт</text>
  <text class="t" x="540" y="256">один кадр <tspan class="m">dive</tspan>: 1120 байт</text>
  <text class="s" x="540" y="278">служебное — адрес возврата, сохранённые регистры,</text>
  <text class="s" x="540" y="298">остальные локальные переменные</text>
</svg>
