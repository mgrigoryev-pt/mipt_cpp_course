<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 400" width="1060" height="400"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif"
     role="img" aria-label="Слева страницы адресного пространства процесса по 4096 байт, справа кадры физической памяти. Страницы кода, тронутой части стека и тронутой первой страницы массива p связаны таблицей страниц со своими кадрами. Остальные страницы массива выделены — под них сделан commit, — но не тронуты, и кадров у них нет. Ниже — свободные адреса, которые никому не выданы. Замер: после new char[1 ГБ] выделено 1026 МБ, в физической памяти 3 МБ; когда тронуты все страницы — 1027 МБ">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>
  <style>
    .h{fill:#dbdfe6;font-size:18px}
    .s{fill:#80828c;font-size:14px}
    .cell{fill:rgba(255,255,255,0.05);stroke:#dbdfe6;stroke-width:1.5}
    .prom{fill:none;stroke:#80828c;stroke-width:1.5;stroke-dasharray:6 5}
    .free{fill:none;stroke:#3a3a40;stroke-width:1.5;stroke-dasharray:6 5}
    .other{fill:none;stroke:#3a3a40;stroke-width:1.5}
    .t{fill:#dbdfe6;font-size:15px}
    .m{fill:#dbdfe6;font-size:14px;font-family:Consolas, Roboto Mono, monospace}
    .g{fill:#80828c;font-size:15px}
    .d{fill:#5c5e66;font-size:15px}
    .pl{stroke:#ff8a8a;stroke-width:2;fill:none}
  </style>

  <rect x="1" y="1" width="1058" height="398" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <text class="h" x="40" y="44">адреса процесса</text>
  <text class="s" x="190" y="44">страницы по 4096 байт</text>
  <text class="h" x="720" y="44">физическая память</text>

  <!-- страницы -->
  <rect class="cell" x="40" y="62" width="300" height="38"/>
  <text class="t" x="56" y="87">код, <tspan class="m">.text</tspan></text>
  <rect class="cell" x="40" y="104" width="300" height="38"/>
  <text class="t" x="56" y="129">стек, тронутая часть</text>
  <rect class="cell" x="40" y="146" width="300" height="38"/>
  <text class="m" x="56" y="171">p[0 .. 4095]</text>
  <text class="g" x="186" y="171">тронута</text>
  <rect class="prom" x="40" y="188" width="300" height="38"/>
  <text class="m" x="56" y="213" fill="#80828c">p[4096 .. 8191]</text>
  <text class="g" x="200" y="213">commit</text>
  <rect class="prom" x="40" y="230" width="300" height="38"/>
  <text class="g" x="56" y="255">… ещё 262 142 страницы</text>
  <rect class="free" x="40" y="272" width="300" height="38"/>
  <text class="d" x="56" y="297">свободные адреса</text>

  <!-- кадры -->
  <rect class="other" x="720" y="62" width="300" height="38"/>
  <text class="d" x="736" y="87">чужой процесс</text>
  <rect class="cell" x="720" y="104" width="300" height="38"/>
  <text class="t" x="736" y="129">кадр</text>
  <rect class="cell" x="720" y="146" width="300" height="38"/>
  <text class="t" x="736" y="171">кадр</text>
  <rect class="other" x="720" y="188" width="300" height="38"/>
  <text class="d" x="736" y="213">чужой процесс</text>
  <rect class="cell" x="720" y="230" width="300" height="38"/>
  <text class="t" x="736" y="255">кадр</text>
  <rect class="other" x="720" y="272" width="300" height="38"/>
  <text class="d" x="736" y="297">свободен</text>

  <!-- таблица страниц -->
  <path class="pl" d="M 340 81 C 520 81, 540 249, 716 249" marker-end="url(#pink)"/>
  <path class="pl" d="M 340 123 C 520 123, 540 123, 716 123" marker-end="url(#pink)"/>
  <path class="pl" d="M 340 165 C 520 165, 540 165, 716 165" marker-end="url(#pink)"/>
  <text class="s" x="530" y="100" text-anchor="middle">таблица страниц</text>
  <text class="s" x="530" y="292" text-anchor="middle">после commit кадра ещё нет,</text>
  <text class="s" x="530" y="310" text-anchor="middle">он появится при первом касании</text>

  <line x1="40" y1="330" x2="1020" y2="330" stroke="#26262b" stroke-width="1.5"/>
  <text class="t" x="40" y="360"><tspan class="m">new char[1 ГБ]</tspan>: выделено 1026 МБ, в физической памяти 3 МБ</text>
  <text class="t" x="40" y="384">тронута половина страниц — 515 МБ, тронуты все — 1027 МБ</text>
</svg>
