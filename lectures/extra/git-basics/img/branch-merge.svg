<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 392" width="1060" height="392" role="img" aria-label="Ветвление и слияние. Нижняя линия — ветка main с тремя коммитами подряд. От второго коммита вверх отходит вторая линия из двух коммитов, помеченная розовой меткой fix-parser: её создали командой git switch -c fix-parser. Последний коммит main имеет двух родителей — предыдущий коммит main и последний коммит ветки: это результат команды git merge fix-parser. На него указывают розовые метки main и HEAD">
  <defs>
    <marker id="pk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path fill="#ff8a8a" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <style>
    .t{fill:#dbdfe6;font-size:17px}
    .t-s{fill:#80828c;font-size:14.5px}
    .t-ref{fill:#ff8a8a;font-size:15px}
    .nd{fill:rgba(255,255,255,0.045);stroke:#dbdfe6;stroke-width:1.5}
    .nd-eye{fill:rgba(255,255,255,0.14);stroke:#ffffff;stroke-width:2}
    .bx-ref{fill:rgba(255,138,138,0.08);stroke:#ff8a8a;stroke-width:1.5}
    .ln-pk{stroke:#ff8a8a;stroke-width:1.8;fill:none}
    .hair{stroke:#26262b;stroke-width:1;fill:none}
    .mono{font-family:Consolas, Roboto Mono, monospace}
  </style>

  <rect x="1" y="1" width="1058" height="390" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <g font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">

    <rect class="bx-ref" x="530" y="50" width="140" height="30" rx="2"/>
    <text class="t-ref mono" x="600" y="71" text-anchor="middle">fix-parser</text>
    <line class="ln-pk" x1="600" y1="80" x2="600" y2="102" marker-end="url(#pk)"/>

    <circle class="nd" cx="390" cy="120" r="14"/>
    <circle class="nd" cx="600" cy="120" r="14"/>
    <line class="ln-pk" x1="584" y1="120" x2="406" y2="120" marker-end="url(#pk)"/>

    <text class="t-s" x="76" y="236">…</text>
    <circle class="nd" cx="110" cy="230" r="14"/>
    <circle class="nd" cx="250" cy="230" r="14"/>
    <circle class="nd" cx="520" cy="230" r="14"/>
    <circle class="nd-eye" cx="790" cy="230" r="15"/>
    <line class="ln-pk" x1="234" y1="230" x2="126" y2="230" marker-end="url(#pk)"/>
    <line class="ln-pk" x1="504" y1="230" x2="266" y2="230" marker-end="url(#pk)"/>
    <line class="ln-pk" x1="774" y1="230" x2="536" y2="230" marker-end="url(#pk)"/>

    <path class="ln-pk" d="M 378 131 C 340 160, 310 192, 264 219" marker-end="url(#pk)"/>
    <path class="ln-pk" d="M 779 218 C 732 190, 690 150, 614 130" marker-end="url(#pk)"/>

    <rect class="bx-ref" x="826" y="215" width="88" height="30" rx="2"/>
    <text class="t-ref mono" x="870" y="236" text-anchor="middle">main</text>
    <line class="ln-pk" x1="822" y1="230" x2="808" y2="230" marker-end="url(#pk)"/>
    <rect class="bx-ref" x="944" y="215" width="76" height="30" rx="2"/>
    <text class="t-ref mono" x="982" y="236" text-anchor="middle">HEAD</text>
    <line class="ln-pk" x1="940" y1="230" x2="918" y2="230" marker-end="url(#pk)"/>

    <line class="hair" x1="250" y1="248" x2="250" y2="268"/>
    <line class="hair" x1="790" y1="249" x2="790" y2="268"/>
    <text class="t-s mono" x="250" y="288" text-anchor="middle">git switch -c fix-parser</text>
    <text class="t-s mono" x="790" y="288" text-anchor="middle">git merge fix-parser</text>

    <line class="hair" x1="40" y1="316" x2="1020" y2="316"/>
    <text class="t" x="40" y="344">Кружок — коммит. Ветка — подвижный указатель на коммит, а не копия каталога: завести её ничего не стоит.</text>
    <text class="t" x="40" y="372">Слияние сводит две линии в один коммит, у которого два родителя.</text>
  </g>
</svg>
