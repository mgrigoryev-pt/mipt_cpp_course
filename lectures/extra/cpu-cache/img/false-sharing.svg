<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 320" width="1060" height="320"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif"
     role="img" aria-label="Слева счётчики a и b соседние и лежат в одной кэш-линии. Поток на ядре 0 пишет a, поток на ядре 1 пишет b, но записывать ядро может только кэш-линию, которой владеет, и кэш-линия переходит между ядрами при каждой записи — лучшее время 94 мс. Справа alignas(64) разносит счётчики по разным кэш-линиям, у каждого ядра своя, передавать нечего — 74 мс">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>
  <style>
    .h{fill:#dbdfe6;font-size:18px}
    .s{fill:#80828c;font-size:14px}
    .ms{fill:#ffffff;font-size:17px;font-family:Consolas, Roboto Mono, monospace}
    .core{fill:rgba(255,255,255,0.03);stroke:#dbdfe6;stroke-width:1.5}
    .t{fill:#dbdfe6;font-size:15px}
    .m{fill:#dbdfe6;font-size:15px;font-family:Consolas, Roboto Mono, monospace}
    .line{fill:rgba(255,255,255,0.06);stroke:#dbdfe6;stroke-width:1.5}
    .own{fill:rgba(255,138,138,0.10);stroke:#ff8a8a;stroke-width:1.5}
    .gone{fill:none;stroke:#5c5e66;stroke-width:1.5;stroke-dasharray:6 5}
  </style>

  <rect x="1" y="1" width="1058" height="318" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="30" x2="530" y2="290" stroke="#26262b" stroke-width="1.5"/>

  <!-- слева: одна строка -->
  <text class="h" x="40" y="46">в одной кэш-линии</text>
  <text class="ms" x="490" y="46" text-anchor="end">94 мс</text>

  <rect class="core" x="40" y="72" width="200" height="140"/>
  <text class="t" x="56" y="98">ядро 0, пишет <tspan class="m">a</tspan></text>
  <rect class="own" x="56" y="120" width="168" height="44"/>
  <text class="m" x="98" y="148" text-anchor="middle">a</text>
  <text class="m" x="182" y="148" text-anchor="middle">b</text>
  <line x1="140" y1="120" x2="140" y2="164" stroke="#ff8a8a" stroke-width="1"/>
  <text class="s" x="56" y="192">кэш-линия его — пока</text>

  <rect class="core" x="290" y="72" width="200" height="140"/>
  <text class="t" x="306" y="98">ядро 1, пишет <tspan class="m">b</tspan></text>
  <rect class="gone" x="306" y="120" width="168" height="44"/>
  <text class="m" x="348" y="148" text-anchor="middle" fill="#5c5e66">a</text>
  <text class="m" x="432" y="148" text-anchor="middle" fill="#5c5e66">b</text>
  <text class="s" x="306" y="192">ждёт, чтобы записать</text>

  <path d="M 226 136 C 250 118, 280 118, 302 136" fill="none" stroke="#ff8a8a" stroke-width="2"
        marker-start="url(#pink)" marker-end="url(#pink)"/>
  <text class="s" x="265" y="246" text-anchor="middle">кэш-линия переходит между ядрами</text>
  <text class="s" x="265" y="266" text-anchor="middle">при каждой записи</text>

  <!-- справа: разные строки -->
  <text class="h" x="570" y="46"><tspan font-family="Consolas, Roboto Mono, monospace">alignas(64)</tspan>: в разных кэш-линиях</text>
  <text class="ms" x="1020" y="46" text-anchor="end">74 мс</text>

  <rect class="core" x="570" y="72" width="200" height="140"/>
  <text class="t" x="586" y="98">ядро 0, пишет <tspan class="m">a</tspan></text>
  <rect class="own" x="586" y="120" width="168" height="44"/>
  <text class="m" x="670" y="148" text-anchor="middle">a</text>
  <text class="s" x="586" y="192">своя кэш-линия</text>

  <rect class="core" x="820" y="72" width="200" height="140"/>
  <text class="t" x="836" y="98">ядро 1, пишет <tspan class="m">b</tspan></text>
  <rect class="own" x="836" y="120" width="168" height="44"/>
  <text class="m" x="920" y="148" text-anchor="middle">b</text>
  <text class="s" x="836" y="192">своя кэш-линия</text>

  <text class="s" x="795" y="246" text-anchor="middle">передавать нечего</text>
  <text class="s" x="530" y="306" text-anchor="middle">i7-12700H, два производительных ядра, лучший из пяти прогонов по 200 млн записей на поток</text>
</svg>
