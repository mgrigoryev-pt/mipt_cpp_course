<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" width="1060" height="520"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif"
     role="img" aria-label="Жизнь процесса по шагам в четыре полосы. Система: создать процесс и пустое адресное пространство, отобразить образ по случайной базе. Загрузчик: загрузить библиотеки из таблицы импорта, рекурсивно; вписать адреса импорта; настроить память под thread_local. Стартовый код стандартной библиотеки, точка входа mainCRTStartup или _start: куча и stdio, argc и argv, конструкторы глобальных объектов. Ваш код: main. После return из main снова стартовый код: exit, обработчики atexit и деструкторы статических объектов в обратном порядке, сброс буферов, код завершения системе">
  <defs>
    <marker id="grey" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
  </defs>
  <style>
    .lane{fill:rgba(255,255,255,0.025);stroke:#26262b;stroke-width:1.5}
    .lh{fill:#80828c;font-size:14px;font-weight:600;letter-spacing:.05em}
    .step{fill:rgba(255,255,255,0.05);stroke:#dbdfe6;stroke-width:1.5}
    .main{fill:rgba(255,255,255,0.10);stroke:#ffffff;stroke-width:2}
    .n{fill:#80828c;font-size:14px;font-family:Consolas, Roboto Mono, monospace}
    .t{fill:#dbdfe6;font-size:15px}
    .m{fill:#dbdfe6;font-size:14px;font-family:Consolas, Roboto Mono, monospace}
    .ln{stroke:#80828c;stroke-width:1.5;fill:none}
  </style>

  <rect x="1" y="1" width="1058" height="518" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- полосы -->
  <rect class="lane" x="40" y="30" width="980" height="92"/>
  <text class="lh" x="56" y="54">СИСТЕМА</text>
  <rect class="lane" x="40" y="130" width="980" height="92"/>
  <text class="lh" x="56" y="154">ЗАГРУЗЧИК</text>
  <rect class="lane" x="40" y="230" width="980" height="182"/>
  <text class="lh" x="56" y="254">СТАРТОВЫЙ КОД</text>
  <text class="m" x="56" y="274" fill="#80828c">mainCRTStartup</text>
  <text class="m" x="56" y="292" fill="#80828c">_start</text>
  <rect class="lane" x="40" y="420" width="980" height="80"/>
  <text class="lh" x="56" y="444">ВАШ КОД</text>

  <!-- система -->
  <rect class="step" x="220" y="44" width="250" height="64"/>
  <text class="n" x="232" y="66">1</text>
  <text class="t" x="252" y="66">создать процесс и пустое</text>
  <text class="t" x="252" y="88">адресное пространство</text>
  <rect class="step" x="500" y="44" width="250" height="64"/>
  <text class="n" x="512" y="66">2</text>
  <text class="t" x="532" y="66">отобразить образ по</text>
  <text class="t" x="532" y="88">случайной базе, с правами</text>

  <!-- загрузчик -->
  <rect class="step" x="220" y="144" width="250" height="64"/>
  <text class="n" x="232" y="166">3</text>
  <text class="t" x="252" y="166">загрузить библиотеки</text>
  <text class="t" x="252" y="188">из импорта, рекурсивно</text>
  <rect class="step" x="500" y="144" width="250" height="64"/>
  <text class="n" x="512" y="166">4</text>
  <text class="t" x="532" y="166">вписать адреса</text>
  <text class="t" x="532" y="188">в ячейки импорта</text>
  <rect class="step" x="780" y="144" width="220" height="64"/>
  <text class="n" x="792" y="166">5</text>
  <text class="t" x="812" y="166">память под</text>
  <text class="m" x="812" y="188">thread_local</text>

  <!-- стартовый код, до main -->
  <rect class="step" x="220" y="244" width="250" height="64"/>
  <text class="n" x="232" y="266">6</text>
  <text class="t" x="252" y="266">куча, <tspan class="m">stdio</tspan>,</text>
  <text class="t" x="252" y="288"><tspan class="m">argc</tspan> и <tspan class="m">argv</tspan></text>
  <rect class="step" x="500" y="244" width="250" height="64"/>
  <text class="n" x="512" y="266">7</text>
  <text class="t" x="532" y="266">конструкторы</text>
  <text class="t" x="532" y="288">глобальных объектов</text>

  <!-- после main -->
  <rect class="step" x="500" y="330" width="250" height="64"/>
  <text class="n" x="512" y="352">9</text>
  <text class="t" x="532" y="352"><tspan class="m">exit</tspan>: <tspan class="m">atexit</tspan> и деструкторы</text>
  <text class="t" x="532" y="374">в обратном порядке</text>
  <rect class="step" x="780" y="330" width="220" height="64"/>
  <text class="n" x="792" y="352">10</text>
  <text class="t" x="816" y="352">сбросить буферы,</text>
  <text class="t" x="816" y="374">код завершения</text>

  <!-- main -->
  <rect class="main" x="780" y="432" width="220" height="56"/>
  <text class="n" x="792" y="464">8</text>
  <text x="890" y="467" font-size="18" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">main(argc, argv)</text>

  <!-- поток управления -->
  <line class="ln" x1="470" y1="76" x2="498" y2="76" marker-end="url(#grey)"/>
  <path class="ln" d="M 625 108 V 124 H 345 V 142" marker-end="url(#grey)"/>
  <line class="ln" x1="470" y1="176" x2="498" y2="176" marker-end="url(#grey)"/>
  <line class="ln" x1="750" y1="176" x2="778" y2="176" marker-end="url(#grey)"/>
  <path class="ln" d="M 890 208 V 226 H 345 V 242" marker-end="url(#grey)"/>
  <line class="ln" x1="470" y1="276" x2="498" y2="276" marker-end="url(#grey)"/>
  <path class="ln" d="M 750 276 H 1010 V 460 H 1003" marker-end="url(#grey)"/>
  <path class="ln" d="M 780 460 H 625 V 396" marker-end="url(#grey)"/>
  <text class="s" x="632" y="420" font-size="14" fill="#80828c">return</text>
  <line class="ln" x1="750" y1="362" x2="778" y2="362" marker-end="url(#grey)"/>
</svg>
