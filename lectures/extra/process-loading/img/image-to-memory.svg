<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" width="1060" height="470"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif"
     role="img" aria-label="Слева файл addr.exe: заголовки, секции .text, .rdata, .data, .pdata, .reloc. Справа адресное пространство процесса: секции отображены по случайной базе 0x7ff7f0400000 с правами — .text чтение и выполнение, .rdata только чтение, .data чтение и запись, причём .data в памяти длиннее, чем в файле: хвост из нулей, .bss, в файл не записан. Куча и стек лежат отдельно, по своим адресам">
  <defs>
    <marker id="grey" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
  </defs>
  <style>
    .h{fill:#dbdfe6;font-size:18px}
    .cell{fill:rgba(255,255,255,0.05);stroke:#dbdfe6;stroke-width:1.5}
    .dim{fill:none;stroke:#3a3a40;stroke-width:1.5;stroke-dasharray:6 5}
    .nm{fill:#ffffff;font-size:16px;font-family:Consolas, Roboto Mono, monospace}
    .s{fill:#80828c;font-size:14px}
    .perm{fill:#dbdfe6;font-size:15px;font-family:Consolas, Roboto Mono, monospace}
    .addr{fill:#ff8a8a;font-size:14px;font-family:Consolas, Roboto Mono, monospace}
    .ln{stroke:#80828c;stroke-width:1.5;fill:none}
  </style>

  <rect x="1" y="1" width="1058" height="468" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- файл -->
  <text class="h" x="40" y="44">файл <tspan font-family="Consolas, Roboto Mono, monospace">addr.exe</tspan></text>
  <rect class="cell" x="40" y="62" width="240" height="40"/>
  <text class="s" x="56" y="87">заголовки, таблица импорта</text>
  <rect class="cell" x="40" y="102" width="240" height="70"/>
  <text class="nm" x="56" y="132">.text</text>
  <text class="s" x="56" y="156">машинный код</text>
  <rect class="cell" x="40" y="172" width="240" height="66"/>
  <text class="nm" x="56" y="200">.rdata</text>
  <text class="s" x="56" y="224">константы, литералы</text>
  <rect class="cell" x="40" y="238" width="240" height="44"/>
  <text class="nm" x="56" y="266">.data</text>
  <text class="s" x="120" y="266">5 КБ в файле</text>
  <rect class="cell" x="40" y="282" width="240" height="40"/>
  <text class="nm" x="56" y="307">.pdata</text>
  <text class="s" x="126" y="307">таблицы раскрутки</text>
  <rect class="cell" x="40" y="322" width="240" height="40"/>
  <text class="nm" x="56" y="347">.reloc</text>
  <text class="s" x="126" y="347">релокации для ASLR</text>

  <!-- стрелки -->
  <line class="ln" x1="280" y1="137" x2="488" y2="137" marker-end="url(#grey)"/>
  <line class="ln" x1="280" y1="205" x2="488" y2="205" marker-end="url(#grey)"/>
  <line class="ln" x1="280" y1="260" x2="488" y2="268" marker-end="url(#grey)"/>
  <text class="s" x="384" y="126" text-anchor="middle">отображается</text>

  <!-- память -->
  <text class="h" x="492" y="44">память процесса</text>
  <text class="s" x="640" y="44">база <tspan font-family="Consolas, Roboto Mono, monospace">0x7ff7f0400000</tspan> — своя в каждом запуске</text>

  <rect class="cell" x="492" y="102" width="220" height="70"/>
  <text class="nm" x="508" y="132">.text</text>
  <text class="perm" x="508" y="156">r-x</text>
  <text class="addr" x="730" y="132">0x7ff7f0401000</text>
  <text class="s" x="730" y="154">code_marker</text>

  <rect class="cell" x="492" y="172" width="220" height="66"/>
  <text class="nm" x="508" y="200">.rdata</text>
  <text class="perm" x="508" y="224">r--</text>
  <text class="addr" x="730" y="200">0x7ff7f04635d0</text>
  <text class="s" x="730" y="222">"hello"</text>

  <rect class="cell" x="492" y="238" width="220" height="60"/>
  <text class="nm" x="508" y="264">.data</text>
  <text class="perm" x="508" y="286">rw-</text>
  <text class="addr" x="730" y="264">0x7ff7f046c000</text>
  <text class="s" x="730" y="286">int initialized = 42</text>
  <rect x="492" y="298" width="220" height="40" fill="rgba(255,255,255,0.02)" stroke="#dbdfe6"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="s" x="508" y="323">нули, в файле их нет</text>
  <text class="addr" x="730" y="323">0x7ff7f046d240</text>
  <text class="s" x="860" y="323">int zeroed</text>

  <line x1="492" y1="362" x2="1020" y2="362" stroke="#26262b" stroke-width="1.5"/>

  <rect class="cell" x="492" y="378" width="220" height="36"/>
  <text class="nm" x="508" y="402">куча</text>
  <text class="perm" x="580" y="402">rw-</text>
  <text class="addr" x="730" y="402">0x26459301bc0</text>
  <text class="s" x="872" y="402">new int</text>
  <rect class="cell" x="492" y="414" width="220" height="36"/>
  <text class="nm" x="508" y="438">стек</text>
  <text class="perm" x="580" y="438">rw-</text>
  <text class="addr" x="730" y="438">0x808157f7f4</text>
  <text class="s" x="872" y="438">int local</text>

  <text class="s" x="40" y="402">в файле их нет вовсе:</text>
  <text class="s" x="40" y="422">создаются при запуске</text>
</svg>
