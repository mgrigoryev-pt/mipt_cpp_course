<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" width="1060" height="330"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif"
     role="img" aria-label="Один байт, два прочтения. Биты 11111111: как uint8_t старший бит весит 128, и это 255; как int8_t старший бит весит минус 128, и это минус 1. Биты 10000000: 128 и минус 128. Остальные разряды весят одинаково; дополнительный код отличается только знаком веса старшего бита">
  <style>
    .h{fill:#dbdfe6;font-size:16px}
    .s{fill:#80828c;font-size:14px}
    .bit{fill:rgba(255,255,255,0.05);stroke:#dbdfe6;stroke-width:1.5}
    .top{fill:rgba(255,138,138,0.08);stroke:#ff8a8a;stroke-width:1.5}
    .b{fill:#ffffff;font-size:22px;font-family:Consolas, Roboto Mono, monospace;text-anchor:middle}
    .w{fill:#80828c;font-size:14px;font-family:Consolas, Roboto Mono, monospace;text-anchor:middle}
    .wt{fill:#ff8a8a;font-size:14px;font-family:Consolas, Roboto Mono, monospace;text-anchor:middle}
    .lab{fill:#dbdfe6;font-size:15px;font-family:Consolas, Roboto Mono, monospace}
    .res{fill:#ffffff;font-size:20px;font-family:Consolas, Roboto Mono, monospace}
  </style>

  <rect x="1" y="1" width="1058" height="328" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- пример 1 -->
  <text class="h" x="40" y="40">биты <tspan font-family="Consolas, Roboto Mono, monospace">11111111</tspan></text>
  <rect class="top" x="200" y="56" width="52" height="48"/><text class="b" x="226" y="88">1</text>
  <rect class="bit" x="252" y="56" width="52" height="48"/><text class="b" x="278" y="88">1</text>
  <rect class="bit" x="304" y="56" width="52" height="48"/><text class="b" x="330" y="88">1</text>
  <rect class="bit" x="356" y="56" width="52" height="48"/><text class="b" x="382" y="88">1</text>
  <rect class="bit" x="408" y="56" width="52" height="48"/><text class="b" x="434" y="88">1</text>
  <rect class="bit" x="460" y="56" width="52" height="48"/><text class="b" x="486" y="88">1</text>
  <rect class="bit" x="512" y="56" width="52" height="48"/><text class="b" x="538" y="88">1</text>
  <rect class="bit" x="564" y="56" width="52" height="48"/><text class="b" x="590" y="88">1</text>

  <text class="lab" x="40" y="126">uint8_t</text>
  <text class="w" x="226" y="126">128</text><text class="w" x="278" y="126">64</text>
  <text class="w" x="330" y="126">32</text><text class="w" x="382" y="126">16</text>
  <text class="w" x="434" y="126">8</text><text class="w" x="486" y="126">4</text>
  <text class="w" x="538" y="126">2</text><text class="w" x="590" y="126">1</text>
  <text class="res" x="660" y="128">= 255</text>

  <text class="lab" x="40" y="150">int8_t</text>
  <text class="wt" x="226" y="150">−128</text><text class="w" x="278" y="150">64</text>
  <text class="w" x="330" y="150">32</text><text class="w" x="382" y="150">16</text>
  <text class="w" x="434" y="150">8</text><text class="w" x="486" y="150">4</text>
  <text class="w" x="538" y="150">2</text><text class="w" x="590" y="150">1</text>
  <text class="res" x="660" y="152">= −1</text>

  <line x1="40" y1="176" x2="1020" y2="176" stroke="#26262b" stroke-width="1.5"/>

  <!-- пример 2 -->
  <text class="h" x="40" y="210">биты <tspan font-family="Consolas, Roboto Mono, monospace">10000000</tspan></text>
  <rect class="top" x="200" y="226" width="52" height="48"/><text class="b" x="226" y="258">1</text>
  <rect class="bit" x="252" y="226" width="52" height="48"/><text class="b" x="278" y="258">0</text>
  <rect class="bit" x="304" y="226" width="52" height="48"/><text class="b" x="330" y="258">0</text>
  <rect class="bit" x="356" y="226" width="52" height="48"/><text class="b" x="382" y="258">0</text>
  <rect class="bit" x="408" y="226" width="52" height="48"/><text class="b" x="434" y="258">0</text>
  <rect class="bit" x="460" y="226" width="52" height="48"/><text class="b" x="486" y="258">0</text>
  <rect class="bit" x="512" y="226" width="52" height="48"/><text class="b" x="538" y="258">0</text>
  <rect class="bit" x="564" y="226" width="52" height="48"/><text class="b" x="590" y="258">0</text>
  <text class="lab" x="40" y="296">uint8_t</text>
  <text class="res" x="200" y="298">= 128</text>
  <text class="lab" x="400" y="296">int8_t</text>
  <text class="res" x="480" y="298">= −128</text>

  <text class="s" x="700" y="220">разряды весят одинаково,</text>
  <text class="s" x="700" y="240">кроме старшего: у знакового</text>
  <text class="s" x="700" y="260">его вес отрицательный</text>
</svg>
