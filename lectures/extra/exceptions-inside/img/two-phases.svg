<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 400" width="1060" height="400"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif"
     role="img" aria-label="Стек вызовов main, load, parse, и parse бросает. Фаза 1, поиск: раскрутка поднимается по кадрам, читая таблицы, и спрашивает у каждого, есть ли подходящий catch; в parse и load нет, в main есть. Деструкторы в этой фазе не вызываются, стек не трогается. Фаза 2, раскрутка: кадры снимаются сверху вниз, в каждом вызываются деструкторы локальных объектов — Guard в parse, buffer в load, — и управление входит в catch в main. Если фаза 1 не нашла обработчика, вызывается std::terminate, и раскручивать ли стек перед этим — решает реализация">
  <defs>
    <marker id="grey" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>
  <style>
    .fr{fill:rgba(255,255,255,0.05);stroke:#dbdfe6;stroke-width:1.5}
    .nm{fill:#ffffff;font-size:16px;font-family:Consolas, Roboto Mono, monospace}
    .m{fill:#dbdfe6;font-size:14px;font-family:Consolas, Roboto Mono, monospace}
    .s{fill:#80828c;font-size:14px}
    .t{fill:#dbdfe6;font-size:15px}
    .h{fill:#dbdfe6;font-size:14px;font-weight:600;letter-spacing:.05em}
    .ln{stroke:#80828c;stroke-width:1.5;fill:none}
  </style>

  <rect x="1" y="1" width="1058" height="398" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- стек -->
  <text class="s" x="40" y="36">стек, верх — последний вызов</text>
  <rect class="fr" x="40" y="50" width="280" height="80"/>
  <text class="nm" x="56" y="76">parse</text>
  <text class="m" x="56" y="100">Guard g;</text>
  <text class="m" x="56" y="120">throw ParseError{…};</text>

  <rect class="fr" x="40" y="140" width="280" height="80"/>
  <text class="nm" x="56" y="166">load</text>
  <text class="m" x="56" y="190">std::string buffer;</text>
  <text class="m" x="56" y="210">parse(buffer);</text>

  <rect class="fr" x="40" y="230" width="280" height="80"/>
  <text class="nm" x="56" y="256">main</text>
  <text class="m" x="56" y="280">try { load(); }</text>
  <text class="m" x="56" y="300">catch (const ParseError&amp;)</text>

  <!-- фаза 1 -->
  <text class="h" x="370" y="36">ФАЗА 1 · ПОИСК</text>
  <text class="t" x="370" y="80">parse: catch нет</text>
  <text class="t" x="370" y="170">load: catch нет</text>
  <text class="t" x="370" y="260">main: подходящий catch есть ✓</text>
  <line class="ln" x1="360" y1="96" x2="360" y2="240" marker-end="url(#grey)"/>
  <text class="s" x="370" y="104">только читает таблицы,</text>
  <text class="s" x="370" y="122">деструкторы не вызывает</text>

  <!-- фаза 2 -->
  <text class="h" x="700" y="36">ФАЗА 2 · РАСКРУТКА</text>
  <text class="t" x="710" y="80"><tspan class="m">~Guard()</tspan>, кадр parse снят</text>
  <text class="t" x="710" y="170"><tspan class="m">~string()</tspan>, кадр load снят</text>
  <text class="t" x="710" y="260">вход в <tspan class="m">catch</tspan> в main</text>
  <line x1="700" y1="96" x2="700" y2="240" stroke="#ff8a8a" stroke-width="2" marker-end="url(#pink)"/>

  <line x1="40" y1="334" x2="1020" y2="334" stroke="#26262b" stroke-width="1.5"/>
  <text class="t" x="40" y="364">фаза 1 не нашла обработчика — <tspan class="m">std::terminate</tspan>;</text>
  <text class="s" x="40" y="386">выполнять ли перед этим фазу 2, решает реализация: clang под Windows в опыте ниже её не выполнил</text>
</svg>
