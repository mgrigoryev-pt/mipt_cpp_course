<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" width="1060" height="330"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif"
     role="img" aria-label="Программа собрана с заголовком версии 1 и отвела под ProcessInfo восемь байт: pid и ppid. Библиотека собрана с версией 2 и пишет по своему layout: pid, восемь байт user, затем ppid — шестнадцать байт. Всё, что дальше восьмого байта, ложится на чужую память стека">
  <style>
    .lab{fill:#dbdfe6;font-size:17px}
    .s{fill:#80828c;font-size:14px}
    .cell{fill:rgba(255,255,255,0.05);stroke:#dbdfe6;stroke-width:2}
    .val{fill:#ffffff;font-size:22px;font-family:Consolas, Roboto Mono, monospace;text-anchor:middle}
    .nm{fill:#80828c;font-size:15px;font-family:Consolas, Roboto Mono, monospace;text-anchor:middle}
    .bad{fill:rgba(255,32,32,0.08);stroke:#ff2020;stroke-width:2;stroke-dasharray:7 6}
    .badv{fill:#ff2020;font-size:22px;font-family:Consolas, Roboto Mono, monospace;text-anchor:middle}
    .off{fill:#80828c;font-size:14px;font-family:Consolas, Roboto Mono, monospace;text-anchor:middle}
  </style>

  <rect x="1" y="1" width="1058" height="328" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- строка 1: программа, v1 -->
  <text class="lab" x="92" y="44">программа, заголовок v1: <tspan font-family="Consolas, Roboto Mono, monospace">sizeof(ProcessInfo) = 8</tspan></text>
  <rect class="cell" x="92" y="60" width="232" height="60"/>
  <text class="val" x="208" y="98">0</text>
  <rect class="cell" x="324" y="60" width="232" height="60"/>
  <text class="val" x="440" y="98">0</text>
  <rect x="556" y="60" width="464" height="60" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="788" y="96" font-size="16" text-anchor="middle" fill="#5c5e66">соседние данные стека</text>
  <text class="nm" x="208" y="142">pid</text>
  <text class="nm" x="440" y="142">ppid</text>

  <!-- строка 2: библиотека, v2 -->
  <text class="lab" x="92" y="190">библиотека, заголовок v2, пишет по своему layout: <tspan font-family="Consolas, Roboto Mono, monospace">16 байт</tspan></text>
  <rect class="cell" x="92" y="206" width="232" height="60"/>
  <text class="val" x="208" y="244">4242</text>
  <rect class="cell" x="324" y="206" width="232" height="60"/>
  <rect class="bad" x="556" y="206" width="232" height="60"/>
  <text class="val" x="440" y="244">"roo</text>
  <text class="badv" x="672" y="244">t\0"</text>
  <rect class="bad" x="788" y="206" width="232" height="60"/>
  <text class="badv" x="904" y="244">1</text>
  <text class="nm" x="208" y="288">pid</text>
  <text class="nm" x="556" y="288">user[8]</text>
  <text class="nm" x="904" y="288">ppid</text>

  <!-- граница объекта -->
  <line x1="556" y1="54" x2="556" y2="156" stroke="#ff2020" stroke-width="2"/>
  <line x1="556" y1="200" x2="556" y2="272" stroke="#ff2020" stroke-width="2"/>
  <text x="566" y="150" font-size="14" fill="#ff2020">конец объекта для программы</text>

  <text class="off" x="92" y="314">0</text>
  <text class="off" x="324" y="314">4</text>
  <text class="off" x="556" y="314">8</text>
  <text class="off" x="788" y="314">12</text>
  <text class="off" x="1020" y="314">16</text>
</svg>
