<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 390" width="1060" height="390"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif"
     role="img" aria-label="Слева статическая библиотека: архив geom.lib с объектным файлом, линкер копирует код area в app.exe, и при запуске библиотека не нужна. Справа динамическая: импортная geom.lib с одной заглушкой, в app.exe попадает только таблица импорта со строкой geom.dll и имя функции, а код area остаётся в geom.dll и подключается при запуске">
  <defs>
    <marker id="grey" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>
  <style>
    .bx{fill:rgba(255,255,255,0.05);stroke:#dbdfe6;stroke-width:1.5}
    .bx-dim{fill:none;stroke:#5c5e66;stroke-width:1.5;stroke-dasharray:7 6}
    .h{fill:#dbdfe6;font-size:18px}
    .nm{fill:#ffffff;font-size:16px;font-family:Consolas, Roboto Mono, monospace}
    .code{fill:#dbdfe6;font-size:14px;font-family:Consolas, Roboto Mono, monospace}
    .ptr{fill:#ff8a8a;font-size:14px;font-family:Consolas, Roboto Mono, monospace}
    .s{fill:#80828c;font-size:14px}
    .cell{fill:rgba(255,255,255,0.08);stroke:#80828c;stroke-width:1}
    .ln{stroke:#80828c;stroke-width:1.5;fill:none}
  </style>

  <rect x="1" y="1" width="1058" height="388" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="30" x2="530" y2="360" stroke="#26262b" stroke-width="1.5"/>

  <!-- ===== статическая ===== -->
  <text class="h" x="40" y="46">Статическая</text>
  <text class="s" x="152" y="46">geom.lib · libgeom.a</text>

  <rect class="bx" x="40" y="70" width="190" height="80"/>
  <text class="nm" x="56" y="96">main.obj</text>
  <text class="s" x="56" y="122">нужно: area</text>

  <rect class="bx" x="270" y="70" width="220" height="80"/>
  <text class="nm" x="286" y="96">geom.lib</text>
  <text class="s" x="286" y="118">архив объектных файлов:</text>
  <text class="code" x="286" y="138">geom.obj · код area</text>

  <line class="ln" x1="135" y1="150" x2="190" y2="202" marker-end="url(#grey)"/>
  <line class="ln" x1="380" y1="150" x2="325" y2="202" marker-end="url(#grey)"/>
  <text class="s" x="258" y="184" text-anchor="middle">линкер</text>

  <rect class="bx" x="110" y="206" width="310" height="104"/>
  <text class="nm" x="126" y="232">app.exe</text>
  <rect class="cell" x="126" y="244" width="130" height="48"/>
  <text class="code" x="191" y="273" text-anchor="middle">код main</text>
  <rect class="cell" x="268" y="244" width="136" height="48"/>
  <text x="336" y="273" font-size="14" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">код area</text>

  <text class="s" x="265" y="338" text-anchor="middle">код скопирован в программу;</text>
  <text class="s" x="265" y="358" text-anchor="middle">при запуске geom.lib не нужна</text>

  <!-- ===== динамическая ===== -->
  <text class="h" x="570" y="46">Динамическая</text>
  <text class="s" x="708" y="46">geom.dll · libgeom.so</text>

  <rect class="bx" x="570" y="70" width="170" height="80"/>
  <text class="nm" x="586" y="96">main.obj</text>
  <text class="s" x="586" y="122">нужно: area</text>

  <rect class="bx" x="770" y="70" width="250" height="80"/>
  <text class="nm" x="786" y="96">geom.lib</text>
  <text class="s" x="786" y="118">импортная, только Windows:</text>
  <text class="code" x="786" y="138">заглушка __imp_area</text>

  <line class="ln" x1="655" y1="150" x2="672" y2="202" marker-end="url(#grey)"/>
  <line class="ln" x1="850" y1="150" x2="745" y2="202" marker-end="url(#grey)"/>

  <rect class="bx" x="570" y="206" width="230" height="104"/>
  <text class="nm" x="586" y="232">app.exe</text>
  <rect class="cell" x="586" y="244" width="80" height="48"/>
  <text class="code" x="626" y="273" text-anchor="middle">main</text>
  <rect class="cell" x="676" y="244" width="108" height="48"/>
  <text class="ptr" x="730" y="264" text-anchor="middle">импорт:</text>
  <text class="ptr" x="730" y="283" text-anchor="middle">geom.dll</text>

  <rect class="bx" x="850" y="206" width="170" height="104"/>
  <text class="nm" x="866" y="232">geom.dll</text>
  <rect class="cell" x="866" y="244" width="138" height="48"/>
  <text x="935" y="273" font-size="14" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">код area</text>

  <path d="M 784 268 C 815 268, 830 268, 862 268" fill="none" stroke="#ff8a8a"
        stroke-width="2" stroke-dasharray="6 5" marker-end="url(#pink)"/>
  <text class="s" x="825" y="330" text-anchor="middle">подключается при запуске</text>

  <text class="s" x="795" y="358" text-anchor="middle">в программе только ссылка; без geom.dll она не стартует</text>
</svg>
