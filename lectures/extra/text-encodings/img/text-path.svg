<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 440" width="1060" height="440"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif"
     role="img" aria-label="Путь строки детект от исходника до экрана и два места, где она ломается. Файл исходника хранит байты UTF-8 d0 b4 и так далее. Компилятор должен знать кодировку файла: clang и MSVC с ключом /utf-8 читают UTF-8, и L-литерал получает шесть символов; MSVC без ключа читает файл в кодировке системы 1251, видит Рґ и так далее, и L-литерал получает двенадцать неверных символов. В программе строка — байты UTF-8. Вывод: std::print у библиотеки Microsoft передаёт текст консоли в UTF-16 и показывается верно при любой кодовой странице; std::cout и printf отдают байты, консоль читает их по своей кодовой странице: при 866 на экране ╨┤╨╡…, при 65001 — детект">
  <defs>
    <marker id="grey" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
  </defs>
  <style>
    .bx{fill:rgba(255,255,255,0.05);stroke:#dbdfe6;stroke-width:1.5}
    .badbx{fill:rgba(255,32,32,0.06);stroke:#ff2020;stroke-width:1.5;stroke-dasharray:7 6}
    .h{fill:#dbdfe6;font-size:14px;font-weight:600;letter-spacing:.05em}
    .t{fill:#dbdfe6;font-size:15px}
    .s{fill:#80828c;font-size:14px}
    .m{fill:#ffffff;font-size:15px;font-family:Consolas, Roboto Mono, monospace}
    .bad{fill:#ff2020;font-size:15px;font-family:Consolas, Roboto Mono, monospace}
    .ln{stroke:#80828c;stroke-width:1.5;fill:none}
  </style>

  <rect x="1" y="1" width="1058" height="438" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- 1. исходник -->
  <rect class="bx" x="40" y="40" width="200" height="110"/>
  <text class="h" x="56" y="66">ФАЙЛ .cpp</text>
  <text class="m" x="56" y="96">L"детект"</text>
  <text class="s" x="56" y="122">байты UTF-8:</text>
  <text class="m" x="56" y="140">d0 b4 d0 b5 …</text>

  <!-- 2. компилятор -->
  <rect class="bx" x="300" y="30" width="330" height="62"/>
  <text class="t" x="316" y="54">clang; MSVC с <tspan class="m">/utf-8</tspan></text>
  <text class="m" x="316" y="80">L"детект" — 6 символов ✓</text>
  <rect class="badbx" x="300" y="104" width="330" height="62"/>
  <text class="t" x="316" y="128">MSVC без ключа: файл в 1251</text>
  <text class="bad" x="316" y="154">L"РґРµС‚…" — 12 символов ✗</text>
  <line class="ln" x1="240" y1="80" x2="298" y2="62" marker-end="url(#grey)"/>
  <line class="ln" x1="240" y1="110" x2="298" y2="134" marker-end="url(#grey)"/>
  <text class="s" x="660" y="66">компилятор должен знать,</text>
  <text class="s" x="660" y="86">в какой кодировке файл</text>
  <text class="s" x="660" y="120">в комплекте MSVC получает</text>
  <text class="s" x="660" y="140"><tspan font-family="Consolas, Roboto Mono, monospace">/utf-8</tspan> из CMakeLists.txt</text>

  <line x1="40" y1="190" x2="1020" y2="190" stroke="#26262b" stroke-width="1.5"/>

  <!-- 3. программа -->
  <rect class="bx" x="40" y="214" width="200" height="196"/>
  <text class="h" x="56" y="240">ПРОГРАММА</text>
  <text class="m" x="56" y="270">"детект"</text>
  <text class="s" x="56" y="296">в памяти — те же</text>
  <text class="s" x="56" y="314">12 байт UTF-8</text>

  <!-- 4. вывод -->
  <rect class="bx" x="300" y="214" width="250" height="56"/>
  <text class="m" x="316" y="238">std::print</text>
  <text class="s" x="316" y="258">сама переводит в UTF-16</text>
  <rect class="bx" x="300" y="290" width="250" height="56"/>
  <text class="m" x="316" y="314">std::cout, printf</text>
  <text class="s" x="316" y="334">отдают байты как есть</text>
  <line class="ln" x1="240" y1="260" x2="298" y2="242" marker-end="url(#grey)"/>
  <line class="ln" x1="240" y1="300" x2="298" y2="318" marker-end="url(#grey)"/>

  <!-- 5. экран -->
  <rect class="bx" x="620" y="214" width="400" height="56"/>
  <text class="t" x="636" y="238">любая кодовая страница</text>
  <text class="m" x="636" y="258">детект ✓</text>
  <rect class="badbx" x="620" y="290" width="400" height="56"/>
  <text class="t" x="636" y="314">консоль в 866 читает байты как 866</text>
  <text class="bad" x="636" y="334">╨┤╨╡╤В╨╡╨║╤В ✗</text>
  <rect class="bx" x="620" y="362" width="400" height="48"/>
  <text class="t" x="636" y="392">после <tspan class="m">chcp 65001</tspan>: <tspan class="m">детект ✓</tspan></text>
  <line class="ln" x1="550" y1="242" x2="618" y2="242" marker-end="url(#grey)"/>
  <line class="ln" x1="550" y1="318" x2="618" y2="318" marker-end="url(#grey)"/>
  <line class="ln" x1="560" y1="330" x2="618" y2="382" marker-end="url(#grey)"/>
</svg>
