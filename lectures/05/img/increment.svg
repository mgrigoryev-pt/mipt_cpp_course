<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" width="1060" height="330"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="light" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="328" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="36" x2="530" y2="300" stroke="#26262b" stroke-width="1.5"/>

  <!-- префиксный -->
  <text x="270" y="54" font-size="20" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">++c</text>

  <text x="145" y="88" font-size="15" text-anchor="middle" fill="#80828c">c до</text>
  <rect x="70" y="98" width="150" height="60" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="145" y="139" font-size="26" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">5</text>

  <line x1="230" y1="128" x2="292" y2="128" stroke="#dbdfe6" stroke-width="2" marker-end="url(#light)"/>
  <text x="261" y="116" font-size="15" text-anchor="middle" fill="#80828c">++</text>

  <text x="375" y="88" font-size="15" text-anchor="middle" fill="#80828c">c после</text>
  <rect x="300" y="98" width="150" height="60" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="375" y="139" font-size="26" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">6</text>

  <line x1="375" y1="162" x2="375" y2="208" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <rect x="300" y="212" width="150" height="54" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="2"/>
  <text x="375" y="247" font-size="20" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">c&amp;</text>
  <text x="286" y="245" font-size="15" text-anchor="end" fill="#80828c">возвращается</text>

  <text x="270" y="298" font-size="15" text-anchor="middle" fill="#80828c">ссылка на себя, копий нет</text>

  <!-- постфиксный -->
  <text x="790" y="54" font-size="20" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">c++</text>

  <text x="665" y="88" font-size="15" text-anchor="middle" fill="#80828c">c до</text>
  <rect x="590" y="98" width="150" height="60" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="665" y="139" font-size="26" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">5</text>

  <line x1="750" y1="128" x2="812" y2="128" stroke="#dbdfe6" stroke-width="2" marker-end="url(#light)"/>
  <text x="781" y="116" font-size="15" text-anchor="middle" fill="#80828c">++</text>

  <text x="895" y="88" font-size="15" text-anchor="middle" fill="#80828c">c после</text>
  <rect x="820" y="98" width="150" height="60" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="895" y="139" font-size="26" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">6</text>

  <line x1="665" y1="162" x2="665" y2="208" stroke="#dbdfe6" stroke-width="2" marker-end="url(#light)"/>
  <text x="685" y="192" font-size="15" fill="#80828c">копия до инкремента</text>

  <rect x="590" y="212" width="150" height="54" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="2"/>
  <text x="665" y="247" font-size="20" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">5</text>
  <text x="754" y="245" font-size="15" fill="#80828c">возвращается</text>

  <text x="790" y="298" font-size="15" text-anchor="middle" fill="#ff8a8a">лишняя копия на каждый вызов</text>
</svg>
