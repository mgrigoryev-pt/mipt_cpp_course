<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" width="1060" height="300"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
    <marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff2020"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="298" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="365" y1="36" x2="365" y2="266" stroke="#26262b" stroke-width="1.5"/>
  <line x1="715" y1="36" x2="715" y2="266" stroke="#26262b" stroke-width="1.5"/>

  <!-- момент 1: оба указателя смотрят в один буфер -->
  <text x="192" y="52" font-size="16" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">a = a</text>

  <text x="140" y="96" font-size="15" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">data_</text>
  <text x="262" y="96" font-size="15" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">other.data_</text>
  <line x1="140" y1="106" x2="170" y2="150" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <line x1="262" y1="106" x2="216" y2="150" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

  <rect x="92" y="154" width="200" height="58" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="192" y="190" font-size="20" text-anchor="middle" fill="#ffffff">буфер</text>

  <text x="192" y="248" font-size="15" text-anchor="middle" fill="#80828c">оба указателя — на один буфер</text>

  <!-- момент 2: буфер освобождён -->
  <text x="540" y="52" font-size="16" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">delete[] data_</text>

  <text x="488" y="96" font-size="15" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">data_</text>
  <text x="610" y="96" font-size="15" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">other.data_</text>
  <line x1="488" y1="106" x2="518" y2="150" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <line x1="610" y1="106" x2="564" y2="150" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

  <rect x="440" y="154" width="200" height="58" fill="none" stroke="#5c5e66"
        stroke-width="1.5" stroke-dasharray="7 6"/>
  <line x1="448" y1="206" x2="632" y2="160" stroke="#ff2020" stroke-width="2"/>
  <line x1="448" y1="160" x2="632" y2="206" stroke="#ff2020" stroke-width="2"/>

  <text x="540" y="248" font-size="15" text-anchor="middle" fill="#80828c">память отдана, указатели висят</text>

  <!-- момент 3: копирование читает из освобождённой памяти -->
  <text x="877" y="52" font-size="16" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">std::copy(other.data_, …)</text>

  <line x1="877" y1="150" x2="877" y2="108" stroke="#ff2020" stroke-width="2.5" marker-end="url(#red)"/>
  <text x="895" y="134" font-size="15" fill="#ff2020">чтение</text>

  <rect x="777" y="154" width="200" height="58" fill="none" stroke="#5c5e66"
        stroke-width="1.5" stroke-dasharray="7 6"/>
  <line x1="785" y1="206" x2="969" y2="160" stroke="#ff2020" stroke-width="2"/>
  <line x1="785" y1="160" x2="969" y2="206" stroke="#ff2020" stroke-width="2"/>

  <text x="877" y="250" font-size="18" text-anchor="middle" fill="#ff2020">use-after-free</text>
</svg>
