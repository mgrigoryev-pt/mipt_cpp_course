<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 290" width="1060" height="290"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="light" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
    <marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff2020"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="288" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="36" x2="530" y2="256" stroke="#26262b" stroke-width="1.5"/>

  <!-- метод -->
  <text x="270" y="54" font-size="19" text-anchor="middle" fill="#ff2020">метод класса</text>

  <text x="60" y="114" font-size="19" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">v + 5</text>
  <line x1="150" y1="107" x2="204" y2="107" stroke="#dbdfe6" stroke-width="2" marker-end="url(#light)"/>
  <text x="216" y="114" font-size="17" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">v.operator+(5)</text>

  <text x="60" y="176" font-size="19" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">5 + v</text>
  <line x1="150" y1="169" x2="204" y2="169" stroke="#ff2020" stroke-width="2" marker-end="url(#red)"/>
  <text x="216" y="176" font-size="17" fill="#ff2020"
        font-family="Consolas, Roboto Mono, monospace">5.operator+(v)</text>
  <text x="216" y="202" font-size="15" fill="#ff2020">у int нет методов — CE</text>

  <text x="270" y="248" font-size="15" text-anchor="middle" fill="#80828c">слева обязан стоять объект</text>

  <!-- свободная функция -->
  <text x="790" y="54" font-size="19" text-anchor="middle" fill="#dbdfe6">свободная функция</text>

  <text x="580" y="114" font-size="19" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">v + 5</text>
  <line x1="670" y1="107" x2="724" y2="107" stroke="#dbdfe6" stroke-width="2" marker-end="url(#light)"/>
  <text x="736" y="114" font-size="17" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">operator+(v, 5)</text>

  <text x="580" y="176" font-size="19" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">5 + v</text>
  <line x1="670" y1="169" x2="724" y2="169" stroke="#dbdfe6" stroke-width="2" marker-end="url(#light)"/>
  <text x="736" y="176" font-size="17" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">operator+(5, v)</text>

  <text x="790" y="248" font-size="15" text-anchor="middle" fill="#80828c">оба аргумента равноправны</text>
</svg>
