<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 290" width="1060" height="290"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="288" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <text x="530" y="52" font-size="22" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">p-&gt;x</text>
  <text x="530" y="82" font-size="16" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">p.operator-&gt;()-&gt;x</text>

  <rect x="60" y="122" width="280" height="72" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="200" y="156" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">p</text>
  <text x="200" y="180" font-size="15" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">MyUnique&lt;Point&gt;</text>

  <text x="388" y="110" font-size="14" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">operator-&gt;()</text>
  <line x1="348" y1="158" x2="428" y2="158" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

  <rect x="440" y="122" width="280" height="72" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="580" y="156" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">ptr_</text>
  <text x="580" y="180" font-size="15" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">Point*</text>

  <text x="768" y="110" font-size="14" text-anchor="middle" fill="#ff8a8a">встроенный -&gt;</text>
  <line x1="728" y1="158" x2="808" y2="158" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

  <rect x="820" y="122" width="180" height="72" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="910" y="156" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">x</text>
  <text x="910" y="180" font-size="15" text-anchor="middle" fill="#80828c">поле Point</text>

  <text x="530" y="238" font-size="16" text-anchor="middle" fill="#dbdfe6">компилятор повторяет вызов, пока результат — объект класса</text>
  <text x="530" y="264" font-size="15" text-anchor="middle" fill="#80828c">и останавливается на настоящем указателе</text>
</svg>
