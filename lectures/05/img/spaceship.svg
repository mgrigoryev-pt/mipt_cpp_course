<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" width="1060" height="300"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="light" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="298" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="500" y1="36" x2="500" y2="266" stroke="#26262b" stroke-width="1.5"/>

  <!-- до C++20: шесть перегрузок -->
  <text x="260" y="54" font-size="19" text-anchor="middle" fill="#dbdfe6">до C++20 — шесть функций</text>

  <rect x="80" y="82" width="180" height="46" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="170" y="113" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">==</text>
  <rect x="280" y="82" width="180" height="46" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="370" y="113" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">!=</text>

  <rect x="80" y="140" width="180" height="46" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="170" y="171" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">&lt;</text>
  <rect x="280" y="140" width="180" height="46" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="370" y="171" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">&gt;</text>

  <rect x="80" y="198" width="180" height="46" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="170" y="229" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">&lt;=</text>
  <rect x="280" y="198" width="180" height="46" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="370" y="229" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">&gt;=</text>

  <text x="270" y="278" font-size="15" text-anchor="middle" fill="#80828c">каждая пишется руками</text>

  <!-- C++20: один <=> плюс == -->
  <text x="770" y="54" font-size="19" text-anchor="middle" fill="#dbdfe6">C++20 — одна пара</text>

  <rect x="556" y="88" width="204" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="658" y="116" font-size="18" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">operator&lt;=&gt;</text>
  <text x="658" y="140" font-size="14" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">= default</text>

  <rect x="556" y="166" width="204" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="658" y="194" font-size="18" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">operator==</text>
  <text x="658" y="218" font-size="14" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">= default</text>

  <line x1="768" y1="159" x2="828" y2="159" stroke="#dbdfe6" stroke-width="2" marker-end="url(#light)"/>

  <text x="866" y="106" font-size="17" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">==</text>
  <text x="962" y="106" font-size="17" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">!=</text>
  <text x="866" y="164" font-size="17" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">&lt;</text>
  <text x="962" y="164" font-size="17" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">&gt;</text>
  <text x="866" y="222" font-size="17" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">&lt;=</text>
  <text x="962" y="222" font-size="17" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">&gt;=</text>

  <text x="914" y="262" font-size="15" text-anchor="middle" fill="#80828c">выводит компилятор</text>
</svg>
