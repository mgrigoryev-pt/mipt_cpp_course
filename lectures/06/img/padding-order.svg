<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 362" width="1060" height="362"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">

  <rect x="1" y="1" width="1058" height="360" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- ============ Event: char первым ============ -->
  <text x="74" y="48" font-size="19" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">struct Event</text>
  <text x="986" y="48" font-size="19" text-anchor="end" fill="#ffffff">24 байта, полезных 13</text>

  <text x="93" y="78" font-size="15" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">kind</text>
  <line x1="93" y1="84" x2="93" y2="92" stroke="#80828c" stroke-width="1.5"/>

  <rect x="74" y="94" width="38" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="93" y="144" font-size="14" text-anchor="middle" fill="#80828c">0</text>

  <rect x="112" y="94" width="266" height="64" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="245" y="124" font-size="16" text-anchor="middle" fill="#5c5e66">padding</text>
  <text x="245" y="144" font-size="14" text-anchor="middle" fill="#5c5e66">1–7</text>

  <rect x="378" y="94" width="304" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="530" y="124" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">timestamp</text>
  <text x="530" y="144" font-size="14" text-anchor="middle" fill="#80828c">8–15</text>

  <rect x="682" y="94" width="152" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="758" y="124" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">pid</text>
  <text x="758" y="144" font-size="14" text-anchor="middle" fill="#80828c">16–19</text>

  <rect x="834" y="94" width="152" height="64" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="910" y="124" font-size="16" text-anchor="middle" fill="#5c5e66">padding</text>
  <text x="910" y="144" font-size="14" text-anchor="middle" fill="#5c5e66">20–23</text>

  <line x1="40" y1="190" x2="1020" y2="190" stroke="#26262b" stroke-width="1.5"/>

  <!-- ============ CompactEvent: от большего выравнивания к меньшему ============ -->
  <text x="74" y="224" font-size="19" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">struct CompactEvent</text>
  <text x="986" y="224" font-size="19" text-anchor="end" fill="#ffffff">16 байт, те же 13 полезных</text>

  <text x="549" y="254" font-size="15" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">kind</text>
  <line x1="549" y1="260" x2="549" y2="268" stroke="#80828c" stroke-width="1.5"/>

  <rect x="74" y="270" width="304" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="226" y="300" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">timestamp</text>
  <text x="226" y="320" font-size="14" text-anchor="middle" fill="#80828c">0–7</text>

  <rect x="378" y="270" width="152" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="454" y="300" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">pid</text>
  <text x="454" y="320" font-size="14" text-anchor="middle" fill="#80828c">8–11</text>

  <rect x="530" y="270" width="38" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="549" y="320" font-size="14" text-anchor="middle" fill="#80828c">12</text>

  <rect x="568" y="270" width="114" height="64" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="625" y="300" font-size="15" text-anchor="middle" fill="#5c5e66">padding</text>
  <text x="625" y="320" font-size="14" text-anchor="middle" fill="#5c5e66">13–15</text>

  <rect x="682" y="270" width="304" height="64" fill="none" stroke="#26262b"
        stroke-width="1.5" stroke-dasharray="3 6"/>
  <text x="834" y="308" font-size="16" text-anchor="middle" fill="#5c5e66">восемь байт, которых больше нет</text>
</svg>
