<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 466" width="1060" height="466"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">

  <rect x="1" y="1" width="1058" height="464" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- ============ легенда: размеры и выравнивание типов ============ -->
  <g font-size="17" fill="#dbdfe6">
    <text x="74" y="44"><tspan font-family="Consolas, Roboto Mono, monospace" fill="#ffffff">char</tspan> — 1 байт</text>
    <text x="244" y="44"><tspan font-family="Consolas, Roboto Mono, monospace" fill="#ffffff">int</tspan> — 4 байта</text>
    <text x="424" y="44"><tspan font-family="Consolas, Roboto Mono, monospace" fill="#ffffff">double</tspan> — 8 байт</text>
  </g>
  <text x="986" y="44" font-size="16" text-anchor="end" fill="#80828c">alignof у каждого равен sizeof</text>
  <line x1="40" y1="62" x2="1020" y2="62" stroke="#26262b" stroke-width="1.5"/>

  <!-- ============ Event: char первым ============ -->
  <text x="74" y="96" font-size="19" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">struct Event</text>
  <text x="986" y="96" font-size="19" text-anchor="end" fill="#ffffff">24 байта, полезных 13</text>

  <text x="93" y="122" font-size="15" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">char kind</text>
  <line x1="93" y1="128" x2="93" y2="136" stroke="#80828c" stroke-width="1.5"/>

  <rect x="74" y="138" width="38" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="93" y="188" font-size="14" text-anchor="middle" fill="#80828c">0</text>

  <rect x="112" y="138" width="266" height="64" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="245" y="168" font-size="16" text-anchor="middle" fill="#5c5e66">padding</text>
  <text x="245" y="188" font-size="14" text-anchor="middle" fill="#5c5e66">1–7</text>

  <rect x="378" y="138" width="304" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="530" y="168" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">double timestamp</text>
  <text x="530" y="188" font-size="14" text-anchor="middle" fill="#80828c">8–15</text>

  <rect x="682" y="138" width="152" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="758" y="168" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">int pid</text>
  <text x="758" y="188" font-size="14" text-anchor="middle" fill="#80828c">16–19</text>

  <rect x="834" y="138" width="152" height="64" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="910" y="168" font-size="16" text-anchor="middle" fill="#5c5e66">padding</text>
  <text x="910" y="188" font-size="14" text-anchor="middle" fill="#5c5e66">20–23</text>

  <!-- ось: деления через alignof -->
  <line x1="74" y1="216" x2="986" y2="216" stroke="#80828c" stroke-width="1.5"/>
  <g stroke="#dbdfe6" stroke-width="2">
    <line x1="74" y1="209" x2="74" y2="223"/>
    <line x1="378" y1="209" x2="378" y2="223"/>
    <line x1="682" y1="209" x2="682" y2="223"/>
    <line x1="986" y1="209" x2="986" y2="223"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#dbdfe6" font-family="Consolas, Roboto Mono, monospace">
    <text x="74" y="242">0</text>
    <text x="378" y="242">8</text>
    <text x="682" y="242">16</text>
    <text x="986" y="242">24</text>
  </g>
  <text x="530" y="242" font-size="15" text-anchor="middle" fill="#80828c" font-family="Consolas, Roboto Mono, monospace">шаг alignof(Event) = 8</text>
  <line x1="40" y1="262" x2="1020" y2="262" stroke="#26262b" stroke-width="1.5"/>

  <!-- ============ CompactEvent: от большего выравнивания к меньшему ============ -->
  <text x="74" y="296" font-size="19" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">struct CompactEvent</text>
  <text x="986" y="296" font-size="19" text-anchor="end" fill="#ffffff">16 байт, те же 13 полезных</text>

  <text x="549" y="324" font-size="15" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">char kind</text>
  <line x1="549" y1="330" x2="549" y2="338" stroke="#80828c" stroke-width="1.5"/>

  <rect x="74" y="340" width="304" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="226" y="370" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">double timestamp</text>
  <text x="226" y="390" font-size="14" text-anchor="middle" fill="#80828c">0–7</text>

  <rect x="378" y="340" width="152" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="454" y="370" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">int pid</text>
  <text x="454" y="390" font-size="14" text-anchor="middle" fill="#80828c">8–11</text>

  <rect x="530" y="340" width="38" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="549" y="390" font-size="14" text-anchor="middle" fill="#80828c">12</text>

  <rect x="568" y="340" width="114" height="64" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="625" y="370" font-size="15" text-anchor="middle" fill="#5c5e66">padding</text>
  <text x="625" y="390" font-size="14" text-anchor="middle" fill="#5c5e66">13–15</text>

  <rect x="682" y="340" width="304" height="64" fill="none" stroke="#26262b"
        stroke-width="1.5" stroke-dasharray="3 6"/>
  <text x="834" y="378" font-size="16" text-anchor="middle" fill="#5c5e66">восемь байт, которых больше нет</text>
  <!-- ось: деления через alignof -->
  <line x1="74" y1="418" x2="682" y2="418" stroke="#80828c" stroke-width="1.5"/>
  <g stroke="#dbdfe6" stroke-width="2">
    <line x1="74" y1="411" x2="74" y2="425"/>
    <line x1="378" y1="411" x2="378" y2="425"/>
    <line x1="682" y1="411" x2="682" y2="425"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#dbdfe6" font-family="Consolas, Roboto Mono, monospace">
    <text x="74" y="444">0</text>
    <text x="378" y="444">8</text>
    <text x="682" y="444">16</text>
  </g>
  <text x="834" y="444" font-size="15" text-anchor="middle" fill="#80828c" font-family="Consolas, Roboto Mono, monospace">шаг alignof(CompactEvent) = 8</text>
</svg>
