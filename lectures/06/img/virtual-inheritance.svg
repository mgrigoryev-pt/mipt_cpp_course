<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 352" width="1060" height="352"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="light" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
    <marker id="pinkhead" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="350" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="470" y1="36" x2="470" y2="316" stroke="#26262b" stroke-width="1.5"/>

  <!-- ================= слева: иерархия с virtual ================= -->
  <text x="250" y="50" font-size="17" text-anchor="middle" fill="#80828c">иерархия классов</text>

  <rect x="175" y="70" width="160" height="52" rx="10" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="255" y="92" font-size="18" text-anchor="middle" fill="#ffffff">Animal</text>
  <text x="255" y="110" font-size="14" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">int id</text>

  <rect x="60" y="168" width="160" height="52" rx="10" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="140" y="200" font-size="18" text-anchor="middle" fill="#ffffff">Walker</text>

  <rect x="290" y="168" width="160" height="52" rx="10" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="370" y="200" font-size="18" text-anchor="middle" fill="#ffffff">Swimmer</text>

  <rect x="175" y="266" width="160" height="52" rx="10" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="255" y="298" font-size="18" text-anchor="middle" fill="#ffffff">Duck</text>

  <g stroke="#ff8a8a" stroke-width="2">
    <line x1="150" y1="166" x2="212" y2="126" marker-end="url(#pinkhead)"/>
    <line x1="360" y1="166" x2="298" y2="126" marker-end="url(#pinkhead)"/>
  </g>
  <text x="153" y="136" font-size="14" text-anchor="end" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">virtual</text>
  <text x="357" y="136" font-size="14" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">virtual</text>

  <g stroke="#dbdfe6" stroke-width="2">
    <line x1="215" y1="264" x2="168" y2="224" marker-end="url(#light)"/>
    <line x1="295" y1="264" x2="342" y2="224" marker-end="url(#light)"/>
  </g>

  <!-- ================= справа: объект ================= -->
  <text x="715" y="50" font-size="17" text-anchor="middle" fill="#80828c">объект Duck в памяти</text>

  <rect x="560" y="70" width="310" height="232" fill="none" stroke="#dbdfe6" stroke-width="2"/>

  <rect x="576" y="84" width="278" height="62" fill="rgba(255,255,255,0.04)" stroke="#26262b" stroke-width="1.5"/>
  <text x="715" y="121" font-size="16" text-anchor="middle" fill="#dbdfe6">часть Walker</text>

  <rect x="576" y="158" width="278" height="62" fill="rgba(255,255,255,0.04)" stroke="#26262b" stroke-width="1.5"/>
  <text x="715" y="195" font-size="16" text-anchor="middle" fill="#dbdfe6">часть Swimmer</text>

  <rect x="576" y="236" width="278" height="56" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2.5"/>
  <text x="715" y="264" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">Animal::id</text>
  <text x="715" y="283" font-size="13" text-anchor="middle" fill="#80828c">одна на весь объект</text>

  <!-- обе ветви ведут к одной базе -->
  <path d="M 858 115 L 928 115 M 858 189 L 928 189 M 928 115 L 928 264 L 868 264"
        fill="none" stroke="#ff8a8a" stroke-width="2" marker-end="url(#pinkhead)"/>
  <text x="944" y="158" font-size="14" fill="#ff8a8a">обе ветви —</text>
  <text x="944" y="178" font-size="14" fill="#ff8a8a">к одной базе,</text>
  <text x="944" y="198" font-size="14" fill="#ff8a8a">через смещение</text>

  <text x="530" y="338" font-size="15" text-anchor="middle" fill="#80828c">одна копия Animal — ценой косвенного обращения из обеих ветвей</text>
</svg>
