<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 356" width="1060" height="356"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">

  <rect x="1" y="1" width="1058" height="354" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- ============ пустой класс полем ============ -->
  <text x="50" y="52" font-size="17" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">struct Holder { Empty tag; int value; };</text>
  <text x="1010" y="52" font-size="18" text-anchor="end" fill="#ffffff">8 байт</text>

  <rect x="50" y="72" width="120" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="110" y="104" font-size="18" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">tag</text>
  <text x="110" y="126" font-size="13" text-anchor="middle" fill="#80828c">1 байт</text>

  <rect x="170" y="72" width="360" height="64" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="350" y="104" font-size="16" text-anchor="middle" fill="#5c5e66">padding</text>
  <text x="350" y="126" font-size="13" text-anchor="middle" fill="#5c5e66">3 байта до кратного 4</text>

  <rect x="530" y="72" width="480" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="770" y="104" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">value</text>
  <text x="770" y="126" font-size="13" text-anchor="middle" fill="#80828c">int</text>

  <g font-size="15" text-anchor="middle" fill="#80828c">
    <text x="110" y="158">0</text>
    <text x="350" y="158">1–3</text>
    <text x="770" y="158">4–7</text>
  </g>

  <line x1="40" y1="186" x2="1020" y2="186" stroke="#26262b" stroke-width="1.5"/>

  <!-- ============ тот же пустой класс базой ============ -->
  <text x="50" y="216" font-size="17" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">struct Tagged : Empty { int value; };</text>
  <text x="1010" y="216" font-size="18" text-anchor="end" fill="#ffffff">4 байта</text>

  <path d="M 44 246 L 56 246 L 50 254 z" fill="#80828c"/>
  <text x="66" y="244" font-size="14" fill="#80828c">Empty здесь занимает ноль байт: пустая база, а не поле</text>

  <rect x="50" y="254" width="480" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="290" y="286" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">value</text>
  <text x="290" y="308" font-size="13" text-anchor="middle" fill="#80828c">int</text>

  <rect x="530" y="254" width="480" height="64" fill="none" stroke="#26262b"
        stroke-width="1.5" stroke-dasharray="3 6"/>
  <text x="770" y="292" font-size="16" text-anchor="middle" fill="#5c5e66">четырёх байт больше нет</text>

  <text x="290" y="340" font-size="15" text-anchor="middle" fill="#80828c">0–3</text>
</svg>
