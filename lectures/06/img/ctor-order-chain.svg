<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 340" width="1060" height="340"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="grey" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="338" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- база лежит внутри наследника — отсюда и порядок -->
  <rect x="280" y="48" width="500" height="148" fill="rgba(255,255,255,0.03)" stroke="#dbdfe6" stroke-width="2"/>
  <rect x="330" y="86" width="400" height="62" fill="rgba(255,255,255,0.06)" stroke="#dbdfe6" stroke-width="2"/>

  <text x="545" y="75" font-size="14" text-anchor="middle" fill="#80828c">память на весь объект — sizeof(B) байт</text>

  <rect x="470" y="96" width="140" height="42" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="1.5"/>
  <text x="540" y="123" font-size="15" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">поля A</text>

  <rect x="470" y="158" width="140" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="1.5"/>
  <text x="540" y="178" font-size="14" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">поля B</text>

  <g stroke="#dbdfe6" stroke-width="2" fill="rgba(255,255,255,0.08)">
    <circle cx="308" cy="70" r="15"/>
    <circle cx="358" cy="117" r="15"/>
  </g>
  <g font-size="17" text-anchor="middle" fill="#ffffff">
    <text x="308" y="76">2</text>
    <text x="358" y="123">1</text>
  </g>
  <g font-size="19" fill="#dbdfe6" font-family="Consolas, Roboto Mono, monospace">
    <text x="334" y="77">B</text>
    <text x="384" y="124">A</text>
  </g>

  <g stroke="#80828c" stroke-width="2" fill="none">
    <circle cx="752" cy="70" r="15"/>
    <circle cx="702" cy="117" r="15"/>
  </g>
  <g font-size="17" text-anchor="middle" fill="#80828c">
    <text x="752" y="76">1</text>
    <text x="702" y="123">2</text>
  </g>

  <text x="60" y="76" font-size="15" fill="#dbdfe6">номер</text>
  <text x="60" y="98" font-size="15" fill="#dbdfe6">конструктора</text>
  <text x="1000" y="76" font-size="15" text-anchor="end" fill="#80828c">номер</text>
  <text x="1000" y="98" font-size="15" text-anchor="end" fill="#80828c">деструктора</text>

  <!-- лента: память, вызовы, память -->
  <line x1="40" y1="228" x2="1020" y2="228" stroke="#26262b" stroke-width="1.5"/>

  <g fill="none" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="6 5">
    <rect x="40" y="250" width="150" height="40"/>
    <rect x="870" y="250" width="150" height="40"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#80828c">
    <text x="115" y="275">память под B</text>
    <text x="945" y="275">память отдана</text>
  </g>

  <g font-size="20" text-anchor="middle" fill="#ffffff" font-family="Consolas, Roboto Mono, monospace">
    <text x="270" y="277">A()</text>
    <text x="380" y="277">B()</text>
    <text x="670" y="277">~B()</text>
    <text x="790" y="277">~A()</text>
  </g>
  <g stroke="#80828c" stroke-width="2">
    <line x1="196" y1="270" x2="238" y2="270" marker-end="url(#grey)"/>
    <line x1="302" y1="270" x2="346" y2="270" marker-end="url(#grey)"/>
    <line x1="414" y1="270" x2="618" y2="270" marker-end="url(#grey)"/>
    <line x1="706" y1="270" x2="748" y2="270" marker-end="url(#grey)"/>
    <line x1="828" y1="270" x2="864" y2="270" marker-end="url(#grey)"/>
  </g>
  <text x="516" y="258" font-size="14" text-anchor="middle" fill="#80828c">объект живёт</text>

  <text x="215" y="318" font-size="14" text-anchor="middle" fill="#80828c">сначала память, затем база первой</text>
  <text x="845" y="318" font-size="14" text-anchor="middle" fill="#80828c">база последней, затем память</text>
</svg>
