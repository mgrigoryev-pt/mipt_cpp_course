<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 348" width="1060" height="348"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
    <marker id="pink-back" markerWidth="11" markerHeight="11" refX="1" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M11,0 L0,4.5 L11,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="346" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <text x="530" y="50" font-size="18" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">class C : public A, public B { int c; };</text>

  <text x="210" y="104" font-size="16" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">A* pa = &amp;c;</text>
  <text x="430" y="104" font-size="16" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">B* pb = &amp;c;</text>

  <line x1="210" y1="116" x2="210" y2="156" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <line x1="430" y1="116" x2="430" y2="156" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

  <rect x="200" y="160" width="220" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="310" y="192" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">A::a</text>
  <text x="310" y="214" font-size="14" text-anchor="middle" fill="#80828c">база A</text>

  <rect x="420" y="160" width="220" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="530" y="192" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">B::b</text>
  <text x="530" y="214" font-size="14" text-anchor="middle" fill="#80828c">база B</text>

  <rect x="640" y="160" width="220" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="750" y="192" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">C::c</text>
  <text x="750" y="214" font-size="14" text-anchor="middle" fill="#80828c">поле C</text>

  <g font-size="15" text-anchor="middle" fill="#80828c">
    <text x="310" y="248">0–3</text>
    <text x="530" y="248">4–7</text>
    <text x="750" y="248">8–11</text>
  </g>

  <g stroke="#3a3a40" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="200" y1="228" x2="200" y2="296"/>
    <line x1="420" y1="228" x2="420" y2="296"/>
  </g>

  <line x1="200" y1="290" x2="420" y2="290" stroke="#ff8a8a" stroke-width="2"
        marker-start="url(#pink-back)" marker-end="url(#pink)"/>
  <text x="310" y="282" font-size="15" text-anchor="middle" fill="#ff8a8a">+ 4 байта</text>

  <text x="530" y="330" font-size="15" text-anchor="middle" fill="#80828c">объект один, но pa и pb — разные значения: вторая база лежит не в начале</text>
</svg>
