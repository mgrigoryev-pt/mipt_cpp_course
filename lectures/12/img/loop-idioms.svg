<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 350" width="1060" height="350"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
    <marker id="grey" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
    <g id="lock">
      <rect x="-11" y="-2" width="22" height="17" rx="3" fill="#ff2020"/>
      <path d="M -6 -2 v -5 a 6 6 0 0 1 12 0 v 5" fill="none" stroke="#ff2020" stroke-width="2.5"/>
    </g>
  </defs>

  <rect x="1" y="1" width="1058" height="348" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <text x="60" y="46" font-size="15" fill="#80828c">форма цикла</text>
  <text x="510" y="46" font-size="15" text-anchor="middle" fill="#80828c">item</text>
  <text x="785" y="46" font-size="15" text-anchor="middle" fill="#80828c">контейнер <tspan font-family="Consolas, Roboto Mono, monospace" fill="#dbdfe6">c</tspan></text>

  <!-- строка 1: const auto& -->
  <text x="60" y="108" font-size="18" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">for (const auto&amp; item : c)</text>
  <text x="60" y="132" font-size="15" fill="#80828c">читаем чужой элемент, копии нет</text>

  <rect x="430" y="78" width="160" height="48" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="2"/>
  <text x="505" y="110" font-size="20" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">item</text>
  <use href="#lock" x="570" y="78"/>
  <line x1="598" y1="102" x2="648" y2="102" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

  <rect x="656" y="78" width="78" height="48" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="695" y="108" font-size="14" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">"alpha"</text>
  <rect x="746" y="78" width="78" height="48" fill="none" stroke="#3a3a40" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="785" y="108" font-size="14" text-anchor="middle" fill="#5c5e66"
        font-family="Consolas, Roboto Mono, monospace">"beta"</text>
  <rect x="836" y="78" width="78" height="48" fill="none" stroke="#3a3a40" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="875" y="108" font-size="14" text-anchor="middle" fill="#5c5e66"
        font-family="Consolas, Roboto Mono, monospace">"gamma"</text>

  <!-- строка 2: auto& -->
  <text x="60" y="206" font-size="18" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">for (auto&amp; item : c)</text>
  <text x="60" y="230" font-size="15" fill="#80828c">меняем элемент прямо в контейнере</text>

  <rect x="430" y="176" width="160" height="48" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="2"/>
  <text x="505" y="208" font-size="20" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">item</text>
  <line x1="598" y1="200" x2="648" y2="200" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

  <rect x="656" y="176" width="78" height="48" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="695" y="206" font-size="14" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">"alpha"</text>
  <rect x="746" y="176" width="78" height="48" fill="none" stroke="#3a3a40" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="785" y="206" font-size="14" text-anchor="middle" fill="#5c5e66"
        font-family="Consolas, Roboto Mono, monospace">"beta"</text>
  <rect x="836" y="176" width="78" height="48" fill="none" stroke="#3a3a40" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="875" y="206" font-size="14" text-anchor="middle" fill="#5c5e66"
        font-family="Consolas, Roboto Mono, monospace">"gamma"</text>

  <!-- строка 3: auto по значению -->
  <text x="60" y="304" font-size="18" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">for (auto item : c)</text>
  <text x="60" y="328" font-size="15" fill="#80828c">на каждой итерации копируется строка</text>

  <rect x="430" y="274" width="160" height="48" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="505" y="305" font-size="18" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">"alpha"</text>
  <line x1="648" y1="298" x2="598" y2="298" stroke="#80828c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#grey)"/>
  <text x="623" y="284" font-size="14" text-anchor="middle" fill="#80828c">копия</text>

  <rect x="656" y="274" width="78" height="48" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="695" y="304" font-size="14" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">"alpha"</text>
  <rect x="746" y="274" width="78" height="48" fill="none" stroke="#3a3a40" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="785" y="304" font-size="14" text-anchor="middle" fill="#5c5e66"
        font-family="Consolas, Roboto Mono, monospace">"beta"</text>
  <rect x="836" y="274" width="78" height="48" fill="none" stroke="#3a3a40" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="875" y="304" font-size="14" text-anchor="middle" fill="#5c5e66"
        font-family="Consolas, Roboto Mono, monospace">"gamma"</text>
</svg>
