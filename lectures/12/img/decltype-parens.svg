<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" width="1060" height="300"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="grey" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="298" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <line x1="530" y1="36" x2="530" y2="270" stroke="#26262b" stroke-width="1.5"/>

  <!-- слева: имя -->
  <rect x="160" y="46" width="250" height="52" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="285" y="81" font-size="22" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">decltype(x)</text>

  <line x1="285" y1="104" x2="285" y2="134" stroke="#80828c" stroke-width="2" marker-end="url(#grey)"/>

  <text x="285" y="162" font-size="17" text-anchor="middle" fill="#dbdfe6">внутри — имя переменной</text>
  <text x="285" y="188" font-size="15" text-anchor="middle" fill="#80828c">берётся объявленный тип</text>

  <rect x="205" y="204" width="160" height="56" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="285" y="242" font-size="24" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">int</text>

  <!-- справа: выражение -->
  <rect x="650" y="46" width="250" height="52" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="775" y="81" font-size="22" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">decltype((x))</text>

  <line x1="775" y1="104" x2="775" y2="134" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

  <text x="775" y="162" font-size="17" text-anchor="middle" fill="#dbdfe6">внутри — выражение в скобках</text>
  <text x="775" y="188" font-size="15" text-anchor="middle" fill="#80828c">учитывается категория значения: lvalue</text>

  <rect x="695" y="204" width="160" height="56" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="2"/>
  <text x="775" y="242" font-size="24" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">int&amp;</text>
</svg>
