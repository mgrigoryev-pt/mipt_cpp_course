<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" width="1060" height="330"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="grey" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
    <marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff2020"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="328" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <text x="125" y="48" font-size="15" text-anchor="middle" fill="#80828c">что вернула <tspan font-family="Consolas, Roboto Mono, monospace" fill="#dbdfe6">f</tspan></text>
  <text x="425" y="48" font-size="15" text-anchor="middle" fill="#80828c">обёртка</text>
  <text x="875" y="48" font-size="15" text-anchor="middle" fill="#80828c">что получил вызывающий</text>

  <!-- строка 1: обычный auto -->
  <rect x="40" y="78" width="170" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="125" y="118" font-size="22" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">int&amp;</text>

  <line x1="218" y1="110" x2="282" y2="110" stroke="#80828c" stroke-width="2" marker-end="url(#grey)"/>

  <rect x="290" y="78" width="270" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="425" y="117" font-size="18" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">auto call(...)</text>

  <text x="660" y="96" font-size="15" text-anchor="middle" fill="#ff2020">ссылка съедена</text>
  <line x1="568" y1="114" x2="752" y2="114" stroke="#ff2020" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#red)"/>

  <rect x="760" y="78" width="230" height="64" fill="none" stroke="#ff2020" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="875" y="118" font-size="22" text-anchor="middle" fill="#ff2020"
        font-family="Consolas, Roboto Mono, monospace">int</text>
  <text x="875" y="170" font-size="15" text-anchor="middle" fill="#80828c">правка вызывающего никуда не уйдёт</text>

  <line x1="40" y1="196" x2="1020" y2="196" stroke="#26262b" stroke-width="1.5"/>

  <!-- строка 2: decltype(auto) -->
  <rect x="40" y="222" width="170" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="125" y="262" font-size="22" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">int&amp;</text>

  <line x1="218" y1="254" x2="282" y2="254" stroke="#80828c" stroke-width="2" marker-end="url(#grey)"/>

  <rect x="290" y="222" width="270" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="425" y="261" font-size="18" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">decltype(auto) call(...)</text>

  <text x="660" y="240" font-size="15" text-anchor="middle" fill="#ff8a8a">ссылка доехала</text>
  <line x1="568" y1="258" x2="752" y2="258" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

  <rect x="760" y="222" width="230" height="64" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="2"/>
  <text x="875" y="262" font-size="22" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">int&amp;</text>
  <text x="875" y="314" font-size="15" text-anchor="middle" fill="#80828c">обёртки снаружи не видно</text>
</svg>
