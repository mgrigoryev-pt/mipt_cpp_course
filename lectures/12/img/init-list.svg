<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" width="1060" height="330"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
    <marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff2020"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="328" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <line x1="530" y1="36" x2="530" y2="296" stroke="#26262b" stroke-width="1.5"/>

  <!-- левая панель: как устроен список -->
  <text x="280" y="54" font-size="18" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">auto w = {1, 2, 3};</text>

  <rect x="70" y="86" width="190" height="84" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <line x1="70" y1="128" x2="260" y2="128" stroke="#5c5e66" stroke-width="1"/>
  <text x="165" y="114" font-size="18" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">ptr</text>
  <text x="165" y="157" font-size="16" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">size = 3</text>
  <text x="165" y="194" font-size="14" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">initializer_list&lt;int&gt; w</text>

  <line x1="266" y1="107" x2="312" y2="107" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

  <rect x="320" y="79" width="54" height="56" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="347" y="117" font-size="22" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">1</text>
  <rect x="382" y="79" width="54" height="56" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="409" y="117" font-size="22" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">2</text>
  <rect x="444" y="79" width="54" height="56" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="471" y="117" font-size="22" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">3</text>
  <text x="409" y="194" font-size="14" text-anchor="middle" fill="#80828c">массив компилятора</text>

  <text x="280" y="248" font-size="15" text-anchor="middle" fill="#80828c">список хранит только указатель и размер —</text>
  <text x="280" y="272" font-size="15" text-anchor="middle" fill="#80828c">элементы лежат в отдельном массиве рядом</text>

  <!-- правая панель: массив пережить список не обязан -->
  <text x="780" y="54" font-size="18" text-anchor="middle" fill="#ff2020"
        font-family="Consolas, Roboto Mono, monospace">return {1, 2, 3};</text>

  <rect x="580" y="86" width="190" height="84" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <line x1="580" y1="128" x2="770" y2="128" stroke="#5c5e66" stroke-width="1"/>
  <text x="675" y="114" font-size="18" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">ptr</text>
  <text x="675" y="157" font-size="16" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">size = 3</text>
  <text x="675" y="194" font-size="14" text-anchor="middle" fill="#80828c">список уехал вызывающему</text>

  <line x1="776" y1="107" x2="822" y2="107" stroke="#ff2020" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#red)"/>

  <rect x="830" y="79" width="180" height="56" fill="none" stroke="#5c5e66" stroke-width="1.5" stroke-dasharray="7 6"/>
  <line x1="838" y1="129" x2="1002" y2="85" stroke="#ff2020" stroke-width="2"/>
  <line x1="838" y1="85" x2="1002" y2="129" stroke="#ff2020" stroke-width="2"/>
  <text x="920" y="194" font-size="15" text-anchor="middle" fill="#ff2020">массив уничтожен</text>

  <text x="780" y="248" font-size="16" text-anchor="middle" fill="#ff2020">чтение через такой список — UB</text>
  <text x="780" y="272" font-size="15" text-anchor="middle" fill="#80828c">вернуть из функции или сохранить в поле нельзя</text>
</svg>
