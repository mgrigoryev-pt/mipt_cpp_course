<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 400" width="1060" height="400"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="light" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="398" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="40" x2="530" y2="368" stroke="#26262b" stroke-width="1.5"/>

  <!-- обычная функция -->
  <text x="280" y="58" font-size="19" text-anchor="middle" fill="#dbdfe6">обычная функция</text>

  <rect x="150" y="76" width="260" height="88" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="168" y="102" font-size="14" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">f.h</text>
  <text x="168" y="130" font-size="16" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">void f(int);</text>
  <text x="168" y="152" font-size="14" fill="#80828c">только объявление</text>

  <path d="M 200 164 C 180 180, 180 186, 180 202" fill="none" stroke="#dbdfe6" stroke-width="2" marker-end="url(#light)"/>
  <path d="M 360 164 C 380 180, 380 186, 380 202" fill="none" stroke="#dbdfe6" stroke-width="2" marker-end="url(#light)"/>

  <rect x="96" y="206" width="168" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="180" y="232" font-size="15" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">a.cpp</text>
  <text x="180" y="254" font-size="14" text-anchor="middle" fill="#80828c">тела не видит</text>

  <rect x="296" y="206" width="168" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="380" y="232" font-size="15" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">b.cpp</text>
  <text x="380" y="254" font-size="14" text-anchor="middle" fill="#80828c">тела не видит</text>

  <path d="M 180 270 C 180 292, 200 296, 220 306" fill="none" stroke="#dbdfe6" stroke-width="2" marker-end="url(#light)"/>
  <path d="M 380 270 C 380 292, 360 296, 340 306" fill="none" stroke="#dbdfe6" stroke-width="2" marker-end="url(#light)"/>

  <rect x="150" y="310" width="260" height="58" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="280" y="334" font-size="15" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">f.cpp: void f(int) { … }</text>
  <text x="280" y="356" font-size="14" text-anchor="middle" fill="#80828c">одно тело, его находит линковщик</text>

  <!-- шаблон -->
  <text x="780" y="58" font-size="19" text-anchor="middle" fill="#dbdfe6">шаблон</text>

  <rect x="650" y="76" width="260" height="88" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="668" y="102" font-size="14" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">f.h</text>
  <text x="668" y="128" font-size="15" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">template &lt;typename T&gt;</text>
  <text x="668" y="150" font-size="15" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">void f(T x) { … }</text>

  <path d="M 700 164 C 680 180, 680 186, 680 202" fill="none" stroke="#ff8a8a" stroke-width="2" marker-end="url(#pink)"/>
  <path d="M 860 164 C 880 180, 880 186, 880 202" fill="none" stroke="#ff8a8a" stroke-width="2" marker-end="url(#pink)"/>

  <rect x="596" y="206" width="168" height="64" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="2"/>
  <text x="680" y="232" font-size="15" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">a.cpp</text>
  <text x="680" y="254" font-size="14" text-anchor="middle" fill="#ff8a8a">своя копия тела</text>

  <rect x="796" y="206" width="168" height="64" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="2"/>
  <text x="880" y="232" font-size="15" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">b.cpp</text>
  <text x="880" y="254" font-size="14" text-anchor="middle" fill="#ff8a8a">своя копия тела</text>

  <rect x="650" y="310" width="260" height="58" fill="none" stroke="#3a3a40" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="780" y="334" font-size="15" text-anchor="middle" fill="#5c5e66">отдельного .cpp нет</text>
  <text x="780" y="356" font-size="14" text-anchor="middle" fill="#80828c">инстанцирует каждая сама</text>
</svg>
