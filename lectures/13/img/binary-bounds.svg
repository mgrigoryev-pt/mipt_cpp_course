<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 280" width="1060" height="280"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="10" markerHeight="10" refX="9" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="278" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <text x="40" y="46" font-size="17" fill="#80828c">отсортированный диапазон, ищем значение
    <tspan font-family="Consolas, Roboto Mono, monospace" fill="#ffffff">5</tspan></text>

  <text x="430" y="86" font-size="17" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">lower_bound(5)</text>
  <line x1="430" y1="96" x2="430" y2="124" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="730" y="86" font-size="17" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">upper_bound(5)</text>
  <line x1="730" y1="96" x2="730" y2="124" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

  <rect x="180" y="128" width="100" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="230" y="170" font-size="26" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">1</text>
  <rect x="280" y="128" width="100" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="330" y="170" font-size="26" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">3</text>
  <rect x="380" y="128" width="100" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="430" y="170" font-size="26" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">5</text>
  <rect x="480" y="128" width="100" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="530" y="170" font-size="26" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">5</text>
  <rect x="580" y="128" width="100" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="630" y="170" font-size="26" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">5</text>
  <rect x="680" y="128" width="100" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="730" y="170" font-size="26" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">7</text>
  <rect x="780" y="128" width="100" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="830" y="170" font-size="26" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">9</text>

  <path d="M 380 200 L 380 212 L 680 212 L 680 200" fill="none" stroke="#dbdfe6" stroke-width="2"/>
  <text x="530" y="238" font-size="16" text-anchor="middle" fill="#dbdfe6">
    <tspan font-family="Consolas, Roboto Mono, monospace">equal_range(5)</tspan> — сразу обе границы</text>

  <text x="530" y="266" font-size="16" text-anchor="middle" fill="#80828c">O(log n) вместо O(n); на неотсортированном —
    <tspan fill="#ff2020">UB, причём молча</tspan></text>
</svg>
