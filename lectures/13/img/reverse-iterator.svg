<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 360" width="1060" height="360"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="10" markerHeight="10" refX="9" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#ff8a8a"/>
    </marker>
    <marker id="grey" markerWidth="10" markerHeight="10" refX="9" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#dbdfe6"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="358" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- направление прямого обхода -->
  <text x="585" y="38" font-size="18" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">++it</text>
  <line x1="320" y1="52" x2="850" y2="52" stroke="#dbdfe6" stroke-width="2" marker-end="url(#grey)"/>

  <!-- begin / end -->
  <text x="365" y="94" font-size="18" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">begin()</text>
  <line x1="365" y1="104" x2="365" y2="136" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="805" y="94" font-size="18" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">end()</text>
  <line x1="805" y1="104" x2="805" y2="136" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

  <!-- лента -->
  <rect x="200" y="140" width="110" height="70" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="255" y="181" font-size="14" text-anchor="middle" fill="#5c5e66">до первого</text>

  <rect x="310" y="140" width="110" height="70" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="365" y="187" font-size="26" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">10</text>
  <rect x="420" y="140" width="110" height="70" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="475" y="187" font-size="26" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">20</text>
  <rect x="530" y="140" width="110" height="70" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="585" y="187" font-size="26" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">30</text>
  <rect x="640" y="140" width="110" height="70" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="695" y="187" font-size="26" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">40</text>

  <rect x="750" y="140" width="110" height="70" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="805" y="181" font-size="14" text-anchor="middle" fill="#5c5e66">за последним</text>

  <!-- rbegin / rend -->
  <line x1="695" y1="244" x2="695" y2="214" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="695" y="272" font-size="18" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">rbegin()</text>
  <line x1="255" y1="244" x2="255" y2="214" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="255" y="272" font-size="18" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">rend()</text>

  <!-- направление обратного обхода -->
  <text x="585" y="304" font-size="18" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">++it</text>
  <line x1="850" y1="318" x2="320" y2="318" stroke="#dbdfe6" stroke-width="2" marker-end="url(#grey)"/>

  <text x="530" y="342" font-size="15" text-anchor="middle" fill="#80828c">
    <tspan font-family="Consolas, Roboto Mono, monospace" fill="#dbdfe6">rbegin()</tspan> смотрит на последний элемент, а не за него; конец обратного обхода —
    <tspan font-family="Consolas, Roboto Mono, monospace" fill="#dbdfe6">rend()</tspan>, позиция до первого</text>
</svg>
