<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 320" width="1060" height="320"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="10" markerHeight="10" refX="9" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="318" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <line x1="700" y1="34" x2="700" y2="286" stroke="#26262b" stroke-width="1.5"/>

  <!-- ===== левая панель: непустой контейнер ===== -->
  <text x="40" y="58" font-size="18" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">std::vector&lt;int&gt; v = {1, 2, 3, 4};</text>

  <text x="105" y="106" font-size="18" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">begin()</text>
  <line x1="105" y1="116" x2="105" y2="146" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>

  <text x="465" y="106" font-size="18" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">end()</text>
  <line x1="465" y1="116" x2="465" y2="146" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>

  <rect x="60" y="150" width="90" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="105" y="192" font-size="26" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">1</text>
  <rect x="150" y="150" width="90" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="195" y="192" font-size="26" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">2</text>
  <rect x="240" y="150" width="90" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="285" y="192" font-size="26" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">3</text>
  <rect x="330" y="150" width="90" height="64" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="375" y="192" font-size="26" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">4</text>

  <rect x="420" y="150" width="90" height="64" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="432" y1="204" x2="498" y2="160" stroke="#ff2020" stroke-width="2"/>
  <line x1="432" y1="160" x2="498" y2="204" stroke="#ff2020" stroke-width="2"/>

  <path d="M 60 226 L 60 238 L 420 238 L 420 226" fill="none" stroke="#dbdfe6" stroke-width="2"/>
  <text x="240" y="266" font-size="19" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">[begin, end)</text>
  <text x="240" y="292" font-size="16" text-anchor="middle" fill="#80828c">длина == end - begin == 4</text>

  <text x="521" y="262" font-size="16" fill="#ff2020">элемента нет,</text>
  <text x="521" y="284" font-size="16" fill="#ff2020">
    <tspan font-family="Consolas, Roboto Mono, monospace">*end()</tspan> — UB</text>

  <!-- ===== правая панель: пустой контейнер ===== -->
  <text x="870" y="58" font-size="18" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">std::vector&lt;int&gt; v;</text>

  <text x="790" y="106" font-size="18" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">begin()</text>
  <text x="950" y="106" font-size="18" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">end()</text>
  <path d="M 790 116 C 790 138, 838 128, 862 144" fill="none" stroke="#ff8a8a"
        stroke-width="2.5" marker-end="url(#pink)"/>
  <path d="M 950 116 C 950 138, 902 128, 878 144" fill="none" stroke="#ff8a8a"
        stroke-width="2.5" marker-end="url(#pink)"/>

  <rect x="825" y="150" width="90" height="64" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>

  <text x="870" y="266" font-size="19" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">begin() == end()</text>
  <text x="870" y="292" font-size="16" text-anchor="middle" fill="#80828c">так выражается «контейнер пуст»</text>
</svg>
