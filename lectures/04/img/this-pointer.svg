  <text x="786" y="336" font-size="15" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">x_</text>
  <text x="874" y="336" font-size="15" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">y_</text>
</svg>
