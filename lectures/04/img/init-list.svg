<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" width="1060" height="330"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="grey" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="328" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="36" x2="530" y2="294" stroke="#26262b" stroke-width="1.5"/>

  <!-- слева: присваивание в теле -->
  <text x="275" y="62" font-size="19" text-anchor="middle" fill="#ff2020">присваивание в теле</text>

  <rect x="70" y="92" width="150" height="56" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="145" y="130" font-size="24" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">0</text>
  <text x="145" y="172" font-size="15" text-anchor="middle" fill="#80828c">шаг 1: по умолчанию</text>

  <line x1="232" y1="120" x2="296" y2="120" stroke="#80828c" stroke-width="2" marker-end="url(#grey)"/>

  <rect x="310" y="92" width="150" height="56" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="385" y="130" font-size="24" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">7</text>
  <text x="385" y="172" font-size="15" text-anchor="middle" fill="#80828c">шаг 2: operator=</text>

  <text x="70" y="238" font-size="17" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">int&amp; r_;</text>
  <rect x="180" y="214" width="120" height="44" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="188" y1="250" x2="292" y2="222" stroke="#ff2020" stroke-width="2"/>
  <line x1="188" y1="222" x2="292" y2="250" stroke="#ff2020" stroke-width="2"/>
  <text x="316" y="232" font-size="15" fill="#ff2020">шага 1 не существует</text>
  <text x="316" y="252" font-size="15" fill="#ff2020">CE</text>

  <!-- справа: список инициализации -->
  <text x="795" y="62" font-size="19" text-anchor="middle" fill="#dbdfe6">список инициализации</text>

  <rect x="720" y="92" width="150" height="56" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="795" y="130" font-size="24" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">7</text>
  <text x="795" y="172" font-size="15" text-anchor="middle" fill="#80828c">один шаг: построено значением</text>

  <text x="600" y="232" font-size="15" fill="#80828c">порядок инициализации задаёт объявление полей,</text>
  <text x="600" y="252" font-size="15" fill="#80828c">а не порядок в списке</text>
</svg>
