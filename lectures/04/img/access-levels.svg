<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 350" width="1060" height="350"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="light" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
    <marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff2020"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="348" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- карточка класса -->
  <text x="530" y="46" font-size="17" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">class Counter</text>
  <rect x="330" y="60" width="400" height="240" fill="none" stroke="#dbdfe6" stroke-width="2"/>
  <line x1="330" y1="140" x2="730" y2="140" stroke="#26262b" stroke-width="1.5"/>
  <line x1="330" y1="220" x2="730" y2="220" stroke="#26262b" stroke-width="1.5"/>

  <text x="354" y="92" font-size="17" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">public:</text>
  <text x="374" y="122" font-size="17" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">inc()  get()</text>

  <text x="354" y="172" font-size="17" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">protected:</text>
  <text x="374" y="202" font-size="17" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">tick_()</text>

  <text x="354" y="252" font-size="17" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">private:</text>
  <text x="374" y="282" font-size="17" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">count_</text>

  <!-- изнутри видно всё -->
  <path d="M 638 128 C 672 128, 672 268, 640 268" fill="none" stroke="#dbdfe6" stroke-width="2"
        marker-end="url(#light)"/>
  <text x="624" y="192" font-size="15" text-anchor="end" fill="#80828c">изнутри</text>
  <text x="624" y="212" font-size="15" text-anchor="end" fill="#80828c">видно всё</text>

  <!-- снаружи: разрешено -->
  <text x="60" y="96" font-size="17" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">c.get()</text>
  <line x1="60" y1="116" x2="326" y2="116" stroke="#dbdfe6" stroke-width="2" marker-end="url(#light)"/>
  <text x="60" y="140" font-size="15" fill="#80828c">снаружи — только public</text>

  <!-- снаружи: запрещено -->
  <text x="60" y="252" font-size="17" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">c.count_</text>
  <line x1="60" y1="272" x2="274" y2="272" stroke="#ff2020" stroke-width="2" marker-end="url(#red)"/>
  <line x1="296" y1="260" x2="320" y2="284" stroke="#ff2020" stroke-width="2"/>
  <line x1="296" y1="284" x2="320" y2="260" stroke="#ff2020" stroke-width="2"/>
  <text x="60" y="296" font-size="15" fill="#ff2020">CE: закрыто снаружи</text>

  <!-- наследник -->
  <line x1="1000" y1="184" x2="736" y2="184" stroke="#dbdfe6" stroke-width="2" marker-end="url(#light)"/>
  <text x="1000" y="164" font-size="17" text-anchor="end" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">Derived</text>
  <text x="1000" y="208" font-size="15" text-anchor="end" fill="#80828c">наследник — лекция 6</text>
</svg>
