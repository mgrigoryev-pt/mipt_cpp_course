<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 340" width="1060" height="340"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff2020"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="338" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <text x="40" y="44" font-size="16" fill="#80828c">поля строятся по порядку объявления</text>

  <rect x="60" y="60" width="160" height="62" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="140" y="100" font-size="22" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">a_</text>
  <text x="140" y="144" font-size="15" text-anchor="middle" fill="#dbdfe6">построено</text>

  <rect x="250" y="60" width="160" height="62" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="330" y="100" font-size="22" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">b_</text>
  <text x="330" y="144" font-size="15" text-anchor="middle" fill="#dbdfe6">построено</text>

  <rect x="440" y="60" width="160" height="62" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="520" y="100" font-size="22" text-anchor="middle" fill="#5c5e66"
        font-family="Consolas, Roboto Mono, monospace">c_</text>
  <text x="520" y="144" font-size="15" text-anchor="middle" fill="#ff2020">бросило</text>

  <line x1="614" y1="91" x2="686" y2="91" stroke="#ff2020" stroke-width="2" marker-end="url(#red)"/>
  <text x="700" y="98" font-size="18" fill="#ff2020"
        font-family="Consolas, Roboto Mono, monospace">throw</text>

  <line x1="40" y1="176" x2="1020" y2="176" stroke="#26262b" stroke-width="1.5"/>

  <text x="40" y="208" font-size="16" fill="#80828c">разрушается только построенное, в обратном порядке</text>

  <rect x="60" y="224" width="160" height="62" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="76" y="246" font-size="15" fill="#80828c">2</text>
  <text x="140" y="268" font-size="22" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">~a_</text>

  <rect x="250" y="224" width="160" height="62" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="266" y="246" font-size="15" fill="#80828c">1</text>
  <text x="330" y="268" font-size="22" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">~b_</text>

  <rect x="440" y="224" width="160" height="62" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="520" y="262" font-size="15" text-anchor="middle" fill="#5c5e66">не создавалось</text>

  <text x="235" y="312" font-size="15" text-anchor="middle" fill="#dbdfe6">их деструкторы отработали</text>

  <text x="700" y="248" font-size="17" fill="#ff2020">деструктор объекта не вызовется</text>
  <text x="700" y="276" font-size="15" fill="#80828c">объект не создан — нечего разрушать</text>
</svg>
