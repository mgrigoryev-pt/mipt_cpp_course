<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" width="1060" height="330"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="328" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- шапка: смещение байта внутри строки -->
  <text x="40" y="58" font-size="16" fill="#80828c">адрес</text>
  <g font-size="14" fill="#5c5e66" text-anchor="middle"
     font-family="Consolas, Roboto Mono, monospace">
    <text x="330" y="58">+0</text>
    <text x="390" y="58">+1</text>
    <text x="450" y="58">+2</text>
    <text x="510" y="58">+3</text>
    <text x="570" y="58">+4</text>
    <text x="630" y="58">+5</text>
    <text x="690" y="58">+6</text>
    <text x="750" y="58">+7</text>
  </g>

  <!-- строка x -->
  <text x="40" y="118" font-size="20" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">0x7ffd10c0</text>
  <rect x="300" y="80" width="240" height="62" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="420" y="120" font-size="28" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">42</text>
  <rect x="540" y="80" width="240" height="62" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="660" y="118" font-size="16" text-anchor="middle" fill="#5c5e66">чужая память</text>
  <text x="812" y="108" font-size="20" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">int x</text>
  <text x="812" y="132" font-size="16" fill="#80828c">4 байта, значение 42</text>

  <!-- строка p -->
  <text x="40" y="228" font-size="20" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">0x7ffd10c8</text>
  <rect x="300" y="190" width="480" height="62" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <text x="540" y="230" font-size="26" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">0x7ffd10c0</text>
  <text x="812" y="218" font-size="20" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">int* p</text>
  <text x="812" y="242" font-size="16" fill="#80828c">8 байт, значение — адрес</text>

  <!-- значение p ведёт на строку выше -->
  <path d="M 295 221 C 226 221, 226 111, 290 111" fill="none" stroke="#ff8a8a"
        stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="274" y="172" font-size="22" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">*p</text>

  <text x="300" y="296" font-size="17" fill="#80828c">
    <tspan fill="#ff8a8a" font-family="Consolas, Roboto Mono, monospace">&amp;x</tspan>
    <tspan> — адрес строки с </tspan><tspan
       font-family="Consolas, Roboto Mono, monospace">x</tspan><tspan>: ровно то число, которое лежит в </tspan><tspan
       font-family="Consolas, Roboto Mono, monospace">p</tspan>
  </text>
</svg>
