<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 340" width="1060" height="340"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
    <marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff2020"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="338" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="40" x2="530" y2="300" stroke="#26262b" stroke-width="1.5"/>

  <!-- до delete -->
  <text x="40" y="52" font-size="19" fill="#dbdfe6">до delete</text>
  <text x="40" y="112" font-size="17" fill="#80828c">стек: p</text>
  <rect x="40" y="126" width="150" height="62" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="115" y="164" font-size="19" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">0x1a40</text>
  <text x="330" y="112" font-size="17" fill="#80828c">куча</text>
  <rect x="290" y="126" width="180" height="62" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <text x="380" y="166" font-size="26" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">42</text>
  <line x1="190" y1="157" x2="282" y2="157" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>
  <text x="40" y="232" font-size="17" fill="#80828c">объект жив, указатель ведёт на него</text>

  <!-- после delete -->
  <text x="570" y="52" font-size="19" fill="#dbdfe6">после delete p</text>
  <text x="570" y="112" font-size="17" fill="#80828c">стек: p</text>
  <rect x="570" y="126" width="150" height="62" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="645" y="164" font-size="19" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">0x1a40</text>
  <text x="860" y="112" font-size="17" fill="#80828c">куча</text>
  <rect x="820" y="126" width="180" height="62" fill="none" stroke="#5c5e66"
        stroke-width="1.5" stroke-dasharray="7 6"/>
  <line x1="828" y1="182" x2="992" y2="132" stroke="#ff2020" stroke-width="2"/>
  <line x1="828" y1="132" x2="992" y2="182" stroke="#ff2020" stroke-width="2"/>
  <line x1="720" y1="157" x2="812" y2="157" stroke="#ff2020" stroke-width="2.5"
        stroke-dasharray="7 5" marker-end="url(#red)"/>
  <text x="570" y="232" font-size="17" fill="#dbdfe6">адрес в
    <tspan font-family="Consolas, Roboto Mono, monospace" fill="#ffffff">p</tspan> остался прежним,
  </text>
  <text x="570" y="256" font-size="17" fill="#dbdfe6">а объекта по нему больше нет</text>
  <text x="570" y="292" font-size="17" fill="#ff2020">чтение, запись и второй delete — UB</text>
</svg>
