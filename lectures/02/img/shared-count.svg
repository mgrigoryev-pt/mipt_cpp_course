<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 320" width="1060" height="320"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="318" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="360" y1="40" x2="360" y2="288" stroke="#26262b" stroke-width="1.5"/>
  <line x1="710" y1="40" x2="710" y2="288" stroke="#26262b" stroke-width="1.5"/>

  <!-- один владелец -->
  <text x="40" y="58" font-size="16" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">auto a = make_shared&lt;int&gt;(42);</text>
  <rect x="60" y="88" width="90" height="46" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="105" y="118" font-size="19" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">a</text>
  <line x1="105" y1="134" x2="105" y2="182" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <rect x="40" y="190" width="240" height="66" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="2"/>
  <line x1="160" y1="190" x2="160" y2="256" stroke="#ff8a8a" stroke-width="1.5"/>
  <text x="100" y="231" font-size="24" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">42</text>
  <text x="220" y="216" font-size="15" text-anchor="middle" fill="#80828c">счётчик</text>
  <text x="220" y="243" font-size="21" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">1</text>

  <!-- два владельца -->
  <text x="390" y="58" font-size="16" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">auto b = a;</text>
  <rect x="400" y="88" width="90" height="46" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="445" y="118" font-size="19" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">a</text>
  <rect x="530" y="88" width="90" height="46" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="575" y="118" font-size="19" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">b</text>
  <path d="M 445 134 C 445 162, 470 164, 492 182" fill="none" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <path d="M 575 134 C 575 162, 550 164, 528 182" fill="none" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <rect x="395" y="190" width="240" height="66" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="2"/>
  <line x1="515" y1="190" x2="515" y2="256" stroke="#ff8a8a" stroke-width="1.5"/>
  <text x="455" y="231" font-size="24" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">42</text>
  <text x="575" y="216" font-size="15" text-anchor="middle" fill="#80828c">счётчик</text>
  <text x="575" y="243" font-size="21" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">2</text>

  <!-- владельцев не осталось -->
  <text x="740" y="58" font-size="16" fill="#dbdfe6">оба вышли из области видимости</text>
  <rect x="760" y="88" width="90" height="46" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="7 6"/>
  <rect x="890" y="88" width="90" height="46" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="7 6"/>
  <rect x="755" y="190" width="240" height="66" fill="none" stroke="#5c5e66"
        stroke-width="1.5" stroke-dasharray="7 6"/>
  <line x1="763" y1="250" x2="987" y2="196" stroke="#ff2020" stroke-width="2"/>
  <line x1="763" y1="196" x2="987" y2="250" stroke="#ff2020" stroke-width="2"/>
  <text x="740" y="296" font-size="17" fill="#80828c">счётчик дошёл до нуля, объект удалён</text>
</svg>
