<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 340" width="1060" height="340"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
    <marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff2020"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="338" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="40" x2="530" y2="300" stroke="#26262b" stroke-width="1.5"/>

  <!-- неверный порядок -->
  <text x="40" y="56" font-size="18" fill="#ff2020">сначала delete</text>
  <text x="40" y="94" font-size="17" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">delete head;</text>
  <text x="40" y="120" font-size="17" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">head = head-&gt;next;</text>

  <rect x="40" y="160" width="110" height="60" fill="none" stroke="#5c5e66"
        stroke-width="1.5" stroke-dasharray="7 6"/>
  <rect x="150" y="160" width="90" height="60" fill="none" stroke="#5c5e66"
        stroke-width="1.5" stroke-dasharray="7 6"/>
  <line x1="48" y1="214" x2="232" y2="166" stroke="#ff2020" stroke-width="2"/>
  <line x1="48" y1="166" x2="232" y2="214" stroke="#ff2020" stroke-width="2"/>
  <line x1="240" y1="190" x2="330" y2="190" stroke="#ff2020" stroke-width="2.5"
        stroke-dasharray="7 5" marker-end="url(#red)"/>
  <rect x="338" y="160" width="150" height="60" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="413" y="197" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">20</text>
  <text x="40" y="262" font-size="17" fill="#ff2020">поле next читают у уничтоженного узла</text>
  <text x="40" y="288" font-size="17" fill="#80828c">это use after free: адрес там уже любой</text>

  <!-- верный порядок -->
  <text x="570" y="56" font-size="18" fill="#dbdfe6">сначала адрес</text>
  <text x="570" y="94" font-size="17" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">Node* next = head-&gt;next;</text>
  <text x="570" y="120" font-size="17" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">delete head;  head = next;</text>

  <rect x="570" y="160" width="110" height="60" fill="none" stroke="#5c5e66"
        stroke-width="1.5" stroke-dasharray="7 6"/>
  <rect x="680" y="160" width="90" height="60" fill="none" stroke="#5c5e66"
        stroke-width="1.5" stroke-dasharray="7 6"/>
  <line x1="578" y1="214" x2="762" y2="166" stroke="#5c5e66" stroke-width="1.5"/>
  <line x1="578" y1="166" x2="762" y2="214" stroke="#5c5e66" stroke-width="1.5"/>
  <rect x="820" y="160" width="150" height="60" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="895" y="197" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">20</text>
  <rect x="640" y="246" width="160" height="44" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <text x="720" y="274" font-size="18" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">next</text>
  <path d="M 800 268 C 868 268, 895 245, 895 226" fill="none" stroke="#ff8a8a"
        stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="570" y="322" font-size="17" fill="#80828c">адрес взят до удаления и лежит отдельно</text>
</svg>
