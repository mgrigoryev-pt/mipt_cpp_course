<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 344" width="1060" height="344"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="gray" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
    <marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff2020"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="342" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- ось времени -->
  <line x1="200" y1="44" x2="516" y2="44" stroke="#80828c" stroke-width="1.5"
        marker-end="url(#gray)"/>
  <text x="530" y="48" font-size="13" fill="#80828c">время</text>

  <!-- подписи категорий -->
  <g text-anchor="end" font-family="Consolas, Roboto Mono, monospace" font-size="22">
    <text x="170" y="94" fill="#dbdfe6">CE</text>
    <text x="170" y="158" fill="#dbdfe6">RE</text>
    <text x="170" y="254" fill="#ff2020">UB</text>
  </g>
  <g text-anchor="end" font-size="13" fill="#80828c">
    <text x="170" y="114">компилятор поймал</text>
    <text x="170" y="178">упало при запуске</text>
    <text x="170" y="274">поведение</text>
    <text x="170" y="292">не определено</text>
  </g>

  <!-- CE -->
  <rect x="200" y="70" width="120" height="44" rx="8" fill="none" stroke="#dbdfe6" stroke-width="2"/>
  <text x="260" y="98" font-size="15" text-anchor="middle" fill="#dbdfe6">сборка</text>
  <g stroke="#ff2020" stroke-width="2.5">
    <line x1="336" y1="104" x2="356" y2="84"/>
    <line x1="336" y1="84" x2="356" y2="104"/>
  </g>
  <rect x="380" y="70" width="120" height="44" rx="8" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="440" y="98" font-size="15" text-anchor="middle" fill="#5c5e66">запуск</text>
  <text x="520" y="97" font-size="14" fill="#80828c">до запуска дело не дошло — место ошибки показано</text>

  <!-- RE -->
  <rect x="200" y="134" width="120" height="44" rx="8" fill="none" stroke="#dbdfe6" stroke-width="2"/>
  <text x="260" y="162" font-size="15" text-anchor="middle" fill="#dbdfe6">сборка</text>
  <line x1="324" y1="156" x2="374" y2="156" stroke="#80828c" stroke-width="2"
        marker-end="url(#gray)"/>
  <rect x="380" y="134" width="120" height="44" rx="8" fill="none" stroke="#dbdfe6" stroke-width="2"/>
  <text x="440" y="162" font-size="15" text-anchor="middle" fill="#dbdfe6">запуск</text>
  <g stroke="#ff2020" stroke-width="2.5">
    <line x1="516" y1="168" x2="536" y2="148"/>
    <line x1="516" y1="148" x2="536" y2="168"/>
  </g>
  <text x="560" y="161" font-size="14" fill="#80828c">упало или бросило исключение: деление на ноль, v.at(100)</text>

  <!-- UB -->
  <rect x="200" y="246" width="120" height="44" rx="8" fill="none" stroke="#dbdfe6" stroke-width="2"/>
  <text x="260" y="274" font-size="15" text-anchor="middle" fill="#dbdfe6">сборка</text>
  <line x1="324" y1="268" x2="374" y2="268" stroke="#80828c" stroke-width="2"
        marker-end="url(#gray)"/>
  <rect x="380" y="246" width="120" height="44" rx="8" fill="none" stroke="#dbdfe6" stroke-width="2"/>
  <text x="440" y="274" font-size="15" text-anchor="middle" fill="#dbdfe6">запуск</text>
  <g fill="none" stroke="#ff2020" stroke-width="2" marker-end="url(#red)">
    <path d="M 504 266 L 612 214"/>
    <path d="M 504 267 L 612 247"/>
    <path d="M 504 269 L 612 281"/>
    <path d="M 504 270 L 612 314"/>
  </g>
  <text x="630" y="219" font-size="15" fill="#80828c">работает корректно</text>
  <text x="630" y="252" font-size="15" fill="#ff2020">падает с segfault</text>
  <text x="630" y="286" font-size="15" fill="#ff2020">молча портит данные</text>
  <text x="630" y="319" font-size="15" fill="#ff2020">результат меняется от -O2</text>
</svg>
