<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 316" width="1060" height="316"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="light" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
    <marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff2020"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="314" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="40" x2="530" y2="296" stroke="#26262b" stroke-width="1.5"/>

  <text x="40" y="42" font-size="17" fill="#ff2020">забыли break</text>
  <text x="560" y="42" font-size="17" fill="#dbdfe6">провал помечен</text>

  <!-- слева: управление проваливается -->
  <g fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2">
    <rect x="90" y="70" width="280" height="52"/>
    <rect x="90" y="142" width="280" height="52"/>
    <rect x="90" y="214" width="280" height="52"/>
  </g>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="16" fill="#dbdfe6">
    <text x="110" y="103">case 1: do_one();</text>
    <text x="110" y="175">case 2: do_two();</text>
    <text x="110" y="247">case 3: do_three();</text>
  </g>
  <path d="M 230 52 V 64" fill="none" stroke="#dbdfe6" stroke-width="2" marker-end="url(#light)"/>
  <text x="246" y="64" font-size="12" fill="#80828c">n == 1</text>
  <g fill="none" stroke="#ff2020" stroke-width="2.5" marker-end="url(#red)">
    <path d="M 230 122 V 136"/>
    <path d="M 230 194 V 208"/>
  </g>
  <text x="386" y="102" font-size="14" fill="#80828c">нужное</text>
  <text x="386" y="174" font-size="14" fill="#ff2020">лишнее</text>
  <text x="386" y="246" font-size="14" fill="#ff2020">лишнее</text>
  <text x="40" y="292" font-size="14" fill="#ff2020">нет break — управление проваливается вниз</text>

  <!-- справа: провал объявлен атрибутом -->
  <g fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2">
    <rect x="590" y="70" width="280" height="72"/>
    <rect x="590" y="162" width="280" height="72"/>
  </g>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="16" fill="#dbdfe6">
    <text x="610" y="100">case 1: do_one();</text>
    <text x="610" y="126">[[fallthrough]];</text>
    <text x="610" y="192">case 2: do_two();</text>
    <text x="610" y="218">break;</text>
  </g>
  <path d="M 730 52 V 64" fill="none" stroke="#dbdfe6" stroke-width="2" marker-end="url(#light)"/>
  <text x="746" y="64" font-size="12" fill="#80828c">n == 1</text>
  <path d="M 730 142 V 156" fill="none" stroke="#dbdfe6" stroke-width="2.5" marker-end="url(#light)"/>
  <path d="M 730 234 V 252 H 826" fill="none" stroke="#dbdfe6" stroke-width="2.5"
        marker-end="url(#light)"/>
  <text x="840" y="257" font-size="14" fill="#80828c">выход из switch</text>
  <text x="886" y="104" font-size="13" fill="#80828c">провал объявлен</text>
  <text x="560" y="292" font-size="14" fill="#80828c">компилятор молчит, читатель видит намерение</text>
</svg>
