<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 268" width="1060" height="268"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="1058" height="266" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- названия блоков -->
  <g text-anchor="middle" fill="#dbdfe6" font-size="16">
    <text x="253" y="44">Язык</text>
    <text x="439" y="44">Классы</text>
    <text x="598" y="44">Шаблоны</text>
    <text x="677" y="44">Лямбды</text>
    <text x="757" y="44">Move</text>
    <text x="889" y="44">STL</text>
  </g>
  <g text-anchor="middle" fill="#80828c" font-size="13">
    <text x="253" y="63">типы, память, ссылки</text>
    <text x="439" y="63">ООП, операторы, полиморфизм</text>
    <text x="598" y="63">variadic, fold</text>
    <text x="757" y="63">auto</text>
    <text x="889" y="63">контейнеры, ошибки, потоки</text>
  </g>
  <g stroke="#3a3a40" stroke-width="1.5">
    <line x1="176" y1="74" x2="331" y2="74"/>
    <line x1="335" y1="74" x2="543" y2="74"/>
    <line x1="547" y1="74" x2="649" y2="74"/>
    <line x1="653" y1="74" x2="702" y2="74"/>
    <line x1="706" y1="74" x2="808" y2="74"/>
    <line x1="812" y1="74" x2="967" y2="74"/>
  </g>

  <!-- пятнадцать лекций -->
  <g fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="1.5">
    <rect x="176" y="86" width="49" height="46"/>
    <rect x="229" y="86" width="49" height="46"/>
    <rect x="282" y="86" width="49" height="46"/>
    <rect x="335" y="86" width="49" height="46"/>
    <rect x="388" y="86" width="49" height="46"/>
    <rect x="441" y="86" width="49" height="46"/>
    <rect x="494" y="86" width="49" height="46"/>
    <rect x="547" y="86" width="49" height="46"/>
    <rect x="600" y="86" width="49" height="46"/>
    <rect x="653" y="86" width="49" height="46"/>
    <rect x="706" y="86" width="49" height="46"/>
    <rect x="759" y="86" width="49" height="46"/>
    <rect x="812" y="86" width="49" height="46"/>
    <rect x="865" y="86" width="49" height="46"/>
    <rect x="918" y="86" width="49" height="46"/>
  </g>
  <g text-anchor="middle" font-size="17" fill="#dbdfe6"
     font-family="Consolas, Roboto Mono, monospace">
    <text x="200" y="116">1</text>
    <text x="253" y="116">2</text>
    <text x="306" y="116">3</text>
    <text x="359" y="116">4</text>
    <text x="412" y="116">5</text>
    <text x="465" y="116">6</text>
    <text x="518" y="116">7</text>
    <text x="571" y="116">8</text>
    <text x="624" y="116">9</text>
    <text x="677" y="116">10</text>
    <text x="730" y="116">11</text>
    <text x="783" y="116">12</text>
    <text x="836" y="116">13</text>
    <text x="889" y="116">14</text>
    <text x="942" y="116">15</text>
  </g>
  <rect x="975" y="86" width="45" height="46" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="997" y="118" font-size="20" text-anchor="middle" fill="#5c5e66">…</text>

  <!-- четыре части практикума -->
  <g fill="none" stroke="#dbdfe6" stroke-width="1.5">
    <rect x="176" y="150" width="170" height="56" rx="6"/>
    <rect x="382" y="150" width="170" height="56" rx="6"/>
    <rect x="588" y="150" width="170" height="56" rx="6"/>
    <rect x="794" y="150" width="170" height="56" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="16" fill="#dbdfe6">
    <text x="261" y="178">Часть 1</text>
    <text x="467" y="178">Часть 2</text>
    <text x="673" y="178">Часть 3</text>
    <text x="879" y="178">Часть 4</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#80828c">
    <text x="261" y="197">занятия 1.1–1.3</text>
    <text x="467" y="197">занятия 2.1–2.3</text>
    <text x="673" y="197">занятия 3.1–3.3</text>
    <text x="879" y="197">занятия 4.1–4.3</text>
  </g>

  <!-- проверочные -->
  <g fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="1.5">
    <rect x="352" y="150" width="24" height="56"/>
    <rect x="558" y="150" width="24" height="56"/>
    <rect x="764" y="150" width="24" height="56"/>
  </g>
  <g text-anchor="middle" font-size="17" fill="#ff8a8a"
     font-family="Consolas, Roboto Mono, monospace">
    <text x="364" y="184">П</text>
    <text x="570" y="184">П</text>
    <text x="776" y="184">П</text>
  </g>

  <!-- подписи строк -->
  <g text-anchor="end" font-size="16" fill="#dbdfe6">
    <text x="160" y="115">15 лекций</text>
    <text x="160" y="184">12 занятий</text>
  </g>

  <text x="176" y="240" font-size="14" fill="#80828c">П — проверочная пара: зачёт или незачёт, каждый облегчает экзамен</text>
  <text x="1020" y="240" font-size="13" text-anchor="end" fill="#5c5e66">… — дальше за рамками курса</text>
</svg>
