<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 216" width="1060" height="216"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="gray" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="214" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- что делает каждая стадия -->
  <g text-anchor="middle" font-size="13" fill="#80828c">
    <text x="252" y="48">вставляет заголовки</text>
    <text x="409" y="48">проверяет типы</text>
    <text x="694" y="48">связывает символы</text>
  </g>

  <!-- файлы -->
  <g fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2">
    <rect x="40" y="64" width="118" height="64"/>
    <rect x="500" y="64" width="100" height="64"/>
    <rect x="788" y="64" width="94" height="64"/>
  </g>
  <g text-anchor="middle" font-size="16" fill="#ffffff"
     font-family="Consolas, Roboto Mono, monospace">
    <text x="99" y="102">hello.cpp</text>
    <text x="550" y="102">hello.o</text>
    <text x="835" y="102">hello</text>
  </g>

  <!-- стадии -->
  <g fill="none" stroke="#dbdfe6" stroke-width="2">
    <rect x="186" y="64" width="132" height="64" rx="8"/>
    <rect x="346" y="64" width="126" height="64" rx="8"/>
    <rect x="628" y="64" width="132" height="64" rx="8"/>
    <rect x="910" y="64" width="104" height="64" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="15" fill="#dbdfe6">
    <text x="252" y="102">препроцессор</text>
    <text x="409" y="102">компилятор</text>
    <text x="694" y="102">линкер</text>
    <text x="962" y="102">запуск</text>
  </g>

  <!-- поток -->
  <g stroke="#80828c" stroke-width="2" marker-end="url(#gray)">
    <line x1="160" y1="96" x2="182" y2="96"/>
    <line x1="320" y1="96" x2="342" y2="96"/>
    <line x1="474" y1="96" x2="496" y2="96"/>
    <line x1="602" y1="96" x2="624" y2="96"/>
    <line x1="762" y1="96" x2="784" y2="96"/>
    <line x1="884" y1="96" x2="906" y2="96"/>
  </g>

  <!-- где рождается какая ошибка -->
  <g fill="none" stroke="#ff2020" stroke-width="1.5">
    <path d="M186 140 V148 H760 V140"/>
    <path d="M910 140 V148 H1014 V140"/>
  </g>
  <text x="473" y="172" font-size="15" text-anchor="middle" fill="#ff2020">CE — ошибка на любой из этих стадий: исполняемого файла нет</text>
  <text x="962" y="172" font-size="15" text-anchor="middle" fill="#ff2020">RE и UB —</text>
  <text x="962" y="192" font-size="15" text-anchor="middle" fill="#ff2020">только здесь</text>
</svg>
