<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" width="1060" height="300"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="1058" height="298" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="40" x2="530" y2="272" stroke="#26262b" stroke-width="1.5"/>

  <text x="40" y="44" font-size="17" fill="#dbdfe6">зависят от платформы</text>
  <text x="560" y="44" font-size="17" fill="#dbdfe6">точный размер: &lt;cstdint&gt;</text>

  <!-- имена типов -->
  <g font-family="Consolas, Roboto Mono, monospace" font-size="16" fill="#dbdfe6">
    <text x="40" y="93">short</text>
    <text x="40" y="139">int</text>
    <text x="40" y="185">long</text>
    <text x="40" y="231">long long</text>
    <text x="560" y="93">int8_t</text>
    <text x="560" y="139">int16_t</text>
    <text x="560" y="185">int32_t</text>
    <text x="560" y="231">int64_t</text>
  </g>

  <!-- гарантированные байты -->
  <g fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2">
    <rect x="150" y="70" width="80" height="34"/>
    <rect x="150" y="116" width="80" height="34"/>
    <rect x="150" y="162" width="160" height="34"/>
    <rect x="150" y="208" width="320" height="34"/>
    <rect x="676" y="70" width="40" height="34"/>
    <rect x="676" y="116" width="80" height="34"/>
    <rect x="676" y="162" width="160" height="34"/>
    <rect x="676" y="208" width="320" height="34"/>
  </g>

  <!-- границы байтов -->
  <g stroke="#3a3a40" stroke-width="1">
    <line x1="190" y1="70" x2="190" y2="104"/>
    <line x1="190" y1="116" x2="190" y2="150"/>
    <line x1="190" y1="162" x2="190" y2="196"/>
    <line x1="230" y1="162" x2="230" y2="196"/>
    <line x1="270" y1="162" x2="270" y2="196"/>
    <line x1="190" y1="208" x2="190" y2="242"/>
    <line x1="230" y1="208" x2="230" y2="242"/>
    <line x1="270" y1="208" x2="270" y2="242"/>
    <line x1="310" y1="208" x2="310" y2="242"/>
    <line x1="350" y1="208" x2="350" y2="242"/>
    <line x1="390" y1="208" x2="390" y2="242"/>
    <line x1="430" y1="208" x2="430" y2="242"/>
    <line x1="716" y1="116" x2="716" y2="150"/>
    <line x1="716" y1="162" x2="716" y2="196"/>
    <line x1="756" y1="162" x2="756" y2="196"/>
    <line x1="796" y1="162" x2="796" y2="196"/>
    <line x1="716" y1="208" x2="716" y2="242"/>
    <line x1="756" y1="208" x2="756" y2="242"/>
    <line x1="796" y1="208" x2="796" y2="242"/>
    <line x1="836" y1="208" x2="836" y2="242"/>
    <line x1="876" y1="208" x2="876" y2="242"/>
    <line x1="916" y1="208" x2="916" y2="242"/>
    <line x1="956" y1="208" x2="956" y2="242"/>
  </g>

  <!-- то, что добавляет платформа -->
  <g fill="none" stroke="#3a3a40" stroke-width="1.5" stroke-dasharray="6 5">
    <rect x="230" y="116" width="80" height="34"/>
    <rect x="310" y="162" width="160" height="34"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#5c5e66">
    <text x="270" y="138">обычно</text>
    <text x="390" y="184">на Linux</text>
  </g>

  <text x="40" y="266" font-size="13" fill="#80828c">сплошное — гарантия стандарта, пунктир — как бывает на платформе</text>
  <text x="560" y="266" font-size="13" fill="#80828c">одна клетка — байт, и их ровно столько, сколько в имени</text>
</svg>
