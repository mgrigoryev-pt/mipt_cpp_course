<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 288" width="1060" height="288"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="gray" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="286" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="40" x2="530" y2="272" stroke="#26262b" stroke-width="1.5"/>

  <text x="40" y="40" font-size="17" fill="#ff2020">без защиты</text>
  <text x="560" y="40" font-size="17" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">#pragma once</text>

  <!-- граф включений: слева -->
  <g fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2">
    <rect x="105" y="70" width="110" height="42"/>
    <rect x="55" y="134" width="90" height="42"/>
    <rect x="175" y="134" width="90" height="42"/>
    <rect x="105" y="198" width="110" height="42"/>
  </g>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="15" fill="#dbdfe6"
     text-anchor="middle">
    <text x="160" y="96">main.cpp</text>
    <text x="100" y="160">a.h</text>
    <text x="220" y="160">b.h</text>
    <text x="160" y="224">widget.h</text>
  </g>
  <g fill="none" stroke="#80828c" stroke-width="2" marker-end="url(#gray)">
    <path d="M 148 112 L 114 128"/>
    <path d="M 172 112 L 206 128"/>
    <path d="M 106 176 L 138 192"/>
    <path d="M 214 176 L 182 192"/>
  </g>

  <!-- трансляционная единица: слева -->
  <text x="320" y="62" font-size="13" fill="#80828c">после подстановки</text>
  <rect x="320" y="70" width="190" height="172" fill="none" stroke="#26262b" stroke-width="1.5"/>
  <text x="336" y="110" font-size="15" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">class Widget</text>
  <rect x="330" y="138" width="170" height="34" fill="none" stroke="#ff2020"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="346" y="160" font-size="15" fill="#ff2020"
        font-family="Consolas, Roboto Mono, monospace">class Widget</text>
  <text x="330" y="200" font-size="13" fill="#ff2020">CE: повторное определение</text>

  <!-- граф включений: справа -->
  <g fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2">
    <rect x="605" y="70" width="110" height="42"/>
    <rect x="555" y="134" width="90" height="42"/>
    <rect x="675" y="134" width="90" height="42"/>
    <rect x="605" y="198" width="110" height="42"/>
  </g>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="15" fill="#dbdfe6"
     text-anchor="middle">
    <text x="660" y="96">main.cpp</text>
    <text x="600" y="160">a.h</text>
    <text x="720" y="160">b.h</text>
    <text x="660" y="224">widget.h</text>
  </g>
  <g fill="none" stroke="#80828c" stroke-width="2" marker-end="url(#gray)">
    <path d="M 648 112 L 614 128"/>
    <path d="M 672 112 L 706 128"/>
    <path d="M 606 176 L 638 192"/>
    <path d="M 714 176 L 682 192"/>
  </g>
  <text x="660" y="262" font-size="12.5" fill="#80828c" text-anchor="middle"
        font-family="Consolas, Roboto Mono, monospace">#pragma once</text>

  <!-- трансляционная единица: справа -->
  <text x="820" y="62" font-size="13" fill="#80828c">после подстановки</text>
  <rect x="820" y="70" width="190" height="172" fill="none" stroke="#26262b" stroke-width="1.5"/>
  <text x="836" y="110" font-size="15" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">class Widget</text>
  <rect x="830" y="138" width="170" height="34" fill="none" stroke="#3a3a40"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="830" y="200" font-size="13" fill="#5c5e66">второе включение отброшено</text>
</svg>
