<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" width="1060" height="330"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
    <marker id="grey" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="328" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="36" x2="530" y2="296" stroke="#26262b" stroke-width="1.5"/>

  <!-- move noexcept -->
  <text x="40" y="52" font-size="18" fill="#dbdfe6">move-конструктор помечен
    <tspan font-family="Consolas, Roboto Mono, monospace" fill="#ffffff">noexcept</tspan>
  </text>

  <rect x="40" y="88" width="100" height="52" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <rect x="150" y="88" width="100" height="52" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <rect x="260" y="88" width="100" height="52" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="90" y="122" font-size="20" text-anchor="middle" fill="#ffffff" font-family="Consolas, Roboto Mono, monospace">a</text>
  <text x="200" y="122" font-size="20" text-anchor="middle" fill="#ffffff" font-family="Consolas, Roboto Mono, monospace">b</text>
  <text x="310" y="122" font-size="20" text-anchor="middle" fill="#ffffff" font-family="Consolas, Roboto Mono, monospace">c</text>
  <text x="380" y="119" font-size="15" fill="#80828c">новый буфер</text>

  <line x1="90" y1="188" x2="90" y2="148" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <line x1="200" y1="188" x2="200" y2="148" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <line x1="310" y1="188" x2="310" y2="148" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="380" y="174" font-size="16" fill="#ff8a8a">move</text>

  <rect x="40" y="194" width="100" height="52" fill="none" stroke="#3a3a40" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="150" y="194" width="100" height="52" fill="none" stroke="#3a3a40" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="260" y="194" width="100" height="52" fill="none" stroke="#3a3a40" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="90" y="228" font-size="20" text-anchor="middle" fill="#5c5e66" font-family="Consolas, Roboto Mono, monospace">—</text>
  <text x="200" y="228" font-size="20" text-anchor="middle" fill="#5c5e66" font-family="Consolas, Roboto Mono, monospace">—</text>
  <text x="310" y="228" font-size="20" text-anchor="middle" fill="#5c5e66" font-family="Consolas, Roboto Mono, monospace">—</text>
  <text x="380" y="225" font-size="15" fill="#80828c">старый буфер</text>

  <text x="40" y="286" font-size="17" fill="#ffffff">элементы перемещаются</text>

  <!-- move может бросить -->
  <text x="570" y="52" font-size="18" fill="#dbdfe6">move-конструктор может бросить</text>

  <rect x="570" y="88" width="100" height="52" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <rect x="680" y="88" width="100" height="52" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <rect x="790" y="88" width="100" height="52" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="620" y="122" font-size="20" text-anchor="middle" fill="#ffffff" font-family="Consolas, Roboto Mono, monospace">a</text>
  <text x="730" y="122" font-size="20" text-anchor="middle" fill="#ffffff" font-family="Consolas, Roboto Mono, monospace">b</text>
  <text x="840" y="122" font-size="20" text-anchor="middle" fill="#ffffff" font-family="Consolas, Roboto Mono, monospace">c</text>
  <text x="910" y="119" font-size="15" fill="#80828c">новый буфер</text>

  <line x1="620" y1="188" x2="620" y2="148" stroke="#80828c" stroke-width="2.5" marker-end="url(#grey)"/>
  <line x1="730" y1="188" x2="730" y2="148" stroke="#80828c" stroke-width="2.5" marker-end="url(#grey)"/>
  <line x1="840" y1="188" x2="840" y2="148" stroke="#80828c" stroke-width="2.5" marker-end="url(#grey)"/>
  <text x="910" y="174" font-size="16" fill="#80828c">copy</text>

  <rect x="570" y="194" width="100" height="52" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <rect x="680" y="194" width="100" height="52" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <rect x="790" y="194" width="100" height="52" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="620" y="228" font-size="20" text-anchor="middle" fill="#ffffff" font-family="Consolas, Roboto Mono, monospace">a</text>
  <text x="730" y="228" font-size="20" text-anchor="middle" fill="#ffffff" font-family="Consolas, Roboto Mono, monospace">b</text>
  <text x="840" y="228" font-size="20" text-anchor="middle" fill="#ffffff" font-family="Consolas, Roboto Mono, monospace">c</text>
  <text x="910" y="225" font-size="15" fill="#80828c">старый буфер</text>

  <text x="570" y="286" font-size="17" fill="#ffffff">копия дороже, зато при броске старые целы</text>
</svg>
