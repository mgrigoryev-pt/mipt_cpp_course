<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 310" width="1060" height="310"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
    <marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff2020"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="308" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="36" x2="530" y2="276" stroke="#26262b" stroke-width="1.5"/>

  <!-- пока строка жива -->
  <text x="40" y="52" font-size="19" fill="#dbdfe6">пока строка жива</text>

  <text x="140" y="104" font-size="16" text-anchor="middle" fill="#80828c">string_view sv</text>
  <rect x="40" y="118" width="200" height="62" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="140" y="156" font-size="19" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">(ptr, 5)</text>

  <text x="390" y="104" font-size="16" text-anchor="middle" fill="#80828c">буфер строки s</text>
  <rect x="290" y="118" width="200" height="62" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <text x="390" y="158" font-size="24" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">hello</text>

  <line x1="240" y1="149" x2="282" y2="149" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>
  <text x="40" y="226" font-size="17" fill="#dbdfe6">view смотрит на живые символы</text>

  <!-- после выхода из функции -->
  <text x="570" y="52" font-size="19" fill="#dbdfe6">после выхода из функции</text>

  <text x="670" y="104" font-size="16" text-anchor="middle" fill="#80828c">string_view sv</text>
  <rect x="570" y="118" width="200" height="62" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="670" y="156" font-size="19" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">(ptr, 5)</text>

  <text x="920" y="104" font-size="16" text-anchor="middle" fill="#80828c">буфер разрушен</text>
  <rect x="820" y="118" width="200" height="62" fill="none" stroke="#5c5e66"
        stroke-width="1.5" stroke-dasharray="7 6"/>
  <line x1="828" y1="174" x2="1012" y2="124" stroke="#ff2020" stroke-width="2"/>
  <line x1="828" y1="124" x2="1012" y2="174" stroke="#ff2020" stroke-width="2"/>

  <line x1="770" y1="149" x2="812" y2="149" stroke="#ff2020" stroke-width="2.5"
        stroke-dasharray="7 5" marker-end="url(#red)"/>
  <text x="570" y="226" font-size="17" fill="#dbdfe6">адрес и длина в view прежние</text>
  <text x="570" y="258" font-size="17" fill="#ff2020">любое чтение через sv — UB</text>
</svg>
