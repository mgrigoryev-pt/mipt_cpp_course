<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 378" width="1060" height="378"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
    <marker id="grey" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="348" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="36" x2="530" y2="342" stroke="#26262b" stroke-width="1.5"/>

  <!-- левая панель: substr у std::string -->
  <text x="40" y="52" font-size="19" fill="#dbdfe6">substr у
    <tspan font-family="Consolas, Roboto Mono, monospace" fill="#ffffff">std::string</tspan>
  </text>

  <rect x="40" y="74" width="450" height="48" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="265" y="105" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">/usr/bin/agent 1274</text>
  <text x="40" y="142" font-size="15" fill="#80828c">исходная строка события</text>

  <line x1="140" y1="154" x2="140" y2="190" stroke="#80828c" stroke-width="2" marker-end="url(#grey)"/>
  <line x1="370" y1="154" x2="370" y2="190" stroke="#80828c" stroke-width="2" marker-end="url(#grey)"/>

  <rect x="40" y="196" width="200" height="48" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="140" y="227" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">agent</text>
  <rect x="270" y="196" width="200" height="48" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="370" y="227" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">1274</text>
  <text x="40" y="268" font-size="15" fill="#80828c">каждая подстрока — новая память и копия символов</text>

  <text x="40" y="320" font-size="18" fill="#dbdfe6">восемь подстрок — восемь аллокаций</text>

  <!-- правая панель: substr у string_view -->
  <text x="570" y="52" font-size="19" fill="#dbdfe6">substr у
    <tspan font-family="Consolas, Roboto Mono, monospace" fill="#ffffff">string_view</tspan>
  </text>

  <rect x="570" y="74" width="450" height="48" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="795" y="105" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">/usr/bin/agent 1274</text>
  <text x="570" y="142" font-size="15" fill="#80828c">та же строка, ничего не копируется</text>

  <line x1="670" y1="190" x2="700" y2="154" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <line x1="900" y1="190" x2="880" y2="154" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

  <rect x="570" y="196" width="200" height="48" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <text x="670" y="227" font-size="17" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">(ptr, 5)</text>
  <rect x="800" y="196" width="200" height="48" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <text x="900" y="227" font-size="17" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">(ptr, 4)</text>
  <text x="570" y="268" font-size="15" fill="#80828c">view — пара «указатель + длина» на чужие символы</text>

  <text x="570" y="320" font-size="18" fill="#ffffff">сколько бы ни было шагов — ноль аллокаций</text>
</svg>
