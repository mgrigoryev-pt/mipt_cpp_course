<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 320" width="1060" height="320"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">

  <rect x="1" y="1" width="1058" height="318" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="360" y1="36" x2="360" y2="252" stroke="#26262b" stroke-width="1.5"/>
  <line x1="700" y1="36" x2="700" y2="252" stroke="#26262b" stroke-width="1.5"/>

  <!-- шаг 1 -->
  <text x="40" y="52" font-size="18" fill="#dbdfe6">до вызова</text>
  <rect x="40" y="84" width="120" height="56" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="100" y="122" font-size="24" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">A</text>
  <text x="100" y="162" font-size="15" text-anchor="middle" fill="#80828c">*this</text>

  <rect x="200" y="84" width="120" height="56" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="260" y="122" font-size="24" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">B</text>
  <text x="260" y="162" font-size="15" text-anchor="middle" fill="#80828c">other</text>

  <!-- шаг 2 -->
  <text x="390" y="52" font-size="18" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">T tmp(other);</text>
  <rect x="390" y="84" width="120" height="56" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="450" y="122" font-size="24" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">A</text>
  <text x="450" y="162" font-size="15" text-anchor="middle" fill="#80828c">*this</text>

  <rect x="550" y="84" width="120" height="56" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="610" y="122" font-size="24" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">B</text>
  <text x="610" y="162" font-size="15" text-anchor="middle" fill="#80828c">tmp — копия other</text>

  <text x="390" y="206" font-size="16" fill="#ff2020">копирование может бросить</text>
  <text x="390" y="230" font-size="16" fill="#dbdfe6">— и тогда *this как был</text>

  <!-- шаг 3 -->
  <text x="730" y="52" font-size="18" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">swap(tmp);</text>
  <rect x="730" y="84" width="120" height="56" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="790" y="122" font-size="24" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">B</text>
  <text x="790" y="162" font-size="15" text-anchor="middle" fill="#80828c">*this</text>

  <rect x="890" y="84" width="120" height="56" fill="none" stroke="#5c5e66"
        stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="950" y="122" font-size="24" text-anchor="middle" fill="#5c5e66"
        font-family="Consolas, Roboto Mono, monospace">A</text>
  <text x="950" y="162" font-size="15" text-anchor="middle" fill="#80828c">tmp уносит старое</text>

  <text x="730" y="206" font-size="16" fill="#dbdfe6">swap помечен noexcept —</text>
  <text x="730" y="230" font-size="16" fill="#dbdfe6">бросить здесь уже нечему</text>

  <text x="530" y="290" font-size="17" text-anchor="middle" fill="#ffffff">либо функция сделала всё, либо состояние осталось прежним — strong guarantee</text>
</svg>
