<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 340" width="1060" height="340"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
    <marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff2020"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="338" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- успешный путь: подпись над дугой -->
  <text x="657" y="84" font-size="16" text-anchor="middle" fill="#ff8a8a">значение идёт мимо or_else</text>

  <!-- звенья цепочки -->
  <rect x="40" y="130" width="215" height="64" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="147" y="169" font-size="16" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">get_value(h, id)</text>

  <rect x="295" y="130" width="215" height="64" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="402" y="169" font-size="16" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">and_then(to_score)</text>

  <rect x="550" y="130" width="215" height="64" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="657" y="169" font-size="16" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">or_else(fallback)</text>

  <rect x="805" y="130" width="215" height="64" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="912" y="169" font-size="16" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">value_or(-1.0)</text>

  <!-- путь значения -->
  <line x1="255" y1="150" x2="289" y2="150" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>
  <path d="M 510 150 C 560 100, 750 100, 799 148" fill="none" stroke="#ff8a8a"
        stroke-width="2.5" marker-end="url(#pink)"/>

  <!-- путь ошибки -->
  <path d="M 255 180 C 300 254, 480 254, 544 194" fill="none" stroke="#ff2020"
        stroke-width="2.5" marker-end="url(#red)"/>
  <text x="400" y="284" font-size="16" text-anchor="middle" fill="#ff2020">ошибка проходит and_then насквозь</text>
  <line x1="765" y1="180" x2="799" y2="180" stroke="#ff2020" stroke-width="2.5"
        marker-end="url(#red)"/>

  <text x="530" y="322" font-size="17" text-anchor="middle" fill="#dbdfe6">каждое звено работает только на своём пути — ручных проверок статуса не остаётся</text>
</svg>
