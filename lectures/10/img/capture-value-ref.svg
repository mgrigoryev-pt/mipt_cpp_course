<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" width="1060" height="330"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="328" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="36" x2="530" y2="300" stroke="#26262b" stroke-width="1.5"/>

  <!-- по значению -->
  <text x="40" y="52" font-size="19" fill="#dbdfe6">
    <tspan font-family="Consolas, Roboto Mono, monospace" fill="#ffffff">[x]</tspan> — по значению</text>

  <text x="40" y="90" font-size="15" fill="#80828c">переменная снаружи</text>
  <rect x="40" y="100" width="150" height="58" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="115" y="139" font-size="24" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">100</text>
  <text x="115" y="180" font-size="15" text-anchor="middle" fill="#80828c">int x</text>

  <rect x="250" y="86" width="250" height="104" rx="6"
        fill="rgba(255,255,255,0.04)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="266" y="112" font-size="16" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">by_val</text>
  <text x="272" y="156" font-size="16" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">x:</text>
  <rect x="300" y="124" width="110" height="48" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="355" y="157" font-size="22" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">10</text>

  <text x="40" y="230" font-size="16" fill="#80828c">внутри замыкания — копия, снятая при создании;</text>
  <text x="40" y="254" font-size="16" fill="#80828c">изменения x снаружи её не трогают</text>
  <text x="40" y="292" font-size="18" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">by_val(0) <tspan fill="#ffffff">→ 10</tspan></text>

  <!-- по ссылке -->
  <text x="560" y="52" font-size="19" fill="#dbdfe6">
    <tspan font-family="Consolas, Roboto Mono, monospace" fill="#ff8a8a">[&amp;x]</tspan> — по ссылке</text>

  <text x="560" y="90" font-size="15" fill="#80828c">переменная снаружи</text>
  <rect x="560" y="100" width="150" height="58" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="635" y="139" font-size="24" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">100</text>
  <text x="635" y="180" font-size="15" text-anchor="middle" fill="#80828c">int x</text>

  <rect x="770" y="86" width="250" height="104" rx="6"
        fill="rgba(255,255,255,0.04)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="786" y="112" font-size="16" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">by_ref</text>
  <rect x="810" y="124" width="140" height="48" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <text x="880" y="155" font-size="19" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">int&amp; x</text>

  <path d="M 804 148 C 766 148, 754 129, 722 129" fill="none" stroke="#ff8a8a"
        stroke-width="2.5" marker-end="url(#pink)"/>

  <text x="560" y="230" font-size="16" fill="#80828c">внутри замыкания — ссылка на ту же переменную;</text>
  <text x="560" y="254" font-size="16" fill="#80828c">видно текущее значение, каким бы оно ни стало</text>
  <text x="560" y="292" font-size="18" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">by_ref(0) <tspan fill="#ffffff">→ 100</tspan></text>
</svg>
