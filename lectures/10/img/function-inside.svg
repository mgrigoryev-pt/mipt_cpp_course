<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 340" width="1060" height="340"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="338" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="36" x2="530" y2="296" stroke="#26262b" stroke-width="1.5"/>

  <!-- цель влезла -->
  <text x="45" y="52" font-size="19" fill="#dbdfe6">цель влезла в буфер</text>
  <text x="45" y="84" font-size="15" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">std::function&lt;int(int, int)&gt;</text>

  <rect x="45" y="96" width="440" height="96" rx="6"
        fill="rgba(255,255,255,0.04)" stroke="#dbdfe6" stroke-width="2"/>
  <rect x="61" y="112" width="150" height="64" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <text x="136" y="140" font-size="15" text-anchor="middle" fill="#ff8a8a">как вызывать</text>
  <text x="136" y="162" font-size="14" text-anchor="middle" fill="#ff8a8a">указатель</text>

  <rect x="231" y="112" width="238" height="64" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="350" y="140" font-size="16" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">[](int a, int b)</text>
  <text x="350" y="164" font-size="14" text-anchor="middle" fill="#80828c">буфер ~16 байт</text>

  <text x="45" y="240" font-size="16" fill="#80828c">маленькая цель лежит прямо внутри обёртки:</text>
  <text x="45" y="264" font-size="16" fill="#80828c">выделения в куче нет</text>

  <!-- цель не влезла -->
  <text x="560" y="52" font-size="19" fill="#dbdfe6">цель не влезла</text>
  <text x="560" y="84" font-size="15" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">std::function&lt;int(int, int)&gt;</text>

  <rect x="560" y="96" width="440" height="96" rx="6"
        fill="rgba(255,255,255,0.04)" stroke="#dbdfe6" stroke-width="2"/>
  <rect x="576" y="112" width="150" height="64" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <text x="651" y="140" font-size="15" text-anchor="middle" fill="#ff8a8a">как вызывать</text>
  <text x="651" y="162" font-size="14" text-anchor="middle" fill="#ff8a8a">указатель</text>

  <rect x="746" y="112" width="238" height="64" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <text x="865" y="140" font-size="16" text-anchor="middle" fill="#ff8a8a">адрес в куче</text>
  <text x="865" y="164" font-size="14" text-anchor="middle" fill="#80828c">буфер мал</text>

  <line x1="865" y1="180" x2="865" y2="222" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>

  <text x="1000" y="242" font-size="15" text-anchor="end" fill="#80828c">куча</text>
  <rect x="700" y="252" width="300" height="56" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="850" y="287" font-size="16" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">[a, b, c, d](int, int)</text>

  <text x="560" y="240" font-size="16" fill="#80828c">под цель выделена</text>
  <text x="560" y="264" font-size="16" fill="#80828c">память в куче</text>

  <text x="530" y="326" font-size="16" text-anchor="middle" fill="#80828c">в обоих случаях вызов идёт через указатель: тело цели компилятор не встраивает</text>
</svg>
