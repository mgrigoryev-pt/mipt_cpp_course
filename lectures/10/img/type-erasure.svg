<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 380" width="1060" height="380"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="378" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- снаружи -->
  <text x="40" y="52" font-size="19" fill="#dbdfe6">снаружи: один тип</text>

  <text x="40" y="94" font-size="15" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">BinaryOp add</text>
  <rect x="40" y="104" width="240" height="64" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <text x="160" y="142" font-size="18" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">impl_</text>

  <text x="40" y="234" font-size="15" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">BinaryOp scale</text>
  <rect x="40" y="244" width="240" height="64" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <text x="160" y="282" font-size="18" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">impl_</text>

  <line x1="282" y1="136" x2="466" y2="136" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>
  <line x1="282" y1="276" x2="466" y2="276" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>

  <!-- в куче -->
  <text x="470" y="52" font-size="19" fill="#dbdfe6">в куче: свой наследник на каждую цель</text>

  <rect x="470" y="70" width="406" height="110" fill="rgba(255,255,255,0.04)"
        stroke="#3a3a40" stroke-width="1.5"/>
  <text x="486" y="94" font-size="16" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">CallableHolder&lt;F&gt;</text>
  <rect x="486" y="104" width="180" height="64" fill="none"
        stroke="#80828c" stroke-width="1.5"/>
  <text x="576" y="122" font-size="13" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">ICallable</text>
  <text x="576" y="153" font-size="17" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">vptr</text>
  <rect x="680" y="104" width="180" height="64" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="770" y="134" font-size="15" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">[](int a, int b)</text>
  <text x="770" y="156" font-size="14" text-anchor="middle" fill="#80828c">f_</text>

  <rect x="470" y="210" width="530" height="110" fill="rgba(255,255,255,0.04)"
        stroke="#3a3a40" stroke-width="1.5"/>
  <text x="486" y="234" font-size="16" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">CallableHolder&lt;G&gt;</text>
  <rect x="486" y="244" width="180" height="64" fill="none"
        stroke="#80828c" stroke-width="1.5"/>
  <text x="576" y="262" font-size="13" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">ICallable</text>
  <text x="576" y="293" font-size="17" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">vptr</text>
  <rect x="680" y="244" width="304" height="64" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="832" y="274" font-size="15" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">[k, shift](int a, int b)</text>
  <text x="832" y="296" font-size="14" text-anchor="middle" fill="#80828c">f_, два захвата</text>

  <text x="530" y="356" font-size="16" text-anchor="middle" fill="#80828c">обёртки одного размера; тип цели известен только в шаблонном конструкторе, дальше вызов идёт через vptr</text>
</svg>
