<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" width="1060" height="300"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff2020"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="298" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="36" x2="530" y2="268" stroke="#26262b" stroke-width="1.5"/>

  <!-- [this] -->
  <text x="40" y="52" font-size="19" fill="#dbdfe6">
    <tspan font-family="Consolas, Roboto Mono, monospace" fill="#ff8a8a">[this]</tspan> — захвачен указатель</text>

  <text x="40" y="92" font-size="15" fill="#5c5e66">объект Counter разрушен</text>
  <rect x="40" y="102" width="180" height="62" fill="none" stroke="#5c5e66"
        stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="130" y="182" font-size="15" text-anchor="middle" fill="#5c5e66"
        font-family="Consolas, Roboto Mono, monospace">Counter c</text>
  <line x1="48" y1="158" x2="212" y2="108" stroke="#ff2020" stroke-width="2"/>
  <line x1="48" y1="108" x2="212" y2="158" stroke="#ff2020" stroke-width="2"/>

  <rect x="292" y="92" width="208" height="94" rx="6"
        fill="rgba(255,255,255,0.04)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="308" y="120" font-size="15" fill="#80828c">замыкание</text>
  <rect x="308" y="132" width="176" height="42" fill="rgba(255,138,138,0.08)"
        stroke="#ff8a8a" stroke-width="2"/>
  <text x="396" y="160" font-size="16" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">Counter* this</text>

  <line x1="286" y1="140" x2="228" y2="136" stroke="#ff2020" stroke-width="2.5"
        stroke-dasharray="7 5" marker-end="url(#red)"/>

  <text x="40" y="226" font-size="16" fill="#ff2020">в замыкании только адрес — вызов после смерти объекта UB</text>

  <!-- [*this] -->
  <text x="560" y="52" font-size="19" fill="#dbdfe6">
    <tspan font-family="Consolas, Roboto Mono, monospace" fill="#ffffff">[*this]</tspan> — захвачена копия</text>

  <text x="560" y="92" font-size="15" fill="#5c5e66">объект Counter разрушен</text>
  <rect x="560" y="102" width="180" height="62" fill="none" stroke="#5c5e66"
        stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="650" y="182" font-size="15" text-anchor="middle" fill="#5c5e66"
        font-family="Consolas, Roboto Mono, monospace">Counter c</text>
  <line x1="568" y1="158" x2="732" y2="108" stroke="#ff2020" stroke-width="2"/>
  <line x1="568" y1="108" x2="732" y2="158" stroke="#ff2020" stroke-width="2"/>

  <rect x="812" y="92" width="208" height="94" rx="6"
        fill="rgba(255,255,255,0.04)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="828" y="120" font-size="15" fill="#80828c">замыкание</text>
  <rect x="828" y="132" width="176" height="42" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="916" y="160" font-size="16" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">Counter (копия)</text>

  <text x="560" y="226" font-size="16" fill="#dbdfe6">объект лежит внутри замыкания — связи с оригиналом нет</text>
</svg>
