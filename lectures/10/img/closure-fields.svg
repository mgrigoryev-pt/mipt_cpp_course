<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" width="1060" height="330"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
    <marker id="grey" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="328" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <text x="50" y="50" font-size="17" fill="#80828c">лямбда-выражение</text>
  <text x="590" y="50" font-size="17" fill="#80828c">тип замыкания, сгенерированный компилятором</text>

  <text x="60" y="106" font-size="22" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">[x, &amp;y]</text>
  <text x="60" y="152" font-size="22" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">(int n)</text>
  <text x="60" y="198" font-size="20" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">{ return x + y + n; }</text>

  <rect x="580" y="70" width="440" height="188" rx="6"
        fill="rgba(255,255,255,0.04)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="600" y="104" font-size="17" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">class __Lambda {</text>
  <text x="620" y="142" font-size="18" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">int  x;</text>
  <text x="620" y="174" font-size="18" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">int&amp; y;</text>
  <text x="620" y="212" font-size="17" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">auto operator()(int n) const;</text>
  <text x="600" y="244" font-size="17" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">};</text>

  <path d="M 165 98 C 350 98, 380 150, 572 150" fill="none" stroke="#ff8a8a"
        stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="370" y="80" font-size="16" text-anchor="middle" fill="#ff8a8a">захваты становятся полями</text>

  <path d="M 305 192 C 420 192, 430 212, 572 212" fill="none" stroke="#80828c"
        stroke-width="2" marker-end="url(#grey)"/>
  <text x="410" y="252" font-size="16" text-anchor="middle" fill="#80828c">параметры и тело — в operator()</text>

  <text x="60" y="300" font-size="16" fill="#80828c">захват по значению — поле-копия, захват по ссылке — поле-ссылка</text>
</svg>
