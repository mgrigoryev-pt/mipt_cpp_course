<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 372" width="1060" height="372"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
    <marker id="grey" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="370" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- dog -->
  <text x="70" y="56" font-size="15" fill="#80828c">объект <tspan font-family="Consolas, Roboto Mono, monospace">dog</tspan></text>
  <rect x="70" y="66" width="260" height="32" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="2"/>
  <rect x="70" y="98" width="260" height="32" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="1.5"/>
  <rect x="70" y="130" width="260" height="32" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="1.5"/>
  <text x="90" y="87" font-size="15" fill="#ff8a8a" font-family="Consolas, Roboto Mono, monospace">ops</text>
  <text x="90" y="119" font-size="15" fill="#dbdfe6" font-family="Consolas, Roboto Mono, monospace">name = "Sharik"</text>
  <text x="90" y="151" font-size="15" fill="#dbdfe6" font-family="Consolas, Roboto Mono, monospace">age_years = 3</text>

  <line x1="330" y1="82" x2="466" y2="82" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

  <text x="470" y="56" font-size="15" fill="#80828c">таблица <tspan font-family="Consolas, Roboto Mono, monospace">kDogOps</tspan></text>
  <rect x="470" y="66" width="430" height="48" fill="rgba(255,255,255,0.04)" stroke="#dbdfe6" stroke-width="1.5"/>
  <rect x="470" y="114" width="430" height="48" fill="rgba(255,255,255,0.04)" stroke="#dbdfe6" stroke-width="1.5"/>
  <g font-family="Consolas, Roboto Mono, monospace">
    <text x="494" y="97" font-size="16" fill="#80828c">sound</text>
    <text x="494" y="145" font-size="16" fill="#80828c">human_age</text>
    <text x="664" y="97" font-size="17" fill="#dbdfe6">dog_sound</text>
    <text x="664" y="145" font-size="17" fill="#dbdfe6">dog_human_age</text>
  </g>
  <g stroke="#80828c" stroke-width="2">
    <line x1="600" y1="91" x2="648" y2="91" marker-end="url(#grey)"/>
    <line x1="600" y1="139" x2="648" y2="139" marker-end="url(#grey)"/>
  </g>

  <!-- bird -->
  <text x="70" y="192" font-size="15" fill="#80828c">объект <tspan font-family="Consolas, Roboto Mono, monospace">bird</tspan></text>
  <rect x="70" y="202" width="260" height="32" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="2"/>
  <rect x="70" y="234" width="260" height="32" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="1.5"/>
  <rect x="70" y="266" width="260" height="32" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="1.5"/>
  <text x="90" y="223" font-size="15" fill="#ff8a8a" font-family="Consolas, Roboto Mono, monospace">ops</text>
  <text x="90" y="255" font-size="15" fill="#dbdfe6" font-family="Consolas, Roboto Mono, monospace">name = "Kesha"</text>
  <text x="90" y="287" font-size="15" fill="#dbdfe6" font-family="Consolas, Roboto Mono, monospace">age_years = 3</text>

  <line x1="330" y1="218" x2="466" y2="218" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

  <text x="470" y="192" font-size="15" fill="#80828c">таблица <tspan font-family="Consolas, Roboto Mono, monospace">kBirdOps</tspan></text>
  <rect x="470" y="202" width="430" height="48" fill="rgba(255,255,255,0.04)" stroke="#dbdfe6" stroke-width="1.5"/>
  <rect x="470" y="250" width="430" height="48" fill="rgba(255,255,255,0.04)" stroke="#dbdfe6" stroke-width="1.5"/>
  <g font-family="Consolas, Roboto Mono, monospace">
    <text x="494" y="233" font-size="16" fill="#80828c">sound</text>
    <text x="494" y="281" font-size="16" fill="#80828c">human_age</text>
    <text x="664" y="233" font-size="17" fill="#dbdfe6">bird_sound</text>
    <text x="664" y="281" font-size="17" fill="#dbdfe6">bird_human_age</text>
  </g>
  <g stroke="#80828c" stroke-width="2">
    <line x1="600" y1="227" x2="648" y2="227" marker-end="url(#grey)"/>
    <line x1="600" y1="275" x2="648" y2="275" marker-end="url(#grey)"/>
  </g>

  <text x="530" y="340" font-size="16" text-anchor="middle" fill="#dbdfe6">таблица одна на вид, а не на объект; <tspan font-family="Consolas, Roboto Mono, monospace">self</tspan> — это <tspan font-family="Consolas, Roboto Mono, monospace">this</tspan>, написанный руками</text>
</svg>
