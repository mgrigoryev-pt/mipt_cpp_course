<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 326" width="1060" height="326"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="324" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="570" y1="40" x2="570" y2="300" stroke="#26262b" stroke-width="1.5"/>

  <!-- одна таблица на всех -->
  <text x="300" y="62" font-size="18" text-anchor="middle" fill="#dbdfe6">в объекте — только указатель</text>

  <g>
    <rect x="70" y="84" width="90" height="34" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="1.5"/>
    <rect x="160" y="84" width="90" height="34" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="1.5"/>
    <rect x="70" y="130" width="90" height="34" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="1.5"/>
    <rect x="160" y="130" width="90" height="34" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="1.5"/>
    <rect x="70" y="176" width="90" height="34" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="1.5"/>
    <rect x="160" y="176" width="90" height="34" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="1.5"/>
  </g>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13" text-anchor="middle">
    <text x="115" y="106" fill="#ff8a8a">vptr</text>
    <text x="115" y="152" fill="#ff8a8a">vptr</text>
    <text x="115" y="198" fill="#ff8a8a">vptr</text>
    <text x="205" y="106" fill="#80828c">age</text>
    <text x="205" y="152" fill="#80828c">age</text>
    <text x="205" y="198" fill="#80828c">age</text>
  </g>
  <text x="160" y="236" font-size="14" text-anchor="middle" fill="#80828c">…и ещё миллион таких</text>

  <g stroke="#ff8a8a" stroke-width="2.5">
    <line x1="252" y1="101" x2="344" y2="146" marker-end="url(#pink)"/>
    <line x1="252" y1="147" x2="344" y2="152" marker-end="url(#pink)"/>
    <line x1="252" y1="193" x2="344" y2="158" marker-end="url(#pink)"/>
  </g>

  <rect x="350" y="112" width="190" height="80" fill="rgba(255,255,255,0.04)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="445" y="140" font-size="16" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">vtable</text>
  <text x="445" y="164" font-size="14" text-anchor="middle" fill="#80828c">одна на класс</text>

  <text x="300" y="292" font-size="16" text-anchor="middle" fill="#dbdfe6">миллион объектов — миллион указателей и одна таблица</text>

  <!-- байты -->
  <text x="800" y="62" font-size="18" text-anchor="middle" fill="#dbdfe6">во что это обходится в байтах</text>

  <text x="600" y="92" font-size="15" fill="#dbdfe6" font-family="Consolas, Roboto Mono, monospace">Plain</text>
  <rect x="600" y="100" width="80" height="46" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="640" y="129" font-size="14" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">int</text>
  <text x="640" y="164" font-size="12" text-anchor="middle" fill="#5c5e66">4</text>
  <text x="704" y="132" font-size="16" fill="#dbdfe6"><tspan font-family="Consolas, Roboto Mono, monospace">sizeof</tspan> = 4</text>

  <text x="600" y="196" font-size="15" fill="#dbdfe6" font-family="Consolas, Roboto Mono, monospace">Polymorphic</text>
  <rect x="600" y="204" width="160" height="46" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="2"/>
  <rect x="760" y="204" width="80" height="46" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <rect x="840" y="204" width="80" height="46" fill="none" stroke="#3a3a40" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="680" y="233" font-size="15" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">vptr</text>
  <text x="800" y="233" font-size="14" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">int</text>
  <text x="880" y="233" font-size="13" text-anchor="middle" fill="#5c5e66">pad</text>
  <g font-size="12" text-anchor="middle" fill="#5c5e66">
    <text x="680" y="268">8</text>
    <text x="800" y="268">4</text>
    <text x="880" y="268">4</text>
  </g>
  <text x="600" y="296" font-size="16" fill="#dbdfe6"><tspan font-family="Consolas, Roboto Mono, monospace">sizeof</tspan> = 16 = 8 + 4 + 4</text>
</svg>
