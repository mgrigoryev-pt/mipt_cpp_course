<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 306" width="1060" height="306"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="304" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="40" x2="530" y2="278" stroke="#26262b" stroke-width="1.5"/>

  <!-- upcast -->
  <text x="290" y="62" font-size="19" text-anchor="middle" fill="#dbdfe6">upcast — вверх по иерархии</text>

  <text x="235" y="88" font-size="15" text-anchor="middle" fill="#ff8a8a">видит <tspan font-family="Consolas, Roboto Mono, monospace">Animal*</tspan></text>
  <path d="M 150 106 V 98 H 320 V 106" fill="none" stroke="#ff8a8a" stroke-width="2"/>

  <rect x="150" y="112" width="170" height="64" fill="rgba(255,255,255,0.06)" stroke="#dbdfe6" stroke-width="2"/>
  <rect x="320" y="112" width="170" height="64" fill="rgba(255,255,255,0.03)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="235" y="150" font-size="16" text-anchor="middle" fill="#dbdfe6">часть Animal</text>
  <text x="405" y="150" font-size="16" text-anchor="middle" fill="#80828c">поля Dog</text>

  <text x="100" y="150" font-size="18" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">pa</text>
  <line x1="118" y1="144" x2="146" y2="144" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

  <text x="320" y="204" font-size="15" text-anchor="middle" fill="#80828c">объект Dog в памяти</text>

  <text x="290" y="246" font-size="17" text-anchor="middle" fill="#dbdfe6">адрес тот же, взгляд уже</text>
  <text x="290" y="274" font-size="15" text-anchor="middle" fill="#80828c">преобразование неявное и безопасное</text>

  <!-- downcast -->
  <text x="780" y="62" font-size="19" text-anchor="middle" fill="#ff2020">downcast — вниз, без проверки</text>

  <text x="780" y="92" font-size="15" text-anchor="middle" fill="#ff2020">как видит <tspan font-family="Consolas, Roboto Mono, monospace">Dog*</tspan></text>
  <rect x="602" y="100" width="356" height="88" fill="none" stroke="#ff2020" stroke-width="2" stroke-dasharray="7 6"/>

  <rect x="610" y="112" width="170" height="64" fill="rgba(255,255,255,0.06)" stroke="#dbdfe6" stroke-width="2"/>
  <rect x="780" y="112" width="70" height="64" fill="rgba(255,255,255,0.03)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="695" y="150" font-size="16" text-anchor="middle" fill="#dbdfe6">часть Animal</text>
  <text x="815" y="150" font-size="16" text-anchor="middle" fill="#80828c">Cat</text>

  <rect x="858" y="112" width="102" height="64" fill="none" stroke="#3a3a40" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="909" y="147" font-size="13" text-anchor="middle" fill="#5c5e66">чужая</text>
  <text x="909" y="164" font-size="13" text-anchor="middle" fill="#5c5e66">память</text>

  <text x="562" y="150" font-size="18" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">pa</text>
  <line x1="578" y1="144" x2="606" y2="144" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

  <text x="780" y="218" font-size="17" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">static_cast&lt;Dog*&gt;(pa)</text>
  <text x="780" y="248" font-size="16" text-anchor="middle" fill="#ff2020">компилируется, но это UB</text>
  <text x="780" y="276" font-size="15" text-anchor="middle" fill="#80828c">на деле там Cat — проверить компилятор не может</text>
</svg>
