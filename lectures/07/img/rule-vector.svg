  <rect x="212" y="188" width="208" height="86" fill="rgba(255,255,255,0.04)" stroke="#dbdfe6" stroke-width="2"/>
  <rect x="428" y="188" width="208" height="86" fill="rgba(255,255,255,0.04)" stroke="#dbdfe6" stroke-width="2"/>
