  <path d="M 212 282 V 290 H 852 V 282" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="532" y="318" font-size="16" text-anchor="middle" fill="#dbdfe6">каждый — наследник <tspan font-family="Consolas, Roboto Mono, monospace">Rule</tspan>; <tspan font-family="Consolas, Roboto Mono, monospace">Check</tspan> не знает ни одного из них</text>
