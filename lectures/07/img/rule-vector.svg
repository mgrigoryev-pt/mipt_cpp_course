    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="342" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <text x="182" y="104" font-size="18" text-anchor="end" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">rules</text>

  <rect x="200" y="70" width="660" height="56" fill="none" stroke="#dbdfe6" stroke-width="2"/>

  <rect x="212" y="80" width="208" height="36" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="1.5"/>
  <rect x="428" y="80" width="208" height="36" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="1.5"/>
  <rect x="644" y="80" width="208" height="36" fill="rgba(255,138,138,0.08)" stroke="#ff8a8a" stroke-width="1.5"/>
  <g font-size="14" text-anchor="middle" fill="#ff8a8a" font-family="Consolas, Roboto Mono, monospace">
    <text x="316" y="103">unique_ptr</text>
    <text x="532" y="103">unique_ptr</text>
    <text x="748" y="103">unique_ptr</text>
  </g>

  <g stroke="#ff8a8a" stroke-width="2.5">
    <line x1="316" y1="126" x2="316" y2="184" marker-end="url(#pink)"/>
    <line x1="532" y1="126" x2="532" y2="184" marker-end="url(#pink)"/>
    <line x1="748" y1="126" x2="748" y2="184" marker-end="url(#pink)"/>
