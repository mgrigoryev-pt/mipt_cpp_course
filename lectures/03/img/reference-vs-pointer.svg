<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 320" width="1060" height="320"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="318" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="34" x2="530" y2="286" stroke="#26262b" stroke-width="1.5"/>

  <!-- ссылка -->
  <text x="40" y="54" font-size="19" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">int&amp; y = x;</text>

  <text x="215" y="130" font-size="17" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">int x</text>
  <text x="345" y="130" font-size="17" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">int&amp; y</text>
  <line x1="215" y1="140" x2="215" y2="160" stroke="#80828c" stroke-width="1.5"/>
  <line x1="345" y1="140" x2="345" y2="160" stroke="#80828c" stroke-width="1.5"/>

  <rect x="140" y="160" width="280" height="62" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="280" y="203" font-size="28" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">5</text>

  <text x="280" y="250" font-size="15" text-anchor="middle" fill="#5c5e66">одна ячейка — два имени</text>
  <text x="40" y="290" font-size="17" fill="#dbdfe6">своей памяти у ссылки нет, переадресовать нельзя</text>

  <!-- указатель -->
  <text x="570" y="54" font-size="19" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">int* p = &amp;x;</text>

  <text x="655" y="130" font-size="17" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">int* p</text>
  <text x="905" y="130" font-size="17" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">int x</text>
  <line x1="655" y1="140" x2="655" y2="160" stroke="#80828c" stroke-width="1.5"/>
  <line x1="905" y1="140" x2="905" y2="160" stroke="#80828c" stroke-width="1.5"/>

  <rect x="570" y="160" width="170" height="62" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="655" y="199" font-size="18" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">0x7ffd10c0</text>

  <rect x="815" y="160" width="180" height="62" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="905" y="203" font-size="28" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">5</text>

  <line x1="740" y1="191" x2="807" y2="191" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>

  <text x="655" y="250" font-size="15" text-anchor="middle" fill="#5c5e66">адрес x</text>
  <text x="905" y="250" font-size="15" text-anchor="middle" fill="#5c5e66">сам объект</text>
  <text x="570" y="290" font-size="17" fill="#dbdfe6">p — отдельный объект: можно обнулить и переставить</text>
</svg>
