<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 370" width="1060" height="370"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
    <marker id="grey" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#80828c"/>
    </marker>
    <g id="lock">
      <rect x="-11" y="-2" width="22" height="17" rx="3" fill="#ff2020"/>
      <path d="M -6 -2 v -5 a 6 6 0 0 1 12 0 v 5" fill="none" stroke="#ff2020" stroke-width="2.5"/>
    </g>
  </defs>

  <rect x="1" y="1" width="1058" height="368" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <text x="40" y="134" font-size="16" fill="#80828c">у вызывающего</text>
  <text x="40" y="268" font-size="16" fill="#80828c">внутри функции</text>

  <!-- 1. по значению -->
  <text x="265" y="56" font-size="16" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">std::string</text>
  <rect x="170" y="100" width="190" height="56" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="265" y="137" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">"hello"</text>
  <line x1="265" y1="162" x2="265" y2="228" stroke="#80828c" stroke-width="2"
        stroke-dasharray="6 5" marker-end="url(#grey)"/>
  <rect x="170" y="234" width="190" height="56" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="265" y="271" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">"hello"</text>
  <text x="265" y="322" font-size="15" text-anchor="middle" fill="#dbdfe6">своя копия</text>
  <text x="265" y="346" font-size="15" text-anchor="middle" fill="#80828c">оригинал не тронут</text>

  <!-- 2. ссылка -->
  <text x="485" y="56" font-size="16" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">std::string&amp;</text>
  <rect x="390" y="100" width="190" height="56" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="485" y="137" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">"hello"</text>
  <line x1="485" y1="248" x2="485" y2="162" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>
  <text x="485" y="274" font-size="20" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">s</text>
  <text x="485" y="322" font-size="15" text-anchor="middle" fill="#dbdfe6">то же место</text>
  <text x="485" y="346" font-size="15" text-anchor="middle" fill="#80828c">изменения видны</text>

  <!-- 3. const-ссылка -->
  <text x="705" y="56" font-size="16" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">const std::string&amp;</text>
  <rect x="610" y="100" width="190" height="56" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="705" y="137" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">"hello"</text>
  <line x1="705" y1="248" x2="705" y2="162" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>
  <use href="#lock" x="737" y="196"/>
  <text x="705" y="274" font-size="20" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">s</text>
  <text x="705" y="322" font-size="15" text-anchor="middle" fill="#dbdfe6">то же место</text>
  <text x="705" y="346" font-size="15" text-anchor="middle" fill="#ff2020">писать нельзя</text>

  <!-- 4. указатель -->
  <text x="925" y="56" font-size="16" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">std::string*</text>
  <rect x="830" y="100" width="190" height="56" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="925" y="137" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">"hello"</text>
  <line x1="925" y1="228" x2="925" y2="162" stroke="#ff8a8a" stroke-width="2.5"
        marker-end="url(#pink)"/>
  <rect x="830" y="234" width="190" height="56" fill="rgba(255,255,255,0.05)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="925" y="269" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">0x7ffd10c0</text>
  <text x="925" y="322" font-size="15" text-anchor="middle" fill="#dbdfe6">то же место</text>
  <text x="925" y="346" font-size="15" text-anchor="middle" fill="#80828c">а может быть nullptr</text>
</svg>
