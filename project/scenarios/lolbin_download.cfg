; Загрузка через системную утилиту и запуск загруженного. Сценарий занятия 3.1:
; правило из двух шагов со связкой «путь записи попал в командную строку».

[sim]
events   = lolbin_download.log
delivery = inline
speed    = instant
self_pid = 4242
seed     = 1
report   = lolbin_download.report.txt

[edr]
out = lolbin_download.detections.txt

[world]
process = pid=4    ppid=0 image="System" start=0 protected=1
process = pid=880  ppid=4 image="C:\Windows\explorer.exe" start=1729999000000 user=DESKTOP\max
process = pid=1300 ppid=880 image="C:\Program Files\Google\Chrome\Application\chrome.exe" start=1729999500000 user=DESKTOP\max

[agent]
quarantine_dir = C:\quarantine
telemetry      = detections_only

[expect]
detection      = pid=3340   ; штатная утилита качает файл из сети
must_kill      = pid=3340
must_not_kill  = pid=1300
must_not_kill  = pid=880
must_move      = from="C:\Users\max\AppData\Local\Temp\upd.exe"
max_unsafe_kills = 0
max_os_queries   = 200
max_detections   = 4
