; Нагрузочный сценарий. Журнала в репозитории нет: он весит сотни мегабайт
; и генерируется на месте — `gen_stress --events 2000000`. Зерно фиксировано,
; поэтому у всех получается один и тот же журнал.
;
; Атак здесь нет. Сценарий нужен для двух замеров: сколько событий в секунду
; переваривает движок правил и не растёт ли модель сущностей без предела.
; Второе важнее: агент — долгоживущий процесс, и «работает час, съедает
; гигабайт» это отказ, а не мелкая неопрятность.

[sim]
events   = stress.log
delivery = inline
speed    = instant
self_pid = 4242
seed     = 1
report   = stress.report.txt

[edr]
out = stress.detections.txt

[world]
; Мир пустой: процессы и файлы появляются из самого журнала.

[agent]
quarantine_dir = C:\quarantine
telemetry      = detections_only

[expect]
max_detections   = 0
max_unsafe_kills = 0
