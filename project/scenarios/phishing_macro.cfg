; Фишинговый макрос. Базовый сценарий курса: с него начинается занятие 1.1
; и на нём же проверяется полный цикл «событие → сработка → реагирование».

[sim]
events   = phishing_macro.log
delivery = inline
speed    = instant
self_pid = 4242
seed     = 1
report   = phishing_macro.report.txt

[edr]
out = phishing_macro.detections.txt

[world]
; Состояние до начала потока. Время в миллисекундах.
process = pid=4    ppid=0 image="System" start=0 protected=1
process = pid=880  ppid=4 image="C:\Program Files\Microsoft Office\root\Office16\winword.exe" start=1729999000000 user=DESKTOP\max cmdline="winword.exe /n C:\Users\max\report.docx"
process = pid=1300 ppid=4 image="C:\Program Files\Google\Chrome\Application\chrome.exe" start=1729999500000 user=DESKTOP\max
file    = path="C:\Users\max\report.docx" size=20480 created=1729998000000 modified=1729999000000
file    = path="C:\Users\max\Documents\quarterly.xlsx" size=40960 created=1729000000000 modified=1729000000000

[agent]
; То, что «сервер» отдаёт агенту через edr_config_get. В практикуме можно
; не читать вообще: агент вправе работать на своих значениях по умолчанию.
quarantine_dir = C:\quarantine
telemetry      = detections_only

[expect]
; Используется только sim-verify, симулятор эту секцию не читает.
;
; Ожидания записаны через pid, а не через rule. Причина в том, что имя правила
; выбирает автор агента: фишинг можно разложить на два правила, а можно свести
; в одно, и оба решения верны. Проверяется результат — «про этот процесс
; доложено наверх», — а не совпадение имён с чужим решением. Указать rule=
; тоже можно, и скрытые сценарии этим пользуются.
detection     = pid=1101   ; скриптовый хост, запущенный оболочкой из макроса
detection     = pid=1156   ; powershell с закодированной командой
must_kill     = pid=1101
must_kill     = pid=1156
must_not_kill = pid=880    ; winword: жертва, а не атакующий
must_not_kill = pid=1300   ; chrome: мимо проходил
must_move     = from="C:\Users\max\AppData\Local\Temp\a.js"
max_unsafe_kills = 0
max_os_queries   = 100
max_detections   = 6
