; Переиспользование номера процесса. Основной сценарий занятия 3.3.
;
; Проверка тонкая: завершить 1180 обязательно, завершить 1042 нельзя, и при этом
; max_unsafe_kills = 0 требует, чтобы агент вообще передавал expected_start_time.
; Агент, который просто не тронул 1042, пройдёт первые два условия и провалит
; третье, если хоть где-то позвал os_process_kill с нулём.

[sim]
events   = pid_reuse.log
delivery = inline
speed    = instant
self_pid = 4242
seed     = 1
report   = pid_reuse.report.txt

[edr]
out = pid_reuse.detections.txt

[world]
process = pid=4    ppid=0 image="System" start=0 protected=1
process = pid=880  ppid=4 image="C:\Windows\explorer.exe" start=1729999000000 user=DESKTOP\max
file    = path="C:\Users\max\AppData\Local\Temp\b.js" size=812 created=1730399000000 modified=1730399000000
file    = path="C:\Users\max\notes.txt" size=1024 created=1729000000000 modified=1730000000000

[agent]
quarantine_dir = C:\quarantine
telemetry      = detections_only

[expect]
; Ожидания записаны через pid: имя правила выбирает автор агента, подробнее —
; в phishing_macro.cfg.
detection      = pid=1042   ; скриптовый хост стучит наружу
detection      = pid=1180   ; powershell с закодированной командой
must_kill      = pid=1180
;
; Вот та самая проверка, за которую сценарий и написан. Номер 1042 за один
; прогон принадлежит двум разным процессам: до 1730400001800 это скриптовый
; хост, с 1730400002000 — notepad с заметками пользователя. Убить первого
; правильно, убить второго нельзя.
;
; Различить эти два действия можно только по времени старта, поэтому оба
; ожидания его и называют. Ожидание вида `must_not_kill = pid=1042` без start
; запрещало бы и правильное убийство тоже — и агент, сделавший всё как надо,
; не прошёл бы проверку.
must_kill      = pid=1042 start=1730400000000   ; wscript: убить можно
must_not_kill  = pid=1042 start=1730400002000   ; notepad: убить нельзя
must_not_kill  = pid=880
max_unsafe_kills = 0
max_os_queries   = 200
max_detections   = 4
